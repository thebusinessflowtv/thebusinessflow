name: MediaForge — Deploy Cloudflare Backend
# lofi-only-remote-queue-safe-deployment: 2026-10-10 v2

on:
  # Video-control-plane API is served here; live encoders remain on OVH and are not restarted by this deploy.
  push:
    paths:
      - '.github/workflows/deploy-mediaforge-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/mediaforge-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEDIAFORGE_ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      MEDIAFORGE_ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
      MEDIAFORGE_SESSION_SECRET: ${{ secrets.MEDIAFORGE_SESSION_SECRET }}
      MEDIAFORGE_GITHUB_TOKEN: ${{ secrets.MEDIAFORGE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MEDIAFORGE_ADMIN_EMAIL MEDIAFORGE_ADMIN_PASSWORD MEDIAFORGE_SESSION_SECRET MEDIAFORGE_GITHUB_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not configured as a GitHub Actions secret"
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install

      - name: Ensure R2 bucket exists
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket list 2>&1 | grep -q 'mediaforge-live-assets'; then
            echo 'R2 bucket already exists.'
          else
            npx wrangler r2 bucket create mediaforge-live-assets
          fi

      - name: Ensure D1 database exists and bind it
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create mediaforge-control > /tmp/d1-create.txt
            cat /tmp/d1-create.txt
            DB_ID="$(grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}' /tmp/d1-create.txt | tail -1 || true)"
          fi
          if [ -z "$DB_ID" ]; then
            echo '::error::Could not resolve the D1 database UUID.'
            exit 1
          fi
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          echo "D1 binding configured."

      - name: Apply D1 schema
        run: npx wrangler d1 execute mediaforge-control --remote --file=schema.sql --yes

      - name: Deploy Worker and resolve URL
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/mediaforge-deploy.txt
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/mediaforge-deploy.txt | tail -1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo '::error::Worker deployed but workers.dev URL could not be resolved from Wrangler output.'
            cat /tmp/mediaforge-deploy.txt
            exit 1
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "Resolved Worker URL: $WORKER_URL"

      - name: Configure Worker secrets
        run: |
          set -euo pipefail
          printf '%s' "$MEDIAFORGE_ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          printf '%s' "$MEDIAFORGE_ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$MEDIAFORGE_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf '%s' "$MEDIAFORGE_GITHUB_TOKEN" | npx wrangler secret put GITHUB_WORKFLOW_TOKEN

      - name: Verify Worker health
        run: |
          set -euo pipefail
          sleep 4
          curl --retry 5 --retry-all-errors -fsS "$WORKER_URL/api/health" | tee /tmp/mediaforge-health.json
          grep -q '"supabase":false' /tmp/mediaforge-health.json

      - name: Smoke test isolated video control API
        run: |
          set -euo pipefail
          LOGIN="$(jq -nc --arg email "$MEDIAFORGE_ADMIN_EMAIL" --arg password "$MEDIAFORGE_ADMIN_PASSWORD" '{email:$email,password:$password}')"
          TOKEN="$(curl -fsS -H 'content-type: application/json' -d "$LOGIN" "$WORKER_URL/api/auth/login" | jq -r '.token')"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          curl -fsS -H "authorization: Bearer $TOKEN" "$WORKER_URL/api/video/channels" > /tmp/video-channels.json
          jq -e '.channels | any(.slug=="nba-stars") and any(.slug=="the-business-flow")' /tmp/video-channels.json >/dev/null
          echo 'VIDEO_CONTROL_API_OK'

      - name: Publish Worker URL to MediaForge Pages config
        run: |
          set -euo pipefail
          CONFIG="window.MEDIAFORGE_CONFIG = { API_URL: '${WORKER_URL}' };"
          printf '%s\n' "$CONFIG" > "$GITHUB_WORKSPACE/control-center/mediaforge-config.js"
          printf '%s\n' "$CONFIG" > "$GITHUB_WORKSPACE/docs/control-center/mediaforge-config.js"
          cd "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control-center/mediaforge-config.js docs/control-center/mediaforge-config.js
          if git diff --cached --quiet; then
            echo 'MediaForge API URL already published.'
          else
            git commit -m 'mediaforge: publish Cloudflare backend URL'
            git restore cloudflare/mediaforge-worker/wrangler.jsonc || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deployment summary
        run: |
          echo "### MediaForge Cloudflare backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: $WORKER_URL/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storage: Cloudflare R2 / mediaforge-live-assets" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database: Cloudflare D1 / mediaforge-control" >> "$GITHUB_STEP_SUMMARY"
          echo "- Supabase dependency for Lives: removed" >> "$GITHUB_STEP_SUMMARY"


      - name: Publish video API deploy result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git restore cloudflare/mediaforge-worker/wrangler.jsonc || true
          mkdir -p control
          node - <<'NODE'
          const fs=require('fs');
          const out={
            kind:'video-control-api',
            status:process.env.JOB_STATUS||'unknown',
            commit:process.env.GITHUB_SHA||'',
            run_id:process.env.GITHUB_RUN_ID||'',
            updated_at:new Date().toISOString()
          };
          fs.writeFileSync('control/video-api-deploy-result.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/video-api-deploy-result.json
          git commit -m "mediaforge: record video API deploy result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
