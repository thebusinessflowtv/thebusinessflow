name: Patch Office Music Image Picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-office-music-image-picker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make fixed image selection visible by default
        run: |
          set -euo pipefail
          for p in control-center/office-music.js docs/control-center/office-music.js; do
            sed -i 's#<option value="video">Vídeo em loop — master do GitHub</option><option value="image">Imagem fixa — durante o vídeo inteiro</option>#<option value="image" selected>Imagem fixa — usar no vídeo inteiro</option><option value="video">Vídeo em loop — master do GitHub</option>#' "$p"
            sed -i 's#class="field hidden" id="fixedImageField"><label>Imagem fixa</label>#class="field" id="fixedImageField"><label>Imagem que será usada no vídeo inteiro</label>#' "$p"
            sed -i 's#Você pode enviar novas imagens na aba Assets e depois selecioná-las aqui.#Selecione aqui a imagem que ficará fixa do primeiro ao último segundo do vídeo. Você pode enviar novas imagens na aba Assets.#' "$p"
            sed -i 's#<br><br>Vídeo padrão: #<br><br><b>Arquivos:</b> cada faixa gerada é salva individualmente em WAV no GitHub Release do job, além do mix final.<br><br>Vídeo padrão alternativo: #' "$p"
          done
          grep -q 'option value="image" selected' control-center/office-music.js
          grep -q 'cada faixa gerada é salva individualmente em WAV' control-center/office-music.js
      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control-center/office-music.js docs/control-center/office-music.js
          git commit -m "office-music: show fixed image picker by default" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
