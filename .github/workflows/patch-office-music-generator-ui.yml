name: Patch Office Music Generator UI

on:
  push:
    paths:
      - '.github/workflows/patch-office-music-generator-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch generator UI
        run: python scripts/patch-office-music-generator-ui.py
      - name: Validate patched files
        run: |
          set -euo pipefail
          grep -q 'visual_asset_id' control-center/office-music.js
          grep -q 'Proteção contra repetição ativada' control-center/office-music.js
          grep -q 'visual_asset_id' docs/control-center/office-music.js
          grep -q 'office-music.js?v=20260929-4' control-center/office-music.html
          grep -q 'office-music.js?v=20260929-4' docs/control-center/office-music.html
      - name: Commit site update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control-center/office-music.js docs/control-center/office-music.js control-center/office-music.html docs/control-center/office-music.html
          git commit -m "office-music: add fixed-image mode and anti-repeat UX" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
