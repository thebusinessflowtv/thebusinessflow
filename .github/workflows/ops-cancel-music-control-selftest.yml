name: MediaForge — Cancel Music Control Selftest

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-cancel-music-control-selftest.yml'

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install
      - name: Resolve D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - name: Cancel selftest commands
        working-directory: cloudflare/mediaforge-worker
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "UPDATE ovh_commands SET status='cancelled',completed_at='$NOW',error='control selftest cancelled before agent recovery' WHERE status IN ('pending','claimed') AND (id LIKE 'music-next-test-%' OR id LIKE 'music-prev-test-%');"
          npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,action,status,error FROM ovh_commands WHERE id LIKE 'music-%-test-%' ORDER BY created_at DESC LIMIT 10;"
