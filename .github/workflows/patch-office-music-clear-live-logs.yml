name: Patch Office Music Clear Live Logs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-office-music-clear-live-logs.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Office Music live history UI
        run: node scripts/patch-office-music-clear-live-logs.cjs
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control-center/office-music.js docs/control-center/office-music.js
          git commit -m "office-music: add clear live logs button" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
