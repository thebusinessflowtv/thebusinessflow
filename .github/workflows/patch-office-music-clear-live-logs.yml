name: Patch Office Music Clear Live Logs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-office-music-clear-live-logs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add clear live history button
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths=[Path('control-center/office-music.js'),Path('docs/control-center/office-music.js')]
          old_header='<div class="grid"><div class="card pad"><div class="row between"><h3 class="section-title" style="margin:0">Lives</h3><button id="refreshLives" class="btn">↻ Atualizar</button></div><div class="list" style="margin-top:12px">${liveSessionsHtml()}</div></div><div class="card pad"><h3 class="section-title">Configuração automática</h3>'
          new_header='<div class="grid"><div class="card pad"><div class="row between wrap"><h3 class="section-title" style="margin:0">Lives</h3><div class="row wrap"><button id="clearLiveLogs" class="btn danger">Limpar logs</button><button id="refreshLives" class="btn">↻ Atualizar</button></div></div><div class="tiny muted" style="margin-top:7px">Limpar logs remove apenas lives encerradas ou com falha. Uma transmissão ativa nunca é apagada.</div><div class="list" style="margin-top:12px">${liveSessionsHtml()}</div></div><div class="card pad"><h3 class="section-title">Configuração automática</h3>'
          old_handler="    root.querySelector('#refreshLives').onclick=refresh;\n"
          new_handler="""    root.querySelector('#refreshLives').onclick=refresh;
    const clearLiveLogs=root.querySelector('#clearLiveLogs');
    if(clearLiveLogs)clearLiveLogs.onclick=async()=>{
      if(!confirm('Limpar o histórico de lives encerradas e com falha? Lives ativas não serão removidas.'))return;
      clearLiveLogs.disabled=true;clearLiveLogs.textContent='Limpando…';
      try{
        const {error}=await client.from('office_music_live_sessions').delete().in('status',['failed','completed']);
        if(error)throw error;
        toast('Logs de lives limpos','Foram removidas apenas transmissões encerradas ou com falha.');
        await refresh();
      }catch(e){toast('Falha ao limpar logs',e.message||String(e),'error');clearLiveLogs.disabled=false;clearLiveLogs.textContent='Limpar logs'}
    };
"""
          for p in paths:
            s=p.read_text(encoding='utf-8')
            changed=False
            if 'id="clearLiveLogs"' not in s:
              if old_header not in s:
                raise SystemExit(f'Live header pattern not found in {p}')
              s=s.replace(old_header,new_header,1);changed=True
            if "client.from('office_music_live_sessions').delete().in('status',['failed','completed'])" not in s:
              if old_handler not in s:
                raise SystemExit(f'Refresh handler pattern not found in {p}')
              s=s.replace(old_handler,new_handler,1);changed=True
            if changed:
              p.write_text(s,encoding='utf-8')
              print('Patched',p)
            else:
              print('Already patched',p)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control-center/office-music.js docs/control-center/office-music.js
          git commit -m "office-music: add clear live logs button" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
