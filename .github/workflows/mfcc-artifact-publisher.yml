name: MFCC Downloadable Artifacts

on:
  workflow_run:
    workflows: ["The Business Flow Daily Production"]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    # Publish whenever the parent run finished and left a valid production artifact.
    # This also preserves a finished render if a later non-render step failed.
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download production package
        uses: actions/download-artifact@v4
        with:
          pattern: tbf-production-*
          path: restored
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare standalone script and production id
        id: output
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(find restored/output -type f -name episode-package.json | head -n 1)"
          test -s "$PACKAGE"
          test -s restored/rendered/final.mp4
          test -s restored/rendered/thumbnail.png
          python - "$PACKAGE" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text(encoding='utf-8'))
          production_id=str(d.get('mfcc_production_id') or d.get('production_id') or d.get('topic_id') or '').strip()
          if not production_id:
              raise SystemExit('Missing production id')
          script=str(d.get('script') or '').strip()
          if not script:
              raise SystemExit('Missing script')
          Path('restored/rendered/script.txt').write_text(script+'\n',encoding='utf-8')
          print(f'production_id={production_id}')
          PY
      - name: Upload standalone MP4
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-video-${{ steps.output.outputs.production_id }}-${{ github.event.workflow_run.id }}
          path: restored/rendered/final.mp4
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload standalone thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-thumbnail-${{ steps.output.outputs.production_id }}-${{ github.event.workflow_run.id }}
          path: restored/rendered/thumbnail.png
          if-no-files-found: error
          retention-days: 90
      - name: Upload standalone script
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-script-${{ steps.output.outputs.production_id }}-${{ github.event.workflow_run.id }}
          path: restored/rendered/script.txt
          if-no-files-found: error
          retention-days: 90
      - name: Install resumable uploader
        run: npm install --no-save tus-js-client@4
      - name: Save final video in private MediaForge storage
        env:
          MFCC_PRODUCTION_ID: ${{ steps.output.outputs.production_id }}
          MFCC_OUTPUT_KIND: video
          MFCC_OUTPUT_FILE: restored/rendered/final.mp4
        run: node tools/mfcc_upload_output.mjs
      - name: Save thumbnail in private MediaForge storage
        env:
          MFCC_PRODUCTION_ID: ${{ steps.output.outputs.production_id }}
          MFCC_OUTPUT_KIND: thumbnail
          MFCC_OUTPUT_FILE: restored/rendered/thumbnail.png
        run: node tools/mfcc_upload_output.mjs
      - name: Save script in private MediaForge storage
        env:
          MFCC_PRODUCTION_ID: ${{ steps.output.outputs.production_id }}
          MFCC_OUTPUT_KIND: script
          MFCC_OUTPUT_FILE: restored/rendered/script.txt
        run: node tools/mfcc_upload_output.mjs
