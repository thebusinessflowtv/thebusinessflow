name: MediaForge — Probe Local Admin Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-probe-local-admin-secrets.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      A: ${{ secrets.ADMIN_EMAIL }}
      B: ${{ secrets.ADMIN_PASSWORD }}
      C: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      D: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
      E: ${{ secrets.MEDIAFORGE_EMAIL }}
      F: ${{ secrets.MEDIAFORGE_PASSWORD }}
    steps:
      - name: Presence only
        shell: bash
        run: |
          for n in A B C D E F; do
            if [ -n "${!n:-}" ]; then echo "$n=present"; else echo "$n=missing"; fi
          done
