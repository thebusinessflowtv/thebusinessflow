name: One-off — Probe OVH Deploy Queue
# trigger: 2026-10-05T23:47Z gta-autosync

on:
  push:
    paths:
      - '.github/workflows/oneoff-probe-ovh-deploy-queue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
      API: https://mediaforge-api.guilhermeodsgn.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Reload control agent for GTA playlist auto-sync
        run: |
          set -euo pipefail
          API="https://mediaforge-api.guilhermeodsgn.workers.dev"
          LOGIN="$(jq -nc --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          TOKEN="$(curl -fsS -H 'content-type: application/json' -d "$LOGIN" "$API/api/auth/login" | jq -r '.token')"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          ID="gta-autosync-reload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d "$(jq -nc --arg id "$ID" '{action:"reload_control_agent",target:"ovh-agent",request_id:$id,source:"gta-playlist-autosync"}')" \
            "$API/api/ovh/deploy" > /tmp/gta-reload-create.json
          for N in $(seq 1 120); do
            curl -fsS -H "authorization: Bearer $TOKEN" "$API/api/ovh/deploy-status?id=$ID" > /tmp/gta-reload-status.json
            STATUS="$(jq -r '.command.status // empty' /tmp/gta-reload-status.json)"
            echo "gta_autosync_reload=$STATUS"
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] && { cat /tmp/gta-reload-status.json; exit 1; }
            sleep 3
          done
          jq -e '.command.status=="completed"' /tmp/gta-reload-status.json >/dev/null
          jq -e '.command.result.media_publishers_touched==false' /tmp/gta-reload-status.json >/dev/null
          echo "GTA_AUTOSYNC_AGENT_DEPLOYED"

      # GTA playlist autosync control-agent deploy
      - name: Probe queue
        run: |
          set -euo pipefail
          LOGIN="$(jq -nc --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          TOKEN="$(curl -fsS -H 'content-type: application/json' -d "$LOGIN" "$API/api/auth/login" | jq -r '.token')"
          curl -fsS -H "authorization: Bearer $TOKEN" "$API/api/ovh/deploy-status" | jq . > control/ovh-deploy-probe.json
          curl -fsS -H "authorization: Bearer $TOKEN" "$API/api/ovh/status" | jq . > control/ovh-runtime-probe.json
          cat control/ovh-deploy-probe.json
          cat control/ovh-runtime-probe.json
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/ovh-deploy-probe.json control/ovh-runtime-probe.json
          git commit -m "probe: OVH deploy queue" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
