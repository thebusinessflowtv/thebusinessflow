name: MediaForge — Twitch Kick Deep Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-twitch-kick-deep-diagnostic.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install
      - name: Resolve D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - name: Reload host diagnostic code
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="reload-host-deepdiag-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"deploy_host_agent\",\"target\":\"host-agent\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"deepdiag\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','deploy_host_agent','host-agent','$PAYLOAD','pending','$NOW');"
          for i in $(seq 1 30); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/reload.json
            if grep -q '"status": "completed"' /tmp/reload.json; then break; fi
            if grep -q '"status": "failed"' /tmp/reload.json; then cat /tmp/reload.json; exit 1; fi
            sleep 3
          done
          cat /tmp/reload.json
      - name: Diagnose Twitch and Kick
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          : > /tmp/ids
          for SLOT in twitch kick; do
            ID="deepdiag-$SLOT-$(date -u +%Y%m%d%H%M%S)"
            PAYLOAD="{\"id\":\"$ID\",\"action\":\"diagnose_service\",\"target\":\"$SLOT\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"deepdiag\"}"
            npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','diagnose_service','$SLOT','$PAYLOAD','pending','$NOW');"
            echo "$SLOT=$ID" >> /tmp/ids
          done
          for i in $(seq 1 40); do
            ALL=1
            while IFS='=' read -r SLOT ID; do
              npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > "/tmp/$SLOT.json"
              grep -q '"status": "completed"' "/tmp/$SLOT.json" || ALL=0
            done < /tmp/ids
            [ "$ALL" = "1" ] && break
            sleep 3
          done
          while IFS='=' read -r SLOT ID; do
            echo "===== $SLOT ====="
            cat "/tmp/$SLOT.json"
          done < /tmp/ids
