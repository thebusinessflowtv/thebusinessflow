name: MediaForge — Restart Twitch and Kick Only

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-restart-twitch-kick-only.yml'

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install

      - name: Resolve D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Recreate Twitch only
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="restart-twitch-clean-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"deploy_service\",\"target\":\"twitch\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"clean-av-restart\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','deploy_service','twitch','$PAYLOAD','pending','$NOW');"
          echo "TWITCH_ID=$ID" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/twitch.json
            if grep -q '"status": "completed"' /tmp/twitch.json; then break; fi
            if grep -q '"status": "failed"' /tmp/twitch.json; then cat /tmp/twitch.json; exit 1; fi
            sleep 3
          done
          cat /tmp/twitch.json
          grep -q '"status": "completed"' /tmp/twitch.json

      - name: Recreate Kick only
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="restart-kick-clean-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"deploy_service\",\"target\":\"kick\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"clean-av-restart\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','deploy_service','kick','$PAYLOAD','pending','$NOW');"
          echo "KICK_ID=$ID" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/kick.json
            if grep -q '"status": "completed"' /tmp/kick.json; then break; fi
            if grep -q '"status": "failed"' /tmp/kick.json; then cat /tmp/kick.json; exit 1; fi
            sleep 3
          done
          cat /tmp/kick.json
          grep -q '"status": "completed"' /tmp/kick.json

      - name: Verify Twitch and Kick health
        run: |
          set -euo pipefail
          sleep 15
          curl -fsS --retry 5 --retry-all-errors https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/public-health | tee /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          s=d.get('services') or {}
          for slot in ('twitch','kick'):
              x=s.get(slot) or {}
              print(slot, json.dumps(x,ensure_ascii=False))
              if x.get('status')!='live':
                  raise SystemExit(f'{slot} not live')
              if x.get('visual_status')!='streaming':
                  raise SystemExit(f'{slot} visual not streaming')
          PY
