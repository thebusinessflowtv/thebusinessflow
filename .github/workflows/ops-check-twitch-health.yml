name: MediaForge — Check Twitch Health

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-check-twitch-health.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Public OVH health
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            if curl -fsS --retry 2 https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/public-health | tee /tmp/health.json; then
              break
            fi
            sleep 3
          done
          echo
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          t=(d.get('services') or {}).get('twitch') or {}
          print('TWITCH_STATUS='+str(t.get('status')))
          print('TWITCH_UPDATED_AT='+str(t.get('updated_at')))
          print('TWITCH_RESTARTS='+str(t.get('restarts')))
          print('TWITCH_HOT_SWAP='+str(t.get('hot_swap')))
          print('TWITCH_NOW_PLAYING='+str((t.get('now_playing') or {}).get('title')))
          if t.get('status') != 'live':
              raise SystemExit('Twitch is not live')
          PY
