name: MediaForge — Deploy GTA Playlist Auto Sync
# trigger: 2026-10-05T21:12:00-03:00 recover-after-api-rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-deploy-gta-playlist-autosync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - name: Wait for OVH-local API and login
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN=""
          for i in $(seq 1 60); do
            LOGIN="$(curl -ksS --connect-timeout 5 --max-time 15 -X POST "$BASE/api/auth/login"               -H 'content-type: application/json'               --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')" 2>/dev/null || true)"
            TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty' 2>/dev/null || true)"
            [ -n "$TOKEN" ] && break
            echo "api_login_retry=$i"
            sleep 3
          done
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" >/tmp/token
          echo "LOCAL_API_BACK"

      - name: Confirm or recover control-plane publish
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"; TOKEN="$(cat /tmp/token)"
          EXISTING="gta-control-plane-37392488459"
          STATUS=""
          for i in $(seq 1 40); do
            OUT="$(curl -ksS "$BASE/api/ovh/deploy-status?id=$EXISTING" -H "authorization: Bearer $TOKEN" 2>/dev/null || true)"
            STATUS="$(printf '%s' "$OUT" | jq -r '.command.status // empty' 2>/dev/null || true)"
            echo "existing_control_plane=$STATUS"
            [ "$STATUS" = "completed" ] && { printf '%s' "$OUT" >/tmp/control-plane.json; break; }
            [ "$STATUS" = "failed" ] && { printf '%s' "$OUT" >/tmp/control-plane.json; break; }
            sleep 3
          done

          if [ "$STATUS" != "completed" ]; then
            ID="gta-control-plane-recovery-${GITHUB_RUN_ID}"
            curl -kfsS -X POST "$BASE/api/ovh/deploy" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json'               --data "$(jq -nc --arg id "$ID" '{action:"deploy_host_agent",target:"host-agent",request_id:$id,source:"gta-third-slot-recovery"}')" >/tmp/recover-create.json
            for i in $(seq 1 180); do
              OUT="$(curl -ksS "$BASE/api/ovh/deploy-status?id=$ID" -H "authorization: Bearer $TOKEN" 2>/dev/null || true)"
              ST="$(printf '%s' "$OUT" | jq -r '.command.status // empty' 2>/dev/null || true)"
              echo "control_plane_recovery=$ST"
              [ "$ST" = "completed" ] && { printf '%s' "$OUT" >/tmp/control-plane.json; break; }
              [ "$ST" = "failed" ] && { printf '%s' "$OUT" >/tmp/control-plane.json; cat /tmp/control-plane.json; exit 1; }
              sleep 5
            done
          fi
          jq -e '.command.status=="completed"' /tmp/control-plane.json >/dev/null
          jq '.command.result.control_plane_publish // {}' /tmp/control-plane.json

      - name: Deploy GTA runtime engines into control agent
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"; TOKEN="$(cat /tmp/token)"
          ID="gta-runtime-${GITHUB_RUN_ID}"
          curl -kfsS -X POST "$BASE/api/ovh/deploy" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json'             --data "$(jq -nc --arg id "$ID" '{action:"reload_control_agent",target:"ovh-agent",request_id:$id,source:"gta-third-slot-runtime"}')" >/tmp/runtime-create.json
          for i in $(seq 1 100); do
            OUT="$(curl -ksS "$BASE/api/ovh/deploy-status?id=$ID" -H "authorization: Bearer $TOKEN" 2>/dev/null || true)"
            ST="$(printf '%s' "$OUT" | jq -r '.command.status // empty' 2>/dev/null || true)"
            echo "runtime_reload=$ST"
            [ "$ST" = "completed" ] && { printf '%s' "$OUT" >/tmp/runtime.json; break; }
            [ "$ST" = "failed" ] && { printf '%s' "$OUT" >/tmp/runtime.json; cat /tmp/runtime.json; exit 1; }
            sleep 3
          done
          jq -e '.command.status=="completed"' /tmp/runtime.json >/dev/null
          jq -e '.command.result.media_publishers_touched==false' /tmp/runtime.json >/dev/null

      - name: Verify GTA playlist and third YouTube slot
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"; TOKEN="$(cat /tmp/token)"
          sleep 10
          curl -kfsS "$BASE/api/ovh/status" -H "authorization: Bearer $TOKEN" >/tmp/health.json
          curl -kfsS "$BASE/api/music-library" -H "authorization: Bearer $TOKEN" >/tmp/library.json
          echo "YOUTUBE_SLOTS:"
          jq '.youtube_slots | map({name,ovh_slot,status,current_session_id,youtube_stream_id})' /tmp/health.json
          echo "GTA_PLAYLIST:"
          jq '.playlists[] | select(.key=="gta-vi-vice-city") | {key,name,track_count,total_duration_seconds}' /tmp/library.json
          GTA_COUNT="$(jq -r '[.playlists[]? | select(.key=="gta-vi-vice-city")] | length' /tmp/library.json)"
          GTA_SLOT="$(jq -r '[.youtube_slots[]? | select(.ovh_slot=="youtube-gta-vi")] | length' /tmp/health.json)"
          GTA_STATUS="$(jq -r '.youtube_slots[]? | select(.ovh_slot=="youtube-gta-vi") | .status' /tmp/health.json)"
          test "$GTA_COUNT" -eq 1
          test "$GTA_SLOT" -eq 1
          test "$GTA_STATUS" = "stopped"
          echo "GTA_YOUTUBE_SLOT_READY"
