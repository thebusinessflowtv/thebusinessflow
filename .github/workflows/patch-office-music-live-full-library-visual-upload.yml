name: Patch Office Music Live Full Library Visual Upload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-office-music-live-full-library-visual-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Office Music live patch
        run: python .github/scripts/patch_office_music_live.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control-center/office-music.js control-center/office-music.html docs/control-center/office-music.js docs/control-center/office-music.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "office-music: full live library, YouTube playlists and visual upload"
          git pull --rebase origin main
          git push origin HEAD:main
