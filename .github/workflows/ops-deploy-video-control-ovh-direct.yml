name: MediaForge — Direct OVH Video Control Deploy

on:
  push:
    paths:
      - '.github/workflows/ops-deploy-video-control-ovh-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Login directly to OVH and snapshot live encoders
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          LOGIN="$(curl -kfsS --retry 8 --retry-all-errors --retry-delay 2 -X POST "$BASE/api/auth/login"             -H 'content-type: application/json'             --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > /tmp/mf-token
          curl -kfsS -H "authorization: Bearer $TOKEN" "$BASE/api/ovh/status" > /tmp/live-before.json
          jq '{services:(.agent.services // {}) | with_entries(.value={status:.value.status,encoder_pid:.value.encoder_pid,restarts:.value.restarts})}' /tmp/live-before.json

      - name: Deploy only control-api
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN="$(cat /tmp/mf-token)"
          ID="video-control-api-$(date -u +%Y%m%d%H%M%S)"
          curl -kfsS -X POST "$BASE/api/ovh/deploy"             -H "authorization: Bearer $TOKEN"             -H 'content-type: application/json'             --data "$(jq -nc --arg id "$ID" '{action:"deploy_service",target:"control-api",request_id:$id,source:"video-control-plane-v2"}')"             > /tmp/create.json
          cat /tmp/create.json
          for I in $(seq 1 120); do
            if ! curl -kfsS --retry 4 --retry-all-errors --retry-delay 2               "$BASE/api/ovh/deploy-status?id=$ID"               -H "authorization: Bearer $TOKEN" > /tmp/status.json; then
              sleep 2
              continue
            fi
            ST="$(jq -r '.command.status // empty' /tmp/status.json)"
            echo "[$I] control-api=$ST"
            [ "$ST" = "completed" ] && break
            if [ "$ST" = "failed" ] || [ "$ST" = "cancelled" ]; then
              cat /tmp/status.json
              exit 1
            fi
            sleep 3
          done
          jq -e '.command.status=="completed"' /tmp/status.json >/dev/null
          cat /tmp/status.json

      - name: Prove live encoders were untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN="$(cat /tmp/mf-token)"
          curl -kfsS -H "authorization: Bearer $TOKEN" "$BASE/api/ovh/status" > /tmp/live-after.json
          node - <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/live-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/live-after.json','utf8'));
          const a=before?.agent?.services||{}, b=after?.agent?.services||{};
          for(const k of ['twitch','kick','youtube-deep-house','youtube-rainy','youtube-gta-vi']){
            if(!a[k]) continue;
            if(!b[k]) throw new Error(k+' disappeared');
            if(String(a[k].encoder_pid||'')!==String(b[k].encoder_pid||'')) throw new Error(k+' encoder PID changed');
            if(Number(a[k].restarts||0)!==Number(b[k].restarts||0)) throw new Error(k+' restart counter changed');
            if(String(a[k].status||'')!==String(b[k].status||'')) throw new Error(k+' status changed');
          }
          console.log('LIVE_ENCODERS_UNCHANGED');
          NODE

      - name: Verify public video UI source
        shell: bash
        run: |
          set -euo pipefail
          URL='https://peterlofi.odsgn.com.br/app-core.html?verify=video-control-plane-v2'
          for I in $(seq 1 30); do
            if curl -kfsS --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "$URL" -o /tmp/app-core.html; then
              if grep -q 'VIDEO_FACTORY_API_V2' /tmp/app-core.html && ! grep -q "if(!(await legacyReady())){legacyUnavailable(path);return}" /tmp/app-core.html; then
                echo 'PUBLIC_VIDEO_UI_OK'
                exit 0
              fi
            fi
            echo "Waiting for public UI ($I/30)"
            sleep 4
          done
          echo '::error::Public Control Center did not update to video API v2.'
          exit 1
