name: MediaForge — Test Track Controls Now

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-test-track-controls-now.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install
      - name: Resolve D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - name: Test next then previous on Twitch
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NEXT_ID="ui-test-next-$(date -u +%Y%m%d%H%M%S)-$RANDOM"
          NEXT_PAYLOAD="{\"id\":\"$NEXT_ID\",\"action\":\"skip\",\"runtime_slot\":\"twitch\",\"platform\":\"twitch\",\"source\":\"mediaforge-ui-control-test\",\"requested_at\":\"$NOW\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT INTO ovh_commands(id,runtime_slot,action,payload_json,status,created_at) VALUES('$NEXT_ID','twitch','skip','$NEXT_PAYLOAD','pending','$NOW');"
          for i in $(seq 1 25); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,claimed_at,completed_at,error FROM ovh_commands WHERE id='$NEXT_ID';" > /tmp/next.json
            cat /tmp/next.json
            grep -q '"status": "completed"' /tmp/next.json && break
            sleep 2
          done
          grep -q '"status": "completed"' /tmp/next.json

          sleep 4
          NOW2="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PREV_ID="ui-test-prev-$(date -u +%Y%m%d%H%M%S)-$RANDOM"
          PREV_PAYLOAD="{\"id\":\"$PREV_ID\",\"action\":\"previous\",\"runtime_slot\":\"twitch\",\"platform\":\"twitch\",\"source\":\"mediaforge-ui-control-test\",\"requested_at\":\"$NOW2\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT INTO ovh_commands(id,runtime_slot,action,payload_json,status,created_at) VALUES('$PREV_ID','twitch','previous','$PREV_PAYLOAD','pending','$NOW2');"
          for i in $(seq 1 25); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,claimed_at,completed_at,error FROM ovh_commands WHERE id='$PREV_ID';" > /tmp/prev.json
            cat /tmp/prev.json
            grep -q '"status": "completed"' /tmp/prev.json && break
            sleep 2
          done
          grep -q '"status": "completed"' /tmp/prev.json
