name: Patch Office Music Live YouTube and Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-office-music-live-youtube-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Office Music UI
        run: python scripts/patch-office-music-live-youtube-assets.py
      - name: Validate patch
        run: |
          set -euo pipefail
          grep -q 'YT_PLAYLIST_SNAPSHOT' control-center/office-music.js
          grep -q 'Playlist do YouTube' control-center/office-music.js
          grep -q 'Pré-visualizar' control-center/office-music.js
          grep -q 'rename_office_music_asset' control-center/office-music.js
          grep -q 'office-music.js?v=20260929-5' control-center/office-music.html
          grep -q 'YT_PLAYLIST_SNAPSHOT' docs/control-center/office-music.js
          grep -q 'office-music.js?v=20260929-5' docs/control-center/office-music.html
      - name: Commit UI update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control-center/office-music.js docs/control-center/office-music.js control-center/office-music.html docs/control-center/office-music.html
          git commit -m "office-music: add YouTube playlist selection and asset management" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
