name: MediaForge Twitch OAuth Callback Build Check

on:
  push:
    paths:
      - '.github/workflows/mediaforge-twitch-oauth-check.yml'
      - 'cloudflare/mediaforge-worker/src/twitch-oauth.js'
      - 'cloudflare/mediaforge-worker/src/twitch-bot-bridge.js'
      - 'cloudflare/mediaforge-worker/tests/twitch-bot-bridge.mjs'
      - 'scripts/activate-peterlofi-twitch-bot.py'
      - 'cloudflare/mediaforge-worker/Dockerfile.ovh'
      - 'cloudflare/mediaforge-worker/src/index.js'
      - 'scripts/configure-peterlofi-twitch-oauth.py'
      - 'scripts/repair-peterlofi-twitch-oauth.py'
      - 'cloudflare/mediaforge-worker/tests/twitch-oauth-callback.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check OAuth callback and MediaForge API syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/mediaforge-worker/src/twitch-oauth.js
          node --check cloudflare/mediaforge-worker/src/twitch-bot-bridge.js
          node cloudflare/mediaforge-worker/tests/twitch-bot-bridge.mjs
          python3 -m py_compile scripts/activate-peterlofi-twitch-bot.py
          node --check cloudflare/mediaforge-worker/src/index.js
          python3 -m py_compile scripts/configure-peterlofi-twitch-oauth.py
          python3 -m py_compile scripts/repair-peterlofi-twitch-oauth.py
          node --experimental-default-type=module cloudflare/mediaforge-worker/tests/twitch-oauth-callback.mjs
          cd cloudflare/mediaforge-worker
          npm install
          npx wrangler deploy --dry-run --config wrangler.ovh.jsonc
          grep -q 'apt-get install -y --no-install-recommends ca-certificates' Dockerfile.ovh
          grep -q 'ENV NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt' Dockerfile.ovh
          grep -q 'ENV SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' Dockerfile.ovh
          echo OAUTH_CALLBACK_BUILD_VALID
      - name: Ensure secrets remain in the private server environment
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TWITCH_CLIENT_SECRET' cloudflare/mediaforge-worker/src/twitch-oauth.js
          grep -q 'twitch_chat_oauth_tokens' cloudflare/mediaforge-worker/src/twitch-oauth.js
          echo TOKEN_STORAGE_CODE_PRESENT_NO_LIVE_CHANGE
