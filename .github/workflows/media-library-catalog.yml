name: The Business Flow Media Library Catalog

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL to a ZIP containing the media library"
        required: true
        type: string
      upload_to_supabase:
        description: "Upload organized assets + catalog to Supabase Storage"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      THEBUSINESSFLOW_MEDIA_BUCKET: mediaforge-assets
      THEBUSINESSFLOW_MEDIA_PREFIX: thebusinessflow/media-library

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r tools/requirements-media-library.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Download source ZIP
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            "$SOURCE_URL" -o .runtime/media-library.zip
          test -s .runtime/media-library.zip
          unzip -t .runtime/media-library.zip >/dev/null

      - name: Build catalog and organized library
        run: |
          set -euo pipefail
          python tools/build_media_catalog.py \
            .runtime/media-library.zip \
            --output-dir .runtime/generated
          cat .runtime/generated/summary.json

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-business-flow-media-catalog
          path: |
            .runtime/generated/catalog.json
            .runtime/generated/summary.json
          retention-days: 30

      - name: Upload organized library to Supabase
        if: ${{ inputs.upload_to_supabase }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "Missing secret SUPABASE_SECRET_KEY"; exit 1; }
          python tools/upload_media_library.py .runtime/generated
