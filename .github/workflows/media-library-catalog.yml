name: The Business Flow Media Library Catalog

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL to a ZIP containing the media library"
        required: true
        type: string

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r tools/requirements-media-library.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Download source ZIP
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            "$SOURCE_URL" -o .runtime/media-library.zip
          test -s .runtime/media-library.zip
          unzip -t .runtime/media-library.zip >/dev/null

      - name: Build catalog and organized library
        run: |
          set -euo pipefail
          python tools/build_media_catalog.py \
            .runtime/media-library.zip \
            --output-dir .runtime/generated
          cat .runtime/generated/summary.json

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-business-flow-media-catalog
          path: |
            .runtime/generated/catalog.json
            .runtime/generated/summary.json
          retention-days: 30

      - name: Explain publication path
        run: |
          echo "Heavy media is published to this repository through Git LFS from the local import scripts."
          echo "Repository: thebusinessflowtv/thebusinessflow"
          echo "Assets root: media-library/assets/"
