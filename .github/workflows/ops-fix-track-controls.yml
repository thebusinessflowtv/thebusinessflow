name: MediaForge — Fix Track Controls

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-fix-track-controls.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install

      - name: Resolve D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Deploy control backend
        working-directory: cloudflare/mediaforge-worker
        run: npx wrangler deploy

      - name: Reload host-agent source
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="reload-host-track-controls-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"deploy_host_agent\",\"target\":\"host-agent\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"track-controls-fix\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','deploy_host_agent','host-agent','$PAYLOAD','pending','$NOW');"
          for i in $(seq 1 40); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/host.json
            if grep -q '"status": "completed"' /tmp/host.json; then break; fi
            if grep -q '"status": "failed"' /tmp/host.json; then cat /tmp/host.json; exit 1; fi
            sleep 3
          done
          cat /tmp/host.json
          grep -q '"status": "completed"' /tmp/host.json

      - name: Reload control agent only
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="reload-control-agent-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"reload_control_agent\",\"target\":\"ovh-agent\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"track-controls-fix\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','reload_control_agent','ovh-agent','$PAYLOAD','pending','$NOW');"
          for i in $(seq 1 40); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/control.json
            if grep -q '"status": "completed"' /tmp/control.json; then break; fi
            if grep -q '"status": "failed"' /tmp/control.json; then cat /tmp/control.json; exit 1; fi
            sleep 3
          done
          cat /tmp/control.json
          grep -q '"status": "completed"' /tmp/control.json
          grep -q 'media_publishers_touched' /tmp/control.json

      - name: Smoke test queue transport without changing track
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,runtime_slot,action,status,created_at,claimed_at,completed_at,error FROM ovh_commands ORDER BY created_at DESC LIMIT 10;"
