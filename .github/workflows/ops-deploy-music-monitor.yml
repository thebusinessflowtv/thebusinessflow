name: MediaForge — Publish music queue monitor

on:
  push:
    paths:
      - '.github/workflows/ops-deploy-music-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate for control-panel deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://peterlofi.odsgn.com.br"
          LOGIN="$(curl -fsS --connect-timeout 8 --max-time 25 -X POST "$BASE/api/auth/login" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > /tmp/mf-token

      - name: Verify completed deployment and music APIs
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/mf-token)"
          BASE="https://peterlofi.odsgn.com.br"
          curl -fsS --retry 5 --retry-all-errors "$BASE/api/ovh/deploy-status?id=direct-control-center-20261004040434" -H "authorization: Bearer $TOKEN" > /tmp/status.json
          jq '{status:.command.status,error:.command.error,result:.command.result.mediaforge_control_plane}' /tmp/status.json
          jq -e '.command.status=="completed"' /tmp/status.json
          curl -fsS "$BASE/api/music/presets" -H "authorization: Bearer $TOKEN" | jq '{presets: (.presets|length)}'
          curl -fsS "$BASE/api/music/jobs" -H "authorization: Bearer $TOKEN" | jq '{jobs: (.jobs|length)}'
      - name: Verify music monitor on production
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 25 "https://peterlofi.odsgn.com.br/office-music.js?music-monitor=20261004" -o /tmp/music.js
          grep -q 'monitorGamingQueue' /tmp/music.js
          echo MUSIC_MONITOR_PUBLISHED
