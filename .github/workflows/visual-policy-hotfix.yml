name: The Business Flow Visual Policy Hotfix

on:
  push:
    paths:
      - 'production/visual-policy-hotfix.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply zero-reuse policy and restore queued topics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          workflow_path = Path('.github/workflows/daily-production.yml')
          text = workflow_path.read_text(encoding='utf-8')

          restore_visual = '''      - name: Restore visual asset cache
        id: visual-cache
        uses: actions/cache/restore@v4
        with:
          path: production/visual-cache/${{ steps.setup.outputs.topic_id }}
          key: tbf-visual-v1-${{ steps.setup.outputs.topic_id }}-${{ github.run_id }}
          restore-keys: |
            tbf-visual-v1-${{ steps.setup.outputs.topic_id }}-

'''
          if restore_visual in text:
              text = text.replace(restore_visual, '')

          save_visual = '''      - name: Save visual work immediately
        if: always() && steps.visual-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: production/visual-cache/${{ steps.setup.outputs.topic_id }}
          key: ${{ steps.visual-cache.outputs.cache-primary-key }}

'''
          if save_visual in text:
              text = text.replace(save_visual, '')

          text = text.replace(
              '      - name: Collect up to 50 topic-specific 16:9 images — free web sources, cache first\n',
              '      - name: Collect up to 50 topic-specific 16:9 images — fresh only, zero cross-video reuse\n'
          )
          text = text.replace(
              '          python production/collect_visual_assets.py \\\n',
              '          python production/collect_visual_assets_unique.py \\\n'
          )
          text = text.replace(
              'production/collect_visual_assets.py production/render_episode.py',
              'production/collect_visual_assets.py production/collect_visual_assets_unique.py production/register_used_visual_assets.py production/render_episode.py'
          )

          verifier_old = "          assert d.get('logos_excluded') is True\n"
          verifier_new = """          assert d.get('logos_excluded') is True
          assert d.get('fresh_only') is True, 'Visual package was not collected fresh'
          assert d.get('cross_video_reuse_allowed') is False, 'Cross-video visual reuse must be disabled'
          assert all(a.get('sha256') and a.get('perceptual_hash') for a in assets), 'Missing image fingerprints'
"""
          if verifier_new not in text:
              if verifier_old not in text:
                  raise SystemExit('Visual verifier anchor not found')
              text = text.replace(verifier_old, verifier_new, 1)

          register_step = '''      - name: Permanently reserve images used by this video
        shell: bash
        run: |
          set -euo pipefail
          python production/register_used_visual_assets.py \\
            --manifest "production/visual-cache/${{ steps.setup.outputs.topic_id }}/visual-assets.json" \\
            --registry production/used-visual-assets.json \\
            --topic-id "${{ steps.setup.outputs.topic_id }}" \\
            --run-id "${{ github.run_id }}"

'''
          preserve_anchor = '      - name: Preserve completed production artifact\n'
          if register_step not in text:
              if preserve_anchor not in text:
                  raise SystemExit('Preserve-artifact anchor not found')
              text = text.replace(preserve_anchor, register_step + preserve_anchor, 1)

          git_add_old = '          git add production/topics.json "production/research-library/${{ steps.setup.outputs.topic_id }}.json"\n'
          git_add_new = '          git add production/topics.json production/used-visual-assets.json "production/research-library/${{ steps.setup.outputs.topic_id }}.json"\n'
          if git_add_old in text:
              text = text.replace(git_add_old, git_add_new, 1)
          elif git_add_new not in text:
              raise SystemExit('Checkpoint git-add anchor not found')

          workflow_path.write_text(text, encoding='utf-8')

          # The queue topics were accidentally replaced by the reserve topic list.
          # Merge the original custom batch back in without deleting the newer reserve list.
          historical = json.loads(subprocess.check_output([
              'git', 'show', '7124b6d787ee89a143f44d4a821ace18bdab2932:production/topics.json'
          ], text=True))
          current_path = Path('production/topics.json')
          current = json.loads(current_path.read_text(encoding='utf-8'))
          wanted_ids = [
              'custom-10-american-billion-dollar-companies-2026-09',
              'custom-15-us-industries-billions-2026-09',
              'custom-top-5-most-valuable-us-companies-2026-09',
              'custom-5-us-market-shaping-companies-2026-09',
              'custom-3-american-global-giants-2026-09',
              'custom-americas-richest-companies-metrics-2026-09',
              'custom-5-companies-behind-global-infrastructure-2026-09',
              'custom-richest-american-family-2026-09',
              'custom-nvidia-real-money-engine-2026-09',
              'custom-google-real-money-machine-2026-09',
              'custom-broadcom-hidden-giant-2026-09',
          ]
          hist_by_id = {str(t.get('id')): t for t in historical.get('topics', [])}
          cur_topics = current.setdefault('topics', [])
          cur_by_id = {str(t.get('id')): t for t in cur_topics}
          for topic_id in wanted_ids:
              if topic_id not in cur_by_id:
                  source = hist_by_id.get(topic_id)
                  if not source:
                      raise SystemExit(f'Missing historical topic {topic_id}')
                  clone = json.loads(json.dumps(source))
                  cur_topics.append(clone)
                  cur_by_id[topic_id] = clone

          # Explicitly requeue the failed infrastructure video under the new visual policy.
          infra = cur_by_id['custom-5-companies-behind-global-infrastructure-2026-09']
          infra['status'] = 'ready'
          infra.pop('queue_block_reason', None)
          infra.pop('queue_blocked_at', None)
          infra['requeued_at'] = datetime.now(timezone.utc).isoformat()
          infra['requeue_reason'] = 'Requeued after zero-cross-video-image-reuse hotfix'

          # The richest-family run failed before this hotfix. Return it to ready so it can be retried later.
          family = cur_by_id['custom-richest-american-family-2026-09']
          family['status'] = 'ready'
          family.pop('queue_block_reason', None)
          family.pop('queue_blocked_at', None)

          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          state_path = Path('production/queue-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['current_topic'] = 'custom-5-companies-behind-global-infrastructure-2026-09'
          state['source_run_id'] = None
          attempts = state.setdefault('production_attempts', {})
          attempts['custom-5-companies-behind-global-infrastructure-2026-09'] = 0
          attempts['custom-richest-american-family-2026-09'] = 0
          state['last_action'] = 'visual_policy_hotfix_requeued'
          state['last_reason'] = 'Global Infrastructure requeued first under zero-reuse visual policy'
          state['updated_at'] = datetime.now(timezone.utc).isoformat()
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate patched Python and workflow markers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile production/collect_visual_assets_unique.py production/register_used_visual_assets.py
          grep -q 'fresh only, zero cross-video reuse' .github/workflows/daily-production.yml
          grep -q 'collect_visual_assets_unique.py' .github/workflows/daily-production.yml
          grep -q 'Permanently reserve images used by this video' .github/workflows/daily-production.yml
          if grep -q 'Restore visual asset cache' .github/workflows/daily-production.yml; then
            echo 'Visual cache restore still present'
            exit 1
          fi
          if grep -q 'Save visual work immediately' .github/workflows/daily-production.yml; then
            echo 'Visual cache save still present'
            exit 1
          fi

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The Business Flow Factory'
          git config user.email 'thebusinessflowtv@gmail.com'
          git add .github/workflows/daily-production.yml production/topics.json production/queue-state.json
          git commit -m 'Enforce zero visual reuse and restore production queue'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
