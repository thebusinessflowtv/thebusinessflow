name: Install MediaForge Control Center

on:
  push:
    paths:
      - '.github/workflows/mfcc-install-control-center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch production workflows
        run: python .github/scripts/mfcc_install.py
      - name: Commit installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MediaForge Control Center'
          git config user.email 'thebusinessflowtv@gmail.com'
          git add -A
          git commit -m 'Activate MediaForge Control Center production hooks'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
