name: Install MediaForge Control Center

on:
  push:
    paths:
      - '.github/workflows/mfcc-install-control-center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expr_topic = '$' + '{{ steps.setup.outputs.topic_id }}'
          expr_run = '$' + '{{ github.run_id }}'
          expr_input = '$' + '{{ inputs.topic_id || github.event_name }}'

          daily = Path('.github/workflows/daily-production.yml')
          text = daily.read_text(encoding='utf-8')
          if 'run-name: "MFCC Production' not in text:
              text = text.replace(
                  'name: The Business Flow Daily Production\n',
                  f'name: The Business Flow Daily Production\nrun-name: "MFCC Production {expr_input}"\n',
                  1,
              )

          marker = '      - name: Preserve completed production artifact\n'
          if 'name: Prepare Control Center downloadable script' not in text:
              insert = f'''      - name: Prepare Control Center downloadable script
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import json
          from pathlib import Path
          topic='{expr_topic}'
          package=Path(f'production/output/{{topic}}/episode-package.json')
          data=json.loads(package.read_text(encoding='utf-8'))
          script=str(data.get('script') or '')
          if not script.strip():
              raise SystemExit('Episode package has no script')
          Path('production/rendered/script.txt').write_text(script + '\\n', encoding='utf-8')
          PY2

'''
              if marker not in text:
                  raise SystemExit('Daily production artifact marker not found')
              text = text.replace(marker, insert + marker, 1)

          if 'production/rendered/script.txt' not in text:
              text = text.replace(
                  '            production/rendered/metadata.json\n',
                  '            production/rendered/metadata.json\n            production/rendered/script.txt\n',
                  1,
              )

          if 'name: Publish Control Center video artifact' not in text:
              anchor = '      - name: Commit durable checkpoints safely\n'
              extra = f'''      - name: Publish Control Center video artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-video-{expr_topic}-{expr_run}
          path: production/rendered/final.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish Control Center thumbnail artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-thumbnail-{expr_topic}-{expr_run}
          path: production/rendered/thumbnail.png
          if-no-files-found: error
          retention-days: 7

      - name: Publish Control Center script artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-script-{expr_topic}-{expr_run}
          path: production/rendered/script.txt
          if-no-files-found: error
          retention-days: 7

'''
              if anchor not in text:
                  raise SystemExit('Commit checkpoint marker not found')
              text = text.replace(anchor, extra + anchor, 1)
          daily.write_text(text, encoding='utf-8')

          private = Path('.github/workflows/private-upload-after-production.yml')
          p = private.read_text(encoding='utf-8')
          old = '''on:
  workflow_run:
    workflows: ["The Business Flow Daily Production"]
    types: [completed]
  push:
    paths:
      - 'production/private-upload-now.json'
'''
          new = '''on:
  push:
    paths:
      - 'production/private-upload-now.json'
  workflow_dispatch:
'''
          if old in p:
              p = p.replace(old, new, 1)
          p = p.replace(
              "    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'\n",
              "    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'\n",
              1,
          )
          private.write_text(p, encoding='utf-8')
          PY

          rm -f .github/workflows/mfcc-install-control-center.yml

      - name: Commit installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MediaForge Control Center'
          git config user.email 'thebusinessflowtv@gmail.com'
          git add -A
          git commit -m 'Activate MediaForge Control Center production hooks'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
