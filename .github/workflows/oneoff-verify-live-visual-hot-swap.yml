name: One-off — Verify Live Visual Hot Swap
# second visual probe: 2026-10-06

on:
  push:
    paths:
      - '.github/workflows/oneoff-verify-live-visual-hot-swap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
      API: https://146.59.156.224:8443
      EXPECTED_SIZE: "73674717"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find exact second visual in MediaForge
        shell: bash
        run: |
          set -euo pipefail
          LOGIN="$(jq -nc --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          TOKEN="$(curl -kfsS -H 'content-type: application/json' -d "$LOGIN" "$API/api/auth/login" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          curl -kfsS -H "authorization: Bearer $TOKEN" "$API/api/assets" > /tmp/assets.json

          MATCH="$(jq -c --argjson sz "$EXPECTED_SIZE" '[.assets[] | select(.asset_type=="loop") | select((.mime_type // "") | startswith("video/")) | select((.size_bytes // 0)==$sz)] | sort_by(.created_at) | last // empty' /tmp/assets.json)"
          mkdir -p control
          if [ -n "$MATCH" ] && [ "$MATCH" != "null" ]; then
            printf '%s' "$MATCH" | jq '{found:true,asset:{id,title,asset_type,mime_type,size_bytes,created_at,public_url}}' > control/second-4k-visual-probe.json
          else
            jq -n --argjson sz "$EXPECTED_SIZE" '{found:false,expected_size_bytes:$sz}' > control/second-4k-visual-probe.json
          fi
          cat control/second-4k-visual-probe.json

      - name: Commit sanitized result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/second-4k-visual-probe.json
          git commit -m "ops: record second 4K visual probe" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
