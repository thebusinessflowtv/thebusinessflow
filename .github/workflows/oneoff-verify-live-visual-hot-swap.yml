name: One-off — Verify Live Visual Hot Swap
# GTA Radio hot-swap: 2026-10-06

on:
  push:
    paths:
      - '.github/workflows/oneoff-verify-live-visual-hot-swap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
      API: https://146.59.156.224:8443
      PUBLIC_ORIGIN: https://peterlofi.odsgn.com.br
      EXPECTED_SIZE: "78955796"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve uploaded GTA VI Radio visual and capture live state
        shell: bash
        run: |
          set -euo pipefail
          LOGIN="$(jq -nc --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          TOKEN="$(curl -kfsS -H 'content-type: application/json' -d "$LOGIN" "$API/api/auth/login" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > /tmp/mf-token

          curl -kfsS -H "authorization: Bearer $TOKEN" "$API/api/assets" > /tmp/assets.json
          ASSET="$(jq -c --argjson sz "$EXPECTED_SIZE" '
            [.assets[]
              | select(.asset_type=="loop")
              | select((.mime_type // "") | startswith("video/"))
              | select((.size_bytes // 0)==$sz)
            ]
            | sort_by(.created_at)
            | last // empty
          ' /tmp/assets.json)"
          test -n "$ASSET" && test "$ASSET" != "null"
          ASSET_ID="$(printf '%s' "$ASSET" | jq -r '.id')"
          ASSET_TITLE="$(printf '%s' "$ASSET" | jq -r '.title')"
          ASSET_SIZE="$(printf '%s' "$ASSET" | jq -r '.size_bytes')"
          ASSET_CREATED="$(printf '%s' "$ASSET" | jq -r '.created_at')"
          RAW_URL="$(printf '%s' "$ASSET" | jq -r '.public_url')"
          PATH_ONLY="$(python -c 'import sys,urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).path)' "$RAW_URL")"
          LOOP_URL="$PUBLIC_ORIGIN$PATH_ONLY"
          echo "::add-mask::$LOOP_URL"
          printf '%s' "$LOOP_URL" > /tmp/loop-url
          printf '%s' "$ASSET_ID" > /tmp/asset-id
          printf '%s' "$ASSET_TITLE" > /tmp/asset-title

          # Validate that the exact already-uploaded asset is reachable before
          # issuing any command to either live.
          curl -fsS --retry 3 --retry-delay 1 -r 0-4095 "$LOOP_URL" -o /tmp/visual-probe.bin
          test -s /tmp/visual-probe.bin

          curl -kfsS -H "authorization: Bearer $TOKEN" "$API/api/ovh/status" > /tmp/before.json
          for SLOT in twitch kick; do
            STATUS="$(jq -r --arg s "$SLOT" '.agent.services[$s].status // empty' /tmp/before.json)"
            HOT="$(jq -r --arg s "$SLOT" '.agent.services[$s].hot_swap // false' /tmp/before.json)"
            PID="$(jq -r --arg s "$SLOT" '.agent.services[$s].encoder_pid // empty' /tmp/before.json)"
            test "$STATUS" = "live"
            test "$HOT" = "true"
            test -n "$PID"
          done

          jq -n             --arg id "$ASSET_ID"             --arg title "$ASSET_TITLE"             --argjson size "$ASSET_SIZE"             --arg created "$ASSET_CREATED"             '{asset:{id:$id,title:$title,size_bytes:$size,created_at:$created}}'             > /tmp/asset-safe.json
          cat /tmp/asset-safe.json

      - name: Hot-swap Twitch and Kick visual only
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/mf-token)"
          LOOP_URL="$(cat /tmp/loop-url)"

          : > /tmp/commands.ndjson
          for SLOT in twitch kick; do
            BODY="$(jq -nc --arg slot "$SLOT" --arg url "$LOOP_URL" '{runtime_slot:$slot,loop_url:$url}')"
            RESPONSE="$(curl -kfsS -X POST               -H "authorization: Bearer $TOKEN"               -H 'content-type: application/json'               -d "$BODY" "$API/api/ovh/visual")"
            CMD_ID="$(printf '%s' "$RESPONSE" | jq -r '.command.id // empty')"
            test -n "$CMD_ID"
            jq -nc --arg slot "$SLOT" --arg id "$CMD_ID" '{runtime_slot:$slot,command_id:$id}' >> /tmp/commands.ndjson
          done

          # Wait for both set_visual commands. No start/stop/restart action is sent.
          while read -r ROW; do
            SLOT="$(printf '%s' "$ROW" | jq -r '.runtime_slot')"
            ID="$(printf '%s' "$ROW" | jq -r '.command_id')"
            DONE=0
            for I in $(seq 1 80); do
              OUT="$(curl -kfsS -H "authorization: Bearer $TOKEN" "$API/api/ovh/control/$ID")"
              ST="$(printf '%s' "$OUT" | jq -r '.command.status // empty')"
              echo "$SLOT command=$ST"
              if [ "$ST" = "completed" ]; then DONE=1; break; fi
              if [ "$ST" = "failed" ]; then
                printf '%s' "$OUT" | jq '{command:{id:.command.id,runtime_slot:.command.runtime_slot,action:.command.action,status:.command.status,error:.command.error}}'
                exit 1
              fi
              sleep 2
            done
            test "$DONE" = "1"
          done < /tmp/commands.ndjson

      - name: Prove no-drop switch
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/mf-token)"
          LOOP_URL="$(cat /tmp/loop-url)"

          TW_PID="$(jq -r '.agent.services.twitch.encoder_pid' /tmp/before.json)"
          KI_PID="$(jq -r '.agent.services.kick.encoder_pid' /tmp/before.json)"
          TW_RESTARTS="$(jq -r '.agent.services.twitch.restarts // 0' /tmp/before.json)"
          KI_RESTARTS="$(jq -r '.agent.services.kick.restarts // 0' /tmp/before.json)"
          TW_REV="$(jq -r '.agent.services.twitch.visual_revision // 0' /tmp/before.json)"
          KI_REV="$(jq -r '.agent.services.kick.visual_revision // 0' /tmp/before.json)"

          OK=0
          for I in $(seq 1 120); do
            curl -kfsS -H "authorization: Bearer $TOKEN" "$API/api/ovh/status" > /tmp/after.json

            if [ "$(jq -r '.agent.services.twitch.encoder_pid' /tmp/after.json)" != "$TW_PID" ]                || [ "$(jq -r '.agent.services.kick.encoder_pid' /tmp/after.json)" != "$KI_PID" ]; then
              echo "::error::Encoder PID changed; visual switch was not zero-drop."
              exit 2
            fi
            if [ "$(jq -r '.agent.services.twitch.restarts // 0' /tmp/after.json)" != "$TW_RESTARTS" ]                || [ "$(jq -r '.agent.services.kick.restarts // 0' /tmp/after.json)" != "$KI_RESTARTS" ]; then
              echo "::error::Restart counter changed; visual switch was not zero-drop."
              exit 3
            fi

            TW_OK="$(jq -r --arg u "$LOOP_URL" --argjson r "$TW_REV" '
              (.agent.services.twitch.status=="live")
              and (.agent.services.twitch.hot_swap==true)
              and ((.agent.services.twitch.visual_revision // 0)>$r)
              and (.agent.services.twitch.visual_status=="streaming")
              and (.agent.services.twitch.loop_url==$u)
            ' /tmp/after.json)"
            KI_OK="$(jq -r --arg u "$LOOP_URL" --argjson r "$KI_REV" '
              (.agent.services.kick.status=="live")
              and (.agent.services.kick.hot_swap==true)
              and ((.agent.services.kick.visual_revision // 0)>$r)
              and (.agent.services.kick.visual_status=="streaming")
              and (.agent.services.kick.loop_url==$u)
            ' /tmp/after.json)"
            echo "verify $I twitch=$TW_OK kick=$KI_OK"
            if [ "$TW_OK" = "true" ] && [ "$KI_OK" = "true" ]; then
              OK=1
              break
            fi
            sleep 2
          done
          test "$OK" = "1"

          mkdir -p control
          ASSET_ID="$(cat /tmp/asset-id)"
          ASSET_TITLE="$(cat /tmp/asset-title)"
          jq -n             --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg asset_id "$ASSET_ID"             --arg asset_title "$ASSET_TITLE"             --arg tw_pid "$TW_PID"             --arg ki_pid "$KI_PID"             --argjson tw_before "$TW_REV"             --argjson ki_before "$KI_REV"             --argjson tw_after "$(jq -r '.agent.services.twitch.visual_revision' /tmp/after.json)"             --argjson ki_after "$(jq -r '.agent.services.kick.visual_revision' /tmp/after.json)"             --argjson tw_restarts "$TW_RESTARTS"             --argjson ki_restarts "$KI_RESTARTS"             '{
              status:"completed",
              checked_at:$checked_at,
              asset:{id:$asset_id,title:$asset_title},
              rtmp_restart:false,
              publisher_restart:false,
              twitch:{
                status:"live",
                encoder_pid_preserved:true,
                encoder_pid:$tw_pid,
                restart_counter_preserved:true,
                restarts:$tw_restarts,
                visual_revision_before:$tw_before,
                visual_revision_after:$tw_after,
                visual_status:"streaming"
              },
              kick:{
                status:"live",
                encoder_pid_preserved:true,
                encoder_pid:$ki_pid,
                restart_counter_preserved:true,
                restarts:$ki_restarts,
                visual_revision_before:$ki_before,
                visual_revision_after:$ki_after,
                visual_status:"streaming"
              }
            }' > control/visual-hot-swap-request-results.json
          cat control/visual-hot-swap-request-results.json

      - name: Commit sanitized results
        if: success()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/visual-hot-swap-request-results.json
          git commit -m "ops: confirm GTA VI Radio hot-swap on Twitch and Kick" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
