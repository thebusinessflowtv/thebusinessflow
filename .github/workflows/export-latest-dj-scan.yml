name: MediaForge — Export Latest DJ Scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-latest-dj-scan.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install

      - name: Resolve D1 database binding
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not resolve mediaforge-control D1 UUID"
            exit 1
          fi
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Export latest DJ scan from D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,total,processed,allowed,restricted,not_found,ambiguous,error_count,created_at,updated_at,completed_at FROM dj_catalog_scans WHERE processed > 0 ORDER BY created_at DESC LIMIT 10;" > /tmp/scans.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/scans.json','utf8'));
          const rows=(Array.isArray(raw)?raw:[]).flatMap(x=>x?.results||[]);
          if(!rows.length) throw new Error('No DJ scans found');
          const valid=rows.find(r=>Number(r.processed||0)>0 && Number(r.error_count||0)<Number(r.processed||0));
          const scan=valid||rows[0];
          fs.writeFileSync('/tmp/scan-id.txt',String(scan.id));
          fs.writeFileSync('/tmp/scan-summary.json',JSON.stringify(scan,null,2));
          NODE
          SCAN_ID="$(cat /tmp/scan-id.txt)"
          npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT position,spotify_id,title,artists,status,matched_title,matched_artists,match_score,twitch_track_id,checked_at,detail_json FROM dj_catalog_results WHERE scan_id='$SCAN_ID' ORDER BY position;" > /tmp/results.json
          mkdir -p "$GITHUB_WORKSPACE/control-center/data"
          node - <<'NODE'
          const fs=require('fs');
          const scan=JSON.parse(fs.readFileSync('/tmp/scan-summary.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('/tmp/results.json','utf8'));
          const results=(Array.isArray(raw)?raw:[]).flatMap(x=>x?.results||[]).map(r=>{
            let detail={}; try{detail=JSON.parse(r.detail_json||'{}')}catch{}
            const {detail_json,...rest}=r;
            return {...rest,detail};
          });
          const allowed=results.filter(r=>r.status==='allowed');
          const restricted=results.filter(r=>r.status==='restricted');
          const notFound=results.filter(r=>r.status==='not_found');
          const ambiguous=results.filter(r=>r.status==='ambiguous');
          const errors=results.filter(r=>r.status==='error');
          const out={
            exported_at:new Date().toISOString(),
            scan,
            counts:{allowed:allowed.length,restricted:restricted.length,not_found:notFound.length,ambiguous:ambiguous.length,error:errors.length,total:results.length},
            allowed,
            restricted,
            not_found:notFound,
            ambiguous,
            errors
          };
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/control-center/data/latest-dj-scan.json',JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Commit export
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore cloudflare/mediaforge-worker/wrangler.jsonc || true
          git add control-center/data/latest-dj-scan.json
          if git diff --cached --quiet; then
            echo "No scan changes to commit."
          else
            git commit -m "mediaforge: export latest DJ catalog scan"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
