name: MediaForge — Add Clear Live Logs

on:
  push:
    paths:
      - '.github/workflows/add-live-log-clear.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add clear logs API and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('cloudflare/mediaforge-worker/src/index.js')
          text = worker.read_text(encoding='utf-8')
          get_block = """  if (url.pathname === '/api/live-sessions' && request.method === 'GET') {
            const q = await env.DB.prepare(`SELECT * FROM live_sessions ORDER BY created_at DESC LIMIT 50`).all();
            const rows = [];
            for (const r of (q.results || [])) rows.push(await syncSessionFromGitHub(env, r));
            return json({ sessions: rows.map(r => ({ ...r, track_ids: JSON.parse(r.track_ids_json || '[]') })) }, 200, cors);
          }
          """
          delete_block = """  if (url.pathname === '/api/live-sessions' && request.method === 'DELETE') {
            const b = await bodyJson(request);
            const force = b.force === true;
            const activeRow = await env.DB.prepare(`SELECT COUNT(*) AS count FROM live_sessions WHERE status IN ('queued','starting','live','reconnecting','stopping')`).first();
            const activeCount = Number(activeRow?.count || 0);
            if (activeCount > 0 && !force) {
              return json({
                error: 'active_sessions_present',
                message: `Existem ${activeCount} sessão(ões) ativa(s) ou na fila.`,
                active_count: activeCount,
              }, 409, cors);
            }
            const totalRow = await env.DB.prepare(`SELECT COUNT(*) AS count FROM live_sessions`).first();
            const total = Number(totalRow?.count || 0);
            await env.DB.prepare(`DELETE FROM live_sessions`).run();
            return json({ ok: true, deleted: total, active_count: activeCount }, 200, cors);
          }

          """
          if "request.method === 'DELETE'" not in text or "active_sessions_present" not in text:
              if get_block not in text:
                  raise SystemExit('live sessions GET block not found')
              text = text.replace(get_block, delete_block + get_block, 1)
              worker.write_text(text, encoding='utf-8')

          clear_js = r'''(()=>{
            const TOKEN_KEY='mediaforge_token';
            const apiBase=()=>String(window.MEDIAFORGE_CONFIG?.API_URL||localStorage.getItem('mediaforge_api_url')||'').replace(/\/$/,'');
            const token=()=>localStorage.getItem(TOKEN_KEY)||'';

            async function clearLogs(force=false){
              const base=apiBase();
              if(!base)throw new Error('Backend Cloudflare ainda não foi configurado.');
              const res=await fetch(base+'/api/live-sessions',{
                method:'DELETE',
                headers:{authorization:`Bearer ${token()}`,'content-type':'application/json'},
                body:JSON.stringify({force})
              });
              let data={};
              try{data=await res.json();}catch(_){data={};}
              if(res.status===401){
                localStorage.removeItem(TOKEN_KEY);
                location.replace('./secure.html');
                throw new Error('Sessão expirada.');
              }
              if(res.status===409)return {...data,blocked:true};
              if(!res.ok)throw new Error(data?.message||data?.error||`HTTP ${res.status}`);
              return data;
            }

            function installButton(){
              const refresh=document.getElementById('refreshSessions');
              if(!refresh||document.getElementById('clearLiveLogs'))return;
              const actions=document.createElement('div');
              actions.className='row';
              const btn=document.createElement('button');
              btn.id='clearLiveLogs';
              btn.className='btn danger';
              btn.type='button';
              btn.textContent='🗑 Limpar logs';
              btn.title='Remove os registros de lives recentes do painel';
              refresh.parentNode.insertBefore(actions,refresh);
              actions.appendChild(btn);
              actions.appendChild(refresh);

              btn.onclick=async()=>{
                if(!confirm('Limpar todos os registros de lives recentes?'))return;
                const original=btn.textContent;
                btn.disabled=true;
                btn.textContent='Limpando…';
                try{
                  let result=await clearLogs(false);
                  if(result?.blocked){
                    const count=Number(result.active_count||0);
                    const ok=confirm(`Existem ${count} sessão(ões) ativa(s) ou na fila. Limpar os logs NÃO encerra transmissões; apenas remove os registros do painel. Deseja limpar mesmo assim?`);
                    if(!ok)return;
                    result=await clearLogs(true);
                  }
                  alert(`${Number(result?.deleted||0)} registro(s) removido(s) dos logs.`);
                  document.getElementById('refreshSessions')?.click();
                }catch(e){
                  alert('Falha ao limpar logs: '+(e?.message||e));
                }finally{
                  const current=document.getElementById('clearLiveLogs');
                  if(current){current.disabled=false;current.textContent=original;}
                }
              };
            }

            const target=document.getElementById('content');
            if(target)new MutationObserver(()=>queueMicrotask(installButton)).observe(target,{childList:true,subtree:true});
            installButton();
          })();
          '''

          for p in [Path('docs/control-center/lives-clear-logs.js'), Path('control-center/lives-clear-logs.js')]:
              p.write_text(clear_js, encoding='utf-8')

          script_line = '<script src="./lives-clear-logs.js?v=20261001-1"></script>'
          for p in [Path('docs/control-center/lives.html'), Path('control-center/lives.html')]:
              html = p.read_text(encoding='utf-8')
              if 'lives-clear-logs.js' not in html:
                  marker = '<script src="./lives-created-at.js?v=20261001-5"></script>'
                  if marker in html:
                      html = html.replace(marker, marker + '\n' + script_line, 1)
                  else:
                      html = html.replace('</body>', script_line + '\n</body>', 1)
                  p.write_text(html, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare/mediaforge-worker/src/index.js docs/control-center/lives-clear-logs.js control-center/lives-clear-logs.js docs/control-center/lives.html control-center/lives.html
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'mediaforge: add clear live logs control'
          git pull --rebase origin main
          git push origin HEAD:main
