name: Verify approved Gaming 30 on Twitch and Kick
on:
  push:
    branches: [main]
    paths: [.github/workflows/ops-gaming30-dj-mix.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-mix:
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - name: Verify playlists and publishers without live changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          base='https://peterlofi.odsgn.com.br'
          token=''
          def api(path, body=None):
              headers={'content-type':'application/json'}
              if token: headers['authorization']='Bearer '+token
              req=urllib.request.Request(base+path,headers=headers,data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(req,timeout=45) as r: return json.load(r)
          token=api('/api/auth/login',{'email':os.environ['ADMIN_EMAIL'],'password':os.environ['ADMIN_PASSWORD']})['token']
          print('::add-mask::'+token,flush=True)
          cid="approved-gaming30-dj-mix-20261005T221413995Z"
          for _ in range(120):
              state=api('/api/ovh/status')
              agent=state['agent']
              result=agent.get('gaming_dj30_mix') or {}
              if result.get('command_id')==cid and result.get('status')=='ready': break
              failed=next((c for c in state.get('recent_commands',[]) if c.get('id')==cid and c.get('status')=='failed'),None)
              if failed: raise RuntimeError(failed.get('error','Gaming mix command failed'))
              time.sleep(3)
          assert result.get('command_id')==cid and result.get('status')=='ready',json.dumps(result)
          assert result['approved_new_tracks']==30
          assert result['playlist_counts']=={'twitch':165,'kick':165}
          assert result['rtmp_restart'] is False and result['container_restart'] is False
          assert result['independent_players'] is True
          library=api('/api/music-library')
          proof={}
          for slot,key in (('twitch','twitch-dj-mixed'),('kick','kick-dj-mixed-independent')):
              service=agent['services'][slot]
              assert service['status']=='live',slot
              assert service['encoder_pid']==result['publisher_pids'][slot],slot+' publisher changed'
              assert service['playlist_key']==key and service['playlist_track_count']==165,slot
              playlist=next(p for p in library['playlists'] if p['key']==key)
              tracks=playlist['tracks']
              new=[t for t in tracks if t.get('generation_source')=='gaming-twitch-dj-30']
              assert len(tracks)==165 and len(new)==30 and len({t['id'] for t in tracks})==165,slot
              assert all(float(t['duration_seconds'])==300 for t in new),slot
              proof[slot]={'status':service['status'],'playlist_key':key,'total_tracks':165,'approved_new_tracks':30,'encoder_pid':service['encoder_pid'],'first_new_song':result['started'][slot],'now_playing':service.get('now_playing')}
          assert result['started']['twitch']['track_id'].startswith('gaming-twitch-dj-20261004-')
          assert result['started']['kick']['track_id'].startswith('kick-copy-gaming-twitch-dj-20261004-')
          print('VERIFIED_GAMING30_MIX_READY; independent players; RTMP publishers preserved',flush=True)
          print(json.dumps({'result':result,'live_proof':proof},ensure_ascii=False),flush=True)
          PY
