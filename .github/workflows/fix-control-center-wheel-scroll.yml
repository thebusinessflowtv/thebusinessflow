name: Fix Control Center wheel scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-control-center-wheel-scroll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch wheel scrolling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/control-center/app.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* MFCC_WHEEL_SCROLL_FIX_V1 */'
          if marker in text:
              print('Scroll fix already installed.')
              raise SystemExit(0)

          script = r'''
<script>
/* MFCC_WHEEL_SCROLL_FIX_V1 */
(function(){
  function overlayIsOpen(){
    return !!document.querySelector('.player-overlay,.modalback:not(.hidden),.more-backdrop:not(.hidden)');
  }

  function unlockPageScroll(){
    if(!overlayIsOpen() && document.body && document.body.style.overflow === 'hidden'){
      document.body.style.removeProperty('overflow');
    }
    if(document.documentElement && document.documentElement.style.overflow === 'hidden' && !overlayIsOpen()){
      document.documentElement.style.removeProperty('overflow');
    }
  }

  function hasScrollableAncestor(node, deltaY){
    let el = node instanceof Element ? node : null;
    while(el && el !== document.body && el !== document.documentElement){
      const style = getComputedStyle(el);
      const overflowY = style.overflowY;
      const scrollable = /(auto|scroll|overlay)/.test(overflowY) && el.scrollHeight > el.clientHeight + 1;
      if(scrollable){
        if(deltaY < 0 && el.scrollTop > 0) return true;
        if(deltaY > 0 && el.scrollTop + el.clientHeight < el.scrollHeight - 1) return true;
      }
      el = el.parentElement;
    }
    return false;
  }

  function onWheel(event){
    if(event.defaultPrevented || event.ctrlKey || event.shiftKey || overlayIsOpen()) return;
    if(Math.abs(event.deltaY) <= Math.abs(event.deltaX) || !event.deltaY) return;

    unlockPageScroll();
    if(hasScrollableAncestor(event.target, event.deltaY)) return;

    const root = document.scrollingElement || document.documentElement;
    if(!root) return;
    const before = root.scrollTop;
    const max = Math.max(0, root.scrollHeight - root.clientHeight);
    const next = Math.max(0, Math.min(max, before + event.deltaY));
    if(next !== before){
      root.scrollTop = next;
      event.preventDefault();
    }
  }

  window.addEventListener('pageshow', unlockPageScroll, {passive:true});
  window.addEventListener('hashchange', function(){ setTimeout(unlockPageScroll, 0); }, {passive:true});
  document.addEventListener('wheel', onWheel, {passive:false, capture:true});

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', unlockPageScroll, {once:true});
  }else{
    unlockPageScroll();
  }

  const observer = new MutationObserver(function(){
    if(!document.querySelector('.player-overlay')) unlockPageScroll();
  });
  observer.observe(document.documentElement, {childList:true, subtree:true});
})();
</script>
'''

          if '</body>' not in text:
              raise SystemExit('Could not find </body> in docs/control-center/app.html')
          text = text.replace('</body>', script + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Installed wheel scroll fix.')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- docs/control-center/app.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "MediaForge Control Center"
          git config user.email "actions@users.noreply.github.com"
          git add docs/control-center/app.html
          git commit -m "fix(control-center): restore mouse wheel scrolling"
          git push
