name: MediaForge — Probe Local OVH Runtime
# incident-status-check: 2026-10-08T18:02Z Twitch and Kick after watchdog fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-probe-local-ovh-runtime.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe OVH local MediaForge
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          echo "=== HEALTH ==="
          curl -kfsS --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 20 "$BASE/api/health" || true
          echo
          echo "=== LOCAL OPS STATUS ==="
          curl -kfsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 20 "$BASE/api/ops/20261003-live-stability/status" || true
          echo
          echo "=== PUBLIC HEALTH ==="
          curl -kfsS --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 20 "$BASE/api/ovh/public-health"
          echo
