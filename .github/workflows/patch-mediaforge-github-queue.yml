name: MediaForge — Patch GitHub Queue Transport

on:
  push:
    paths:
      - '.github/workflows/patch-mediaforge-github-queue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Worker transport
        run: python scripts/patch_mediaforge_queue.py

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare/mediaforge-worker/src/index.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'mediaforge: queue Kick start stop via repository files'
          git pull --rebase origin main
          git push origin HEAD:main
