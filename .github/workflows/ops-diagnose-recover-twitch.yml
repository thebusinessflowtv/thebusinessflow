name: MediaForge — Diagnose and Recover Twitch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-diagnose-recover-twitch.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install
      - name: Resolve D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - name: Deploy fresh host agent
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="deploy-host-diagnose-twitch-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"deploy_host_agent\",\"target\":\"host-agent\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"twitch-offline-diagnosis\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','deploy_host_agent','host-agent','$PAYLOAD','pending','$NOW');"
          echo "HOST_ID=$ID" >> "$GITHUB_ENV"
      - name: Wait host agent
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$HOST_ID';" > /tmp/host.json
            cat /tmp/host.json
            if grep -q '"status": "completed"' /tmp/host.json; then break; fi
            if grep -q '"status": "failed"' /tmp/host.json; then exit 1; fi
            sleep 4
          done
          grep -q '"status": "completed"' /tmp/host.json
      - name: Diagnose Twitch publisher before recovery
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="diagnose-twitch-before-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"diagnose_service\",\"target\":\"twitch\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"twitch-offline-diagnosis\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','diagnose_service','twitch','$PAYLOAD','pending','$NOW');"
          echo "DIAG_BEFORE=$ID" >> "$GITHUB_ENV"
          for i in $(seq 1 25); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/diag-before.json
            if grep -q '"status": "completed"' /tmp/diag-before.json; then break; fi
            if grep -q '"status": "failed"' /tmp/diag-before.json; then cat /tmp/diag-before.json; exit 1; fi
            sleep 3
          done
          cat /tmp/diag-before.json
      - name: Recover Twitch publisher only
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="recover-twitch-publisher-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"recover_publisher\",\"target\":\"twitch\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"twitch-offline-recovery\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','recover_publisher','twitch','$PAYLOAD','pending','$NOW');"
          echo "RECOVER_ID=$ID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/recover.json
            if grep -q '"status": "completed"' /tmp/recover.json; then break; fi
            if grep -q '"status": "failed"' /tmp/recover.json; then cat /tmp/recover.json; exit 1; fi
            sleep 3
          done
          cat /tmp/recover.json
      - name: Diagnose Twitch publisher after recovery
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          sleep 15
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="diagnose-twitch-after-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"diagnose_service\",\"target\":\"twitch\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"twitch-offline-diagnosis\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','diagnose_service','twitch','$PAYLOAD','pending','$NOW');"
          for i in $(seq 1 25); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/diag-after.json
            if grep -q '"status": "completed"' /tmp/diag-after.json; then break; fi
            if grep -q '"status": "failed"' /tmp/diag-after.json; then cat /tmp/diag-after.json; exit 1; fi
            sleep 3
          done
          cat /tmp/diag-after.json
      - name: Public health
        run: |
          curl -fsS --retry 5 --retry-all-errors https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/public-health
