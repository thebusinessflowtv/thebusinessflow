name: Deploy MediaForge Control Center

on:
  push:
    branches: [main]
    paths:
      - 'control-center/**'
      - '.github/workflows/mfcc-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mediaforge-control-center-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Control Center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('control-center/index.html').read_text(encoding='utf-8')
          gate = Path('control-center/secure.html').read_text(encoding='utf-8')

          required_app = [
            '<title>MediaForge Control Center</title>',
            'mfcc-dispatch', 'mfcc-suggestions', 'mfcc-status', 'mfcc-artifact-link',
            'repo_full_name', 'youtube_connected', 'allow_youtube_upload',
            'The Business Flow', 'NBA Stars'
          ]
          missing = [item for item in required_app if item not in app]
          assert not missing, f'Missing app contract: {missing}'

          required_gate = [
            'ACESSO PRIVADO', 'user_roles', "eq('role','admin')",
            'shouldCreateUser:false', "location.replace('./app.html'"
          ]
          missing_gate = [item for item in required_gate if item not in gate]
          assert not missing_gate, f'Missing secure gate contract: {missing_gate}'

          for name, html in [('app', app), ('gate', gate)]:
            scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
            assert scripts, f'No inline JavaScript found in {name}'
            Path(f'/tmp/mfcc-{name}.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/mfcc-app.js
          node --check /tmp/mfcc-gate.js

      - name: Prepare Control Center subpath
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/control-center
          cp control-center/secure.html _site/control-center/index.html
          cp control-center/index.html _site/control-center/app.html
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>MediaForge</title></head>
          <body style="margin:0;background:#090a0f;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh">
            <a href="./control-center/" style="color:#fff;text-decoration:none;border:1px solid #333;padding:14px 20px;border-radius:10px;background:#151821">Abrir MediaForge Control Center</a>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}control-center/
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
