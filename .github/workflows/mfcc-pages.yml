name: Deploy MediaForge Control Center

on:
  # OVH serves the production Control Center. Pages is manual fallback only.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mediaforge-control-center-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Control Center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('control-center/index.html').read_text(encoding='utf-8')
          secure = Path('control-center/secure.html').read_text(encoding='utf-8')
          lives = Path('control-center/lives.html').read_text(encoding='utf-8')
          twitch = Path('control-center/twitch.html').read_text(encoding='utf-8')
          ovh = Path('control-center/ovh.html').read_text(encoding='utf-8')
          office = Path('control-center/office-music.html').read_text(encoding='utf-8')
          app_shell = Path('control-center/app.html').read_text(encoding='utf-8')
          app_core = Path('control-center/app-core.html').read_text(encoding='utf-8')

          assert './secure.html' in index, 'MediaForge entry must route to secure gate'
          assert '<title>MediaForge Control Center</title>' in secure, 'Secure gate missing'
          assert 'mediaforge_token' in secure and '/api/auth/login' in secure, 'Cloudflare auth gate missing'
          assert '<title>Lives · MediaForge</title>' in lives, 'Lives page missing'
          assert 'data-platform="twitch"' in lives, 'Twitch tab missing from unified Lives'
          assert '<title>Twitch · MediaForge</title>' in twitch, 'Twitch compatibility page missing'
          assert 'app.html#/peter-lofi/lives?platform=twitch' in twitch, 'Twitch page must redirect to PeterLofi Lives'
          assert '<title>OVH VPS · MediaForge</title>' in ovh, 'OVH dashboard missing'
          assert 'app.html#/peter-lofi/ovh' in ovh, 'OVH page must return to central app'
          assert '<title>The Office Music · MediaForge</title>' in office, 'Office Music page missing'
          assert 'app-core.html' in app_shell, 'Central app loader missing'
          for route in ['/peter-lofi','/peter-lofi/library','/peter-lofi/music','/peter-lofi/lives','/peter-lofi/ovh','/the-business-flow','/nba-stars','/leonidanos']:
              assert route in app_core, f'Central route missing: {route}'
          assert 'THEBUSINESSFLOWTV' in app_core, 'Main channel shell missing'
          assert 'CHANNELS={' in app_core, 'Channel registry missing'
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('control-center/app-core.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          Path('/tmp/mediaforge-app-core.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/mediaforge-app-core.js
          node --check control-center/lives-cloudflare.js
          node --check control-center/ovh.js
          node --check control-center/office-music.js
          node --check control-center/office-music-nav.js

      - name: Prepare Control Center subpath
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/control-center

          # Publish the complete control-center bundle so new modules cannot be
          # accidentally omitted from GitHub Pages.
          cp -R control-center/. _site/control-center/

          # Public entry remains the secure gate. app.html is the unified MediaForge shell.
          cp control-center/secure.html _site/control-center/index.html
          test -f _site/control-center/app.html
          test -f _site/control-center/app-core.html

          # Friendly alias in addition to office-music.html.
          mkdir -p _site/control-center/office-music
          cp control-center/office-music.html _site/control-center/office-music/index.html

          # Keep the dedicated navigation/productions bridge attached to app.html.
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/control-center/app.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="./office-music-nav.js?v=20260929-3"></script>'
          s = s.replace('<script src="./office-music-nav.js?v=20260929-2"></script>', marker)
          if 'office-music-nav.js' not in s:
              s = s.replace('</body>', marker + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>MediaForge</title></head>
          <body style="margin:0;background:#090a0f;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh">
            <a href="./control-center/" style="color:#fff;text-decoration:none;border:1px solid #333;padding:14px 20px;border-radius:10px;background:#151821">Abrir MediaForge Control Center</a>
          </body>
          </html>
          HTML

          echo 'Published files:'
          find _site -maxdepth 3 -type f -print | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}control-center/
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
