# monitor revision: 20261005-delivery3
name: Gaming DJ30 — deploy local playlist publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/ops-deploy-gaming-dj30.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
      BASE: https://peterlofi.odsgn.com.br
    steps:
      - name: Publish control API and verify playlist endpoint
        run: |
          set -euo pipefail
          LOGIN="$(curl -fsS --retry 3 --retry-all-errors --connect-timeout 8 --max-time 25 -X POST "$BASE/api/auth/login" -H 'content-type: application/json' --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          curl -fsS "$BASE/api/ovh/status" -H "authorization: Bearer $TOKEN" > /tmp/before.json
          ID="gaming-dj30-control-$GITHUB_RUN_ID"
          curl -fsS -X POST "$BASE/api/ovh/deploy" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data "$(jq -nc --arg id "$ID" '{action:"deploy_service",target:"control-api",request_id:$id,source:"gaming-dj30"}')" >/tmp/request.json
          for n in $(seq 1 140); do
            RESULT="$(curl -fsS --connect-timeout 8 --max-time 20 "$BASE/api/ovh/deploy-status?id=$ID" -H "authorization: Bearer $TOKEN" 2>/dev/null || true)"
            STATUS="$(printf '%s' "$RESULT" | jq -r '.command.status // empty' 2>/dev/null || true)"
            echo "control-api=$STATUS"
            if [ "$STATUS" = completed ]; then break; fi
            if [ "$STATUS" = failed ]; then printf '%s' "$RESULT" | jq '{status:.command.status,error:.command.error}'; exit 1; fi
            sleep 3
          done
          test "$STATUS" = completed
          CODE="$(curl -sS --retry 3 --retry-all-errors -o /tmp/check.json -w '%{http_code}' -X POST "$BASE/api/music-library/gaming-dj30" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data '{"tracks":[]}')"
          test "$CODE" = 400
          jq -e '.error=="tracks_required"' /tmp/check.json
          curl -fsS "$BASE/api/ovh/status" -H "authorization: Bearer $TOKEN" >/tmp/after.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/before.json'))['agent'].get('services',{})
          b=json.load(open('/tmp/after.json'))['agent'].get('services',{})
          for key,old in a.items():
              pid=old.get('encoder_pid')
              if pid:
                  assert b.get(key,{}).get('encoder_pid')==pid, f'{key}: encoder changed'
          print('GAMING_PUBLICATION_API_READY; live encoder PIDs preserved')
          PY
