name: Ops — Validate MediaForge Local API Build
# dynamic-ovh-live-and-music-actions-validation: 2026-10-10-0601-chat-protection

on:
  push:
    paths:
      - '.github/workflows/ops-validate-mediaforge-local-api.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover Lofi audio feeder only, verify all 66 tracks and audible PCM
        if: contains(github.event.head_commit.message, '[recover-lofi-audio-now]')
        env:
          ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.parse
          base="https://peterlofi.odsgn.com.br"
          def call(path,token="",payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              headers={"user-agent":"MediaForge-Lofi-AudioOnly-Rescue/1","content-type":"application/json"}
              if token:headers["authorization"]="Bearer "+token
              request=urllib.request.Request(base+path,data=data,method="POST" if payload is not None else "GET",headers=headers)
              with urllib.request.urlopen(request,timeout=40) as response:return json.load(response)
          auth=call("/api/auth/login",payload={"email":os.environ["ADMIN_EMAIL"],"password":os.environ["ADMIN_PASSWORD"]})
          token=auth["token"];print("::add-mask::"+token,flush=True)
          before=call("/api/ovh/status",token)["agent"]["services"]
          lofi=before.get("youtube-lofi-hip-hop") or {}
          print("BEFORE_LOFI_AUDIO",json.dumps({k:lofi.get(k) for k in ("status","encoder_pid","audio_pid","audio_status","audio_stalls","playlist_track_count","now_playing")}),flush=True)
          if lofi.get("status")!="live" or not lofi.get("encoder_pid") or not lofi.get("session_id"):
              raise RuntimeError("Refusing to restart a missing/nonlive Lofi session")
          if int(lofi.get("playlist_track_count") or 0)!=66:
              raise RuntimeError("Lofi live playlist does not yet contain all 66 tracks")
          beforepid=lofi["encoder_pid"]
          other={k:v.get("encoder_pid") for k,v in before.items() if k!="youtube-lofi-hip-hop" and v.get("encoder_pid")}
          command_id="lofi-66-audio-rescue-"+os.environ["GITHUB_RUN_ID"]
          req=call("/api/ovh/deploy",token,{"action":"recover_isolated_lofi_audio",
              "target":"youtube-lofi-hip-hop","session_id":lofi["session_id"],
              "request_id":command_id,"source":"owner_emergency_silent_66_track_playlist"})
          print("RECOVERY_REQUEST",json.dumps({"id":command_id,"queued":bool(req.get("ok"))}),flush=True)
          for i in range(90):
              time.sleep(2)
              row=(call("/api/ovh/deploy-status?id="+urllib.parse.quote(command_id),token).get("command") or {})
              if row.get("status") not in ("completed","failed"):
                  if i%12==0:print("RECOVERY_STATUS",row.get("status"),flush=True)
                  continue
              result=row.get("result") or {}
              print("LOFI_AUDIO_RECOVERY_RESULT",json.dumps({"status":row.get("status"),"error":row.get("error"),
                  "outcome":{k:result.get(k) for k in ("status","playlist_track_count","encoder_pid_preserved","old_track_id",
                    "current_track_id","old_audio_pid","new_audio_pid","pcm_frames_emitted","non_silent_pcm_frames",
                    "audio_stalls","other_publishers_preserved","rtmp_restart")}}),flush=True)
              if row.get("status")=="failed":raise RuntimeError("Lofi feeder recovery failed: "+str(row.get("error") or "")[:300])
              if result.get("status")!="audio_restored":
                  raise RuntimeError("Recovery did not verify audible PCM: "+str(result.get("status") or "unknown"))
              after=call("/api/ovh/status",token)["agent"]["services"]
              assert after["youtube-lofi-hip-hop"].get("encoder_pid")==beforepid,"Lofi RTMP encoder PID changed"
              changed=[name for name,pid in other.items()
                  if name in after and after[name].get("encoder_pid")!=pid]
              assert not changed,"Other encoders changed: "+str(changed)
              print("LOFI_66_TRACKS_AUDIBLE_PCM_CONFIRMED_NO_STREAM_RESTART",flush=True)
              break
          else:raise RuntimeError("Lofi feeder recovery was not confirmed within three minutes")
          PY

      - name: Emergency read-only diagnostics of Lofi audio and OVH playlist
        env:
          ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.parse
          base='https://peterlofi.odsgn.com.br'
          def call(path,token='',body=None):
              data=json.dumps(body).encode() if body is not None else None
              headers={'user-agent':'MediaForge-ReadOnly-Lofi-Rescue','content-type':'application/json'}
              if token:headers['authorization']='Bearer '+token
              req=urllib.request.Request(base+path,data=data,method='POST' if data is not None else 'GET',headers=headers)
              with urllib.request.urlopen(req,timeout=40) as f:return json.load(f)
          auth=call('/api/auth/login',body={'email':os.environ['ADMIN_EMAIL'],'password':os.environ['ADMIN_PASSWORD']})
          token=auth['token'];print('::add-mask::'+token,flush=True)
          d=call('/api/ovh/status',token).get('agent') or {}
          svc=(d.get('services') or {}).get('youtube-lofi-hip-hop') or {}
          print('LOFI_LIVE_STATUS',json.dumps({k:svc.get(k) for k in ('status','encoder_pid','audio_pid','audio_status','audio_stalls','playlist_track_count','now_playing','updated_at')},ensure_ascii=False),flush=True)
          ident='lofi-audio-diagnose-'+os.environ['GITHUB_RUN_ID']
          q=call('/api/ovh/deploy',token,{'action':'diagnose_service','target':'youtube-lofi-hip-hop','request_id':ident,'source':'owner_audio_restoration'})
          ident=str((q.get('command') or {}).get('id') or ident)
          print('LOFI_READ_ONLY_DIAG_QUEUED',ident,flush=True)
          for j in range(55):
              time.sleep(2)
              cmd=(call('/api/ovh/deploy-status?id='+urllib.parse.quote(ident),token).get('command') or {})
              if cmd.get('status') not in ('completed','failed'):continue
              result=cmd.get('result') or {}
              h=result.get('health') or {}
              ah=result.get('audio_health') or {}
              np=result.get('now_playing') or {}
              print('LOFI_DIAG_RESULT',json.dumps({'status':cmd.get('status'),'error':cmd.get('error'),
                'encoder':{k:h.get(k) for k in ('status','encoder_pid','audio_pid','audio_status','audio_cache_hits','audio_cache_misses','audio_stalls','updated_at')},
                'audio':{k:ah.get(k) for k in ('state','status','track_id','stalls','cache_hits','cache_misses','backpressure_drops','error','updated_at','cache_warm')},
                'current':{k:np.get(k) for k in ('track_id','title','state','started_at')},
                'desired':result.get('desired'),
                'controller_tail':str(result.get('controller_log_tail') or '')[-650:],
                'ffmpeg_tail':str(result.get('ffmpeg_log_tail') or '')[-800:]},ensure_ascii=False),flush=True)
              break
          else:print('LOFI_DIAG_TIMEOUT_NO_ACTION',flush=True)
          PY

      - name: Syntax and package validation
        shell: bash
        run: |
          set -euo pipefail
          node --check control-center/ovh.js
          node --check docs/control-center/ovh.js
          node --check cloudflare/mediaforge-worker/src/index.js
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('control-center/ovh.js','utf8');
          for (const phrase of ['function liveSlots','youtube-lofi-hip-hop','youtube-gta-vi','/api/ovh/control/','now_playing','track_id']) {
            if(!js.includes(phrase)) throw new Error('OVH production live controls missing '+phrase);
          }
          if(js.includes('Object.keys(labels).map(function(slot){return serviceCard')) throw new Error('Legacy four-card list remains active');
          console.log('OVH_DYNAMIC_ACTIVE_LIVES_AND_SKIP_PREVIOUS_VALID');
          NODE
          cd cloudflare/mediaforge-worker
          npm install
          npx wrangler deploy --dry-run --config wrangler.ovh.jsonc
          echo LOCAL_API_BUILD_VALID

      - name: One-time live Lofi Hip Hop previous-track control confirmation
        if: contains(github.event.head_commit.message, '[test-lofi-previous-once]')
        env:
          ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
          LOFI_AUDIO_ACTION: previous
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_ovh_lofi_next_once.py

      - name: Read-only remote YouTube queue inspection
        env:
          ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          base="https://mediaforge-api.guilhermeodsgn.workers.dev"
          def http(path,method="GET",payload=None,token=""):
              data=json.dumps(payload).encode() if payload is not None else None
              headers={"content-type":"application/json","user-agent":"MediaForge-Lofi-Queue-Diag"}
              if token:headers["authorization"]="Bearer "+token
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:return resp.status,json.load(resp)
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode("utf-8","replace")
                  try: return exc.code,json.loads(body)
                  except: return exc.code,{"error":"non_json_response"}
          code,auth=http("/api/auth/login",method="POST",payload={"email":os.environ.get("ADMIN_EMAIL",""),"password":os.environ.get("ADMIN_PASSWORD","")})
          token=str(auth.get("token") or "")
          print("REMOTE_ADMIN_LOGIN",code,"authenticated",bool(token),flush=True)
          if not token:raise SystemExit(0)
          print("::add-mask::"+token,flush=True)
          code,result=http("/api/ovh/deploy-status?id=lofi-youtube-1dd4373d-351c-40cc-aa67-774a540fd991",token=token)
          cmd=result.get("command") or {}
          print("LOFI_COMMAND",json.dumps({"http":code,"status":cmd.get("status"),"created_at":cmd.get("created_at"),"claimed_at":cmd.get("claimed_at"),"completed_at":cmd.get("completed_at"),"error":cmd.get("error")},ensure_ascii=False),flush=True)
          result=cmd.get("result") or {}
          print("LOFI_HOST_LAUNCH_RESULT",json.dumps({"status":result.get("status"),"runtime_slot":result.get("runtime_slot"),"playlist_key":result.get("playlist_key"),"track_count":result.get("track_count"),"encoder_pid_present":bool(result.get("encoder_pid")),"other_publishers_preserved":result.get("other_publishers_preserved"),"existing_streams_restarted":result.get("existing_streams_restarted"),"error":cmd.get("error")},ensure_ascii=False),flush=True)
          code,all_commands=http("/api/ovh/deploy-status",token=token)
          recent=all_commands.get("commands") or []
          print("REMOTE_QUEUE_LAST_25",json.dumps([{"id":c.get("id"),"action":c.get("action"),"status":c.get("status"),"created_at":c.get("created_at"),"claimed_at":c.get("claimed_at")} for c in recent],ensure_ascii=False),flush=True)
          local="https://peterlofi.odsgn.com.br"
          def local_http(path,payload=None,bearer=""):
              data=json.dumps(payload).encode() if payload is not None else None
              headers={"content-type":"application/json","user-agent":"MediaForge-Lofi-Host-Status"}
              if bearer:headers["authorization"]="Bearer "+bearer
              request=urllib.request.Request(local+path,data=data,method="POST" if data else "GET",headers=headers)
              with urllib.request.urlopen(request,timeout=25) as reply:return json.load(reply)
          try:
              auth=local_http("/api/auth/login",payload={"email":os.environ.get("ADMIN_EMAIL",""),"password":os.environ.get("ADMIN_PASSWORD","")})
              token=auth.get("token") or ""
              if token:
                  print("::add-mask::"+token,flush=True)
                  state=local_http("/api/ovh/status",bearer=token)
                  agent=state.get("agent") or {}
                  print("OVH_LOCAL_AGENT_LAST_HEARTBEAT",agent.get("reported_at") or agent.get("stored_at"),flush=True)
                  service=(agent.get("services") or {}).get("youtube-lofi-hip-hop") or {}
                  print("OVH_LOCAL_LOFI_ENCODER",json.dumps({k:service.get(k) for k in ("status","session_id","encoder_pid","updated_at")}),flush=True)
                  gta=(agent.get("services") or {}).get("youtube-gta-vi") or {}
                  print("GTA_OVH_CURRENT",json.dumps({k:gta.get(k) for k in
                      ("status","session_id","encoder_pid","audio_pid","visual_pid","updated_at",
                       "audio_status","visual_status","restarts","playlist_key","playlist_track_count")},
                      ensure_ascii=False),flush=True)
                  print("GTA_OVH_HEARTBEAT_AGE_SECONDS",
                      round(__import__("time").time()-__import__("datetime").datetime.fromisoformat(
                         (gta.get("updated_at") or "1970-01-01T00:00:00Z").replace("Z","+00:00")).timestamp()),
                      flush=True)
                  latest=local_http("/api/ovh/deploy-status",bearer=token)
                  rows=latest.get("commands") or []
                  print("OVH_LOCAL_RECENT_CONTROL",json.dumps([{"id":x.get("id"),"action":x.get("action"),"status":x.get("status")} for x in rows[:10]]),flush=True)
          except Exception as exc:
              print("OVH_LOCAL_DIAGNOSTIC_UNAVAILABLE",type(exc).__name__,flush=True)
          PY

      - name: Diagnose GTA VI local runtime without changing live processes
        env:
          ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os,time
          host="https://peterlofi.odsgn.com.br"
          def call(path,token="",body=None):
              data=json.dumps(body).encode() if body is not None else None
              h={"user-agent":"MediaForge-GTA-Recovery-Diagnostic"}
              if token:h["authorization"]="Bearer "+token
              if data is not None:h["content-type"]="application/json"
              with urllib.request.urlopen(urllib.request.Request(host+path,method="POST" if body is not None else "GET",headers=h,data=data),timeout=25) as response:
                  return json.load(response)
          login=call("/api/auth/login",body={"email":os.environ["ADMIN_EMAIL"],"password":os.environ["ADMIN_PASSWORD"]})
          token=login.get("token") or ""
          if not token:raise RuntimeError("MediaForge operator login failed")
          print("::add-mask::"+token,flush=True)
          cmd=call("/api/ovh/deploy",token,{"action":"diagnose_service",
              "target":"youtube-gta-vi","request_id":"gta-read-only-diagnose-20261010-0635",
              "source":"owner_emergency_gta_recovery"})
          ident=(cmd.get("command") or {}).get("id") or "gta-read-only-diagnose-20261010-0635"
          print("GTA_DIAG_QUEUED",ident,flush=True)
          for attempt in range(52):
              row=call("/api/ovh/deploy-status?id="+ident,token).get("command") or {}
              if row.get("status") in ("completed","failed"):
                  outcome=row.get("result") or {}
                  diag=outcome.get("diagnostic") or outcome.get("diagnose") or outcome
                  health=diag.get("health") or {}
                  print("GTA_DIAG_RESULT",json.dumps({
                      "status":row.get("status"),"error":row.get("error"),
                      "result_status":outcome.get("status"),
                      "health":{k:health.get(k) for k in ("status","encoder_pid","audio_pid","visual_pid","audio_status","visual_status","updated_at","restarts")},
                      "desired":diag.get("desired"),"pipeline_probe":diag.get("pipeline_probe"),
                      "audio_health":{k:(diag.get("audio_health") or {}).get(k) for k in ("state","status","stalls","updated_at")},
                      "visual_health":{k:(diag.get("visual_health") or {}).get(k) for k in ("status","updated_at")},
                      "controller_tail":str(diag.get("controller_log_tail") or "")[-1700:],
                      "ffmpeg_tail":str(diag.get("ffmpeg_log_tail") or "")[-1700:]
                  },ensure_ascii=False),flush=True)
                  if row.get("status")=="failed":raise RuntimeError("Read-only diagnose service failed")
                  break
              if attempt==51:raise RuntimeError("GTA diagnosis command did not finish")
              time.sleep(2)
          PY
