name: Ops — Validate MediaForge Local API Build
# dynamic-ovh-live-and-music-actions-validation: 2026-10-10-0550-host-sidecar

on:
  push:
    paths:
      - '.github/workflows/ops-validate-mediaforge-local-api.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and package validation
        shell: bash
        run: |
          set -euo pipefail
          node --check control-center/ovh.js
          node --check docs/control-center/ovh.js
          node --check cloudflare/mediaforge-worker/src/index.js
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('control-center/ovh.js','utf8');
          for (const phrase of ['function liveSlots','youtube-lofi-hip-hop','youtube-gta-vi','/api/ovh/control/','now_playing','track_id']) {
            if(!js.includes(phrase)) throw new Error('OVH production live controls missing '+phrase);
          }
          if(js.includes('Object.keys(labels).map(function(slot){return serviceCard')) throw new Error('Legacy four-card list remains active');
          console.log('OVH_DYNAMIC_ACTIVE_LIVES_AND_SKIP_PREVIOUS_VALID');
          NODE
          cd cloudflare/mediaforge-worker
          npm install
          npx wrangler deploy --dry-run --config wrangler.ovh.jsonc
          echo LOCAL_API_BUILD_VALID

      - name: One-time live Lofi Hip Hop previous-track control confirmation
        if: contains(github.event.head_commit.message, '[test-lofi-previous-once]')
        env:
          ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
          LOFI_AUDIO_ACTION: previous
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_ovh_lofi_next_once.py

      - name: Read-only remote YouTube queue inspection
        env:
          ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          base="https://mediaforge-api.guilhermeodsgn.workers.dev"
          def http(path,method="GET",payload=None,token=""):
              data=json.dumps(payload).encode() if payload is not None else None
              headers={"content-type":"application/json","user-agent":"MediaForge-Lofi-Queue-Diag"}
              if token:headers["authorization"]="Bearer "+token
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:return resp.status,json.load(resp)
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode("utf-8","replace")
                  try: return exc.code,json.loads(body)
                  except: return exc.code,{"error":"non_json_response"}
          code,auth=http("/api/auth/login",method="POST",payload={"email":os.environ.get("ADMIN_EMAIL",""),"password":os.environ.get("ADMIN_PASSWORD","")})
          token=str(auth.get("token") or "")
          print("REMOTE_ADMIN_LOGIN",code,"authenticated",bool(token),flush=True)
          if not token:raise SystemExit(0)
          print("::add-mask::"+token,flush=True)
          code,result=http("/api/ovh/deploy-status?id=lofi-youtube-1dd4373d-351c-40cc-aa67-774a540fd991",token=token)
          cmd=result.get("command") or {}
          print("LOFI_COMMAND",json.dumps({"http":code,"status":cmd.get("status"),"created_at":cmd.get("created_at"),"claimed_at":cmd.get("claimed_at"),"completed_at":cmd.get("completed_at"),"error":cmd.get("error")},ensure_ascii=False),flush=True)
          result=cmd.get("result") or {}
          print("LOFI_HOST_LAUNCH_RESULT",json.dumps({"status":result.get("status"),"runtime_slot":result.get("runtime_slot"),"playlist_key":result.get("playlist_key"),"track_count":result.get("track_count"),"encoder_pid_present":bool(result.get("encoder_pid")),"other_publishers_preserved":result.get("other_publishers_preserved"),"existing_streams_restarted":result.get("existing_streams_restarted"),"error":cmd.get("error")},ensure_ascii=False),flush=True)
          code,all_commands=http("/api/ovh/deploy-status",token=token)
          recent=all_commands.get("commands") or []
          print("REMOTE_QUEUE_LAST_25",json.dumps([{"id":c.get("id"),"action":c.get("action"),"status":c.get("status"),"created_at":c.get("created_at"),"claimed_at":c.get("claimed_at")} for c in recent],ensure_ascii=False),flush=True)
          local="https://peterlofi.odsgn.com.br"
          def local_http(path,payload=None,bearer=""):
              data=json.dumps(payload).encode() if payload is not None else None
              headers={"content-type":"application/json","user-agent":"MediaForge-Lofi-Host-Status"}
              if bearer:headers["authorization"]="Bearer "+bearer
              request=urllib.request.Request(local+path,data=data,method="POST" if data else "GET",headers=headers)
              with urllib.request.urlopen(request,timeout=25) as reply:return json.load(reply)
          try:
              auth=local_http("/api/auth/login",payload={"email":os.environ.get("ADMIN_EMAIL",""),"password":os.environ.get("ADMIN_PASSWORD","")})
              token=auth.get("token") or ""
              if token:
                  print("::add-mask::"+token,flush=True)
                  state=local_http("/api/ovh/status",bearer=token)
                  agent=state.get("agent") or {}
                  print("OVH_LOCAL_AGENT_LAST_HEARTBEAT",agent.get("reported_at") or agent.get("stored_at"),flush=True)
                  service=(agent.get("services") or {}).get("youtube-lofi-hip-hop") or {}
                  print("OVH_LOCAL_LOFI_ENCODER",json.dumps({k:service.get(k) for k in ("status","session_id","encoder_pid","updated_at")}),flush=True)
                  latest=local_http("/api/ovh/deploy-status",bearer=token)
                  rows=latest.get("commands") or []
                  print("OVH_LOCAL_RECENT_CONTROL",json.dumps([{"id":x.get("id"),"action":x.get("action"),"status":x.get("status")} for x in rows[:10]]),flush=True)
          except Exception as exc:
              print("OVH_LOCAL_DIAGNOSTIC_UNAVAILABLE",type(exc).__name__,flush=True)
          PY
