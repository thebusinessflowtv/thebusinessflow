name: MediaForge — Inspect Latest GTA YouTube Attempt
# bridge-probe-trigger: 2026-10-05T22:22:00-03:00-wait-gta-stable

on:
  push:
    paths:
      - '.github/workflows/ops-inspect-latest-gta-youtube.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - name: Read latest GTA YouTube session from OVH
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          LOGIN="$(curl -kfsS -X POST "$BASE/api/auth/login" -H 'content-type: application/json'             --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          curl -kfsS "$BASE/api/live-sessions" -H "authorization: Bearer $TOKEN" > /tmp/sessions.json
          SID="$(jq -r '[.sessions[]? | select(.platform=="youtube" and .runtime_slot=="youtube-gta-vi")] | sort_by(.created_at) | last | .id // empty' /tmp/sessions.json)"
          test -n "$SID"
          curl -kfsS "$BASE/api/live/$SID" -H "authorization: Bearer $TOKEN" > /tmp/detail.json
          jq '{
            session: (.session | {id,platform,status,title,description,duration_minutes,runtime,runtime_slot,created_at}),
            tracks: (.tracks | map({id,title,url,duration_seconds})),
            assets: .assets
          }' /tmp/detail.json

          echo "GTA_PUBLIC_HEALTH:"
          READY=0
          for I in $(seq 1 24); do
            curl -kfsS "$BASE/api/ovh/public-health" > /tmp/gta-public-health.json
            GTA_STATUS="$(jq -r '.services["youtube-gta-vi"].status // "unknown"' /tmp/gta-public-health.json)"
            GTA_SONG="$(jq -r '.services["youtube-gta-vi"].now_playing.title // ""' /tmp/gta-public-health.json)"
            echo "gta_health[$I] status=$GTA_STATUS now_playing=$GTA_SONG"
            if [ "$GTA_STATUS" = "live" ]; then READY=1; break; fi
            sleep 5
          done
          jq '.services["youtube-gta-vi"]' /tmp/gta-public-health.json
          test "$READY" = "1"

          echo "BRIDGE_ROUTE_PROBE:"
          CODE="$(curl -ksS -o /tmp/bridge-probe.json -w '%{http_code}' -X POST "$BASE/api/ovh/agent/commands" -H 'content-type: application/json' --data '{"action":"start","runtime_slot":"youtube-gta-vi"}' || true)"
          echo "HTTP=$CODE"
          cat /tmp/bridge-probe.json || true

          echo "BOOTSTRAP_ROUTE_PROBE:"
          BCODE="$(curl -ksS -o /tmp/bootstrap-probe.json -w '%{http_code}' -X POST "$BASE/api/ovh/youtube-bootstrap" \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --data '{"runtime_slot":"youtube-gta-vi"}' || true)"
          echo "BOOTSTRAP_HTTP=$BCODE"
          cat /tmp/bootstrap-probe.json || true

          echo "OIDC_ROUTE_PROBE:"
          OCODE="$(curl -ksS -o /tmp/oidc-probe.json -w '%{http_code}' -X POST "$BASE/api/ovh/github-youtube-bootstrap" -H 'content-type: application/json' --data '{"runtime_slot":"youtube-gta-vi"}' || true)"
          echo "OIDC_HTTP=$OCODE"
          cat /tmp/oidc-probe.json || true

          echo "DEPLOY_STATUS:"
          curl -kfsS "$BASE/api/ovh/deploy-status?id=direct-control-center-20261006003202" -H "authorization: Bearer $TOKEN" | jq '{command:{id:.command.id,status:.command.status,error:.command.error,result:.command.result}}'
