name: MediaForge — Verify Post-Hotfix Live Stability
# live-incident: 2026-10-08-disable-120s-encoder-kill

on:
  push:
    paths:
      - '.github/workflows/ops-deploy-control-center-ovh-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Login and snapshot publisher identities
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          LOGIN="$(curl -kfsS --retry 8 --retry-all-errors --retry-delay 2 -X POST "$BASE/api/auth/login" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > /tmp/mf-token
          curl -kfsS -H "authorization: Bearer $TOKEN" "$BASE/api/ovh/status" > /tmp/before.json
          for SLOT in twitch kick; do
            jq -e --arg s "$SLOT" '.agent.services[$s].status=="live" and .agent.services[$s].hot_swap==true and (.agent.services[$s].encoder_pid != null)' /tmp/before.json >/dev/null
          done
          jq '{twitch:{status:.agent.services.twitch.status,encoder_pid:.agent.services.twitch.encoder_pid,restarts:.agent.services.twitch.restarts,visual_revision:.agent.services.twitch.visual_revision},kick:{status:.agent.services.kick.status,encoder_pid:.agent.services.kick.encoder_pid,restarts:.agent.services.kick.restarts,visual_revision:.agent.services.kick.visual_revision}}' /tmp/before.json

      - name: Request read-only host health check
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN="$(cat /tmp/mf-token)"
          ID="incident-health-check-20261008-$(date -u +%Y%m%d%H%M%S)"
          curl -kfsS -X POST "$BASE/api/ovh/deploy" \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --data "$(jq -nc --arg id "$ID" '{action:"health_check",target:"all",request_id:$id,source:"incident-post-watchdog-check"}')" \
            > /tmp/create.json
          for I in $(seq 1 120); do
            if ! curl -kfsS --retry 4 --retry-all-errors --retry-delay 2 "$BASE/api/ovh/deploy-status?id=$ID" \
              -H "authorization: Bearer $TOKEN" > /tmp/status.json; then
              sleep 2
              continue
            fi
            ST="$(jq -r '.command.status // empty' /tmp/status.json)"
            echo "ovh-agent=$ST"
            [ "$ST" = "completed" ] && break
            if [ "$ST" = "failed" ] || [ "$ST" = "cancelled" ]; then
              cat /tmp/status.json
              exit 1
            fi
            sleep 3
          done
          jq -e '.command.status=="completed"' /tmp/status.json >/dev/null

      - name: Verify publisher identities are stable during health check
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN="$(cat /tmp/mf-token)"
          sleep 8
          curl -kfsS -H "authorization: Bearer $TOKEN" "$BASE/api/ovh/status" > /tmp/after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/before.json','utf8'));
          const a=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));
          for(const s of ['twitch','kick']){
            const x=b.agent.services[s], y=a.agent.services[s];
            if(String(x.encoder_pid)!==String(y.encoder_pid)) throw new Error(s+' encoder PID changed');
            if(Number(x.restarts||0)!==Number(y.restarts||0)) throw new Error(s+' restart counter changed');
            if(y.status!=='live'||y.hot_swap!==true) throw new Error(s+' is not live/hot-swap after agent deploy');
          }
          const r=a.agent.visual_rotation||{};
          console.log('VISUAL_ROTATION',JSON.stringify(r));
          console.log('Rotation status retained for diagnosis; automated rotation is disabled by the OVH agent patch.');
          NODE
          jq '{visual_rotation:.agent.visual_rotation,twitch:{status:.agent.services.twitch.status,encoder_pid:.agent.services.twitch.encoder_pid,restarts:.agent.services.twitch.restarts},kick:{status:.agent.services.kick.status,encoder_pid:.agent.services.kick.encoder_pid,restarts:.agent.services.kick.restarts}}' /tmp/after.json
