name: MediaForge — Direct Deploy Control API OVH
# second-visual-private-import: 2026-10-06

on:
  push:
    paths:
      - '.github/workflows/ops-deploy-control-center-ovh-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy ONLY Control API on OVH
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          LOGIN="$(curl -kfsS --connect-timeout 8 --max-time 25 -X POST "$BASE/api/auth/login" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          ID="direct-control-api-$(date -u +%Y%m%d%H%M%S)"
          CREATE="$(curl -kfsS -X POST "$BASE/api/ovh/deploy" \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --data "$(jq -nc --arg id "$ID" '{action:"deploy_service",target:"control-api",request_id:$id,source:"second-visual-private-import"}')")"
          echo "$CREATE" | jq '{ok,command:{id:.command.id,action:.command.action,target:.command.target,status:(.command.status//"pending")}}'

          for i in $(seq 1 120); do
            curl -kfsS "$BASE/api/ovh/deploy-status?id=$ID" -H "authorization: Bearer $TOKEN" > /tmp/status.json
            ST="$(jq -r '.command.status // empty' /tmp/status.json)"
            echo "control-api=$ST"
            [ "$ST" = "completed" ] && break
            if [ "$ST" = "failed" ] || [ "$ST" = "cancelled" ]; then
              jq '{command:{id:.command.id,status:.command.status,error:.command.error,result:.command.result}}' /tmp/status.json
              exit 1
            fi
            sleep 3
          done
          jq -e '.command.status=="completed"' /tmp/status.json >/dev/null
          jq -e '.command.result.mediaforge_control_plane.publisher_pids_preserved==true' /tmp/status.json >/dev/null
          jq '{command:{id:.command.id,status:.command.status,result:{git_head:.command.result.git_head,publisher_pids_preserved:.command.result.mediaforge_control_plane.publisher_pids_preserved,ui_verified:.command.result.mediaforge_control_plane.ui_verified}}}' /tmp/status.json

      - name: Verify direct API is healthy
        shell: bash
        run: |
          set -euo pipefail
          curl -kfsS --retry 5 --retry-delay 2 "https://146.59.156.224:8443/api/health" | jq .
