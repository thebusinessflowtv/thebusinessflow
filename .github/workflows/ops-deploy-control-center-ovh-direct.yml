name: MediaForge — Diagnose Twitch Kick Video Corruption 2026-10-10
# live-incident: 2026-10-08-disable-120s-encoder-kill

on:
  push:
    paths:
      - '.github/workflows/ops-deploy-control-center-ovh-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify no Python syntax regression in H264 passthrough
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 https://raw.githubusercontent.com/thebusinessflowtv/theofficemusic/main/ovh-streaming/app/stream_core.py > /tmp/stream_core.py
          python -m py_compile /tmp/stream_core.py

      - name: Login and capture encoder health
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          LOGIN="$(curl -kfsS --retry 8 --retry-all-errors --retry-delay 2 -X POST "$BASE/api/auth/login" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > /tmp/mf-token
          curl -kfsS -H "authorization: Bearer $TOKEN" "$BASE/api/ovh/status" > /tmp/before.json
          jq '{twitch:{status:.agent.services.twitch.status,encoder_pid:.agent.services.twitch.encoder_pid,restarts:.agent.services.twitch.restarts,visual_revision:.agent.services.twitch.visual_revision},kick:{status:.agent.services.kick.status,encoder_pid:.agent.services.kick.encoder_pid,restarts:.agent.services.kick.restarts,visual_revision:.agent.services.kick.visual_revision}}' /tmp/before.json

      - name: Read both publishers and video sender diagnostics without restarts
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN="$(cat /tmp/mf-token)"
          for SLOT in twitch kick; do
            ID="incident-video-corruption-20261010-$SLOT-$(date -u +%Y%m%d%H%M%S)"
            echo "=== $SLOT ==="
            curl -kfsS --retry 4 --retry-all-errors --retry-delay 2 -X POST "$BASE/api/ovh/deploy" \
              -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              --data "$(jq -nc --arg id "$ID" --arg slot "$SLOT" '{action:"diagnose_service",target:$slot,request_id:$id,source:"20261010-video-corruption-both"}')" > /tmp/request.json
            for I in $(seq 1 70); do
              curl -kfsS --retry 3 --retry-all-errors --retry-delay 2 \
                "$BASE/api/ovh/deploy-status?id=$ID" -H "authorization: Bearer $TOKEN" > /tmp/"$SLOT"-diagnostic.json
              STATUS="$(jq -r '.command.status // empty' /tmp/"$SLOT"-diagnostic.json)"
              [ "$STATUS" = completed ] && break
              [ "$STATUS" = failed ] && { jq '.command | {status,error}' /tmp/"$SLOT"-diagnostic.json; exit 1; }
              sleep 2
            done
            jq -e '.command.status=="completed"' /tmp/"$SLOT"-diagnostic.json >/dev/null
            jq '{status:.command.status,health:.command.result.health,desired:.command.result.desired,video:.command.result.visual_health,audio:.command.result.audio_health,container:.command.result.docker_stats,ffmpeg_errors:(.command.result.ffmpeg_log_tail//""|split("\\n")|map(select(test("corrupt|overrun|decod|invalid|error|failed|fifo|non-existing|pps|sps|buffer|queue";"i")))|.[-12:]),sender_errors:(.command.result.visual_ffmpeg_log_tail//""|split("\\n")|map(select(test("error|failed|broken|pipe|invalid|drop|overrun";"i")))|.[-12:])}' /tmp/"$SLOT"-diagnostic.json
          done
          curl -kfsS --retry 4 --retry-all-errors --retry-delay 2 \
            -H "authorization: Bearer $TOKEN" "$BASE/api/ovh/status" > /tmp/host.json
          jq '{reported_at:.agent.reported_at,host:.agent.host,twitch:{status:.agent.services.twitch.status,encoder_pid:.agent.services.twitch.encoder_pid,restarts:.agent.services.twitch.restarts},kick:{status:.agent.services.kick.status,encoder_pid:.agent.services.kick.encoder_pid,restarts:.agent.services.kick.restarts}}' /tmp/host.json
