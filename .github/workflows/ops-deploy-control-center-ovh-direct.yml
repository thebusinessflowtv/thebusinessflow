name: MediaForge — Repair Twitch FLV Ingest
# live-incident: 2026-10-08-disable-120s-encoder-kill

on:
  push:
    paths:
      - '.github/workflows/ops-deploy-control-center-ovh-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify no Python syntax regression in H264 passthrough
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 https://raw.githubusercontent.com/thebusinessflowtv/theofficemusic/main/ovh-streaming/app/stream_core.py > /tmp/stream_core.py
          python -m py_compile /tmp/stream_core.py

      - name: Login and capture encoder health
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          LOGIN="$(curl -kfsS --retry 8 --retry-all-errors --retry-delay 2 -X POST "$BASE/api/auth/login" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > /tmp/mf-token
          curl -kfsS -H "authorization: Bearer $TOKEN" "$BASE/api/ovh/status" > /tmp/before.json
          jq '{twitch:{status:.agent.services.twitch.status,encoder_pid:.agent.services.twitch.encoder_pid,restarts:.agent.services.twitch.restarts,visual_revision:.agent.services.twitch.visual_revision},kick:{status:.agent.services.kick.status,encoder_pid:.agent.services.kick.encoder_pid,restarts:.agent.services.kick.restarts,visual_revision:.agent.services.kick.visual_revision}}' /tmp/before.json

      - name: Deploy Twitch FLV transport fix without touching Kick
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN="$(cat /tmp/mf-token)"
          ID="incident-twitch-flv-fix-20261008-$(date -u +%Y%m%d%H%M%S)"
          curl -kfsS -X POST "$BASE/api/ovh/deploy" \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --data "$(jq -nc --arg id "$ID" '{action:"deploy_service",target:"twitch",request_id:$id,source:"incident-twitch-flv-direct-tag7"}')" \
            > /tmp/create.json
          for I in $(seq 1 120); do
            if ! curl -kfsS --retry 4 --retry-all-errors --retry-delay 2 "$BASE/api/ovh/deploy-status?id=$ID" \
              -H "authorization: Bearer $TOKEN" > /tmp/status.json; then
              sleep 2
              continue
            fi
            ST="$(jq -r '.command.status // empty' /tmp/status.json)"
            echo "ovh-agent=$ST"
            [ "$ST" = "completed" ] && break
            if [ "$ST" = "failed" ] || [ "$ST" = "cancelled" ]; then
              cat /tmp/status.json
              exit 1
            fi
            sleep 3
          done
          jq -e '.command.status=="completed"' /tmp/status.json >/dev/null

      - name: Confirm corrected Twitch publisher and Kick retained
        shell: bash
        run: |
          set -euo pipefail
          jq '{status:.command.status,error:.command.error,service:.command.result.service,health:.command.result.health}' /tmp/status.json
          TOKEN="$(cat /tmp/mf-token)"
          curl -kfsS --retry 4 --retry-all-errors --retry-delay 2 -H "authorization: Bearer $TOKEN" "https://146.59.156.224:8443/api/ovh/status" > /tmp/after.json
          jq '{host:.agent.host,reported_at:.agent.reported_at,twitch:{status:.agent.services.twitch.status,restarts:.agent.services.twitch.restarts,pid:.agent.services.twitch.encoder_pid},kick:{status:.agent.services.kick.status,restarts:.agent.services.kick.restarts,pid:.agent.services.kick.encoder_pid}}' /tmp/after.json
          jq '{deploy_status:.command.status,error:.command.error,target:.command.result.service,health:.command.result.health}' /tmp/status.json
          jq '{host:.agent.host,twitch:{status:.agent.services.twitch.status,pid:.agent.services.twitch.encoder_pid,restarts:.agent.services.twitch.restarts},kick:{status:.agent.services.kick.status,pid:.agent.services.kick.encoder_pid,restarts:.agent.services.kick.restarts}}' /tmp/after.json
          jq -e '.agent.services.twitch.encoder_pid!=null and .agent.services.twitch.status=="live"' /tmp/after.json > /dev/null
          echo "TWITCH_PUBLISHER_DEPLOYED_KICK_UNCHANGED_IN_WORKFLOW"
