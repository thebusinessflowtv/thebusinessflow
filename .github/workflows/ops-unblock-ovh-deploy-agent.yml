name: MediaForge — Unblock OVH Deploy Agent

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-unblock-ovh-deploy-agent.yml'

jobs:
  unblock:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install
      - name: Resolve D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - name: Inspect and cancel stale maintenance commands
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="
          npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,action,target,status,created_at,claimed_at,error FROM ovh_deploy_commands WHERE status IN ('pending','claimed') ORDER BY created_at ASC LIMIT 50;"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Keep the new realtime-audio-control deployment commands. Cancel
          # older diagnostics/restarts/hot-patches that are no longer relevant.
          npx wrangler d1 execute mediaforge-control --remote --yes --command "UPDATE ovh_deploy_commands SET status='cancelled',completed_at='$NOW',error='superseded by realtime audio controls deployment' WHERE status IN ('pending','claimed') AND id NOT LIKE 'deploy-host-audio-controls-%' AND id NOT LIKE 'hotpatch-audio-controls-%' AND created_at < '$NOW';"
          echo "=== AFTER ==="
          npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,action,target,status,created_at,claimed_at,error FROM ovh_deploy_commands WHERE status IN ('pending','claimed') ORDER BY created_at ASC LIMIT 50;"
