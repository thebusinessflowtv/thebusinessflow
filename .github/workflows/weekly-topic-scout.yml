name: The Business Flow Weekly Topic Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: read

jobs:
  scout:
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY" || { echo 'Missing ANTHROPIC_API_KEY'; exit 1; }
          test -n "$YOUTUBE_CLIENT_ID" || { echo 'Missing YOUTUBE_CLIENT_ID'; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET" || { echo 'Missing YOUTUBE_CLIENT_SECRET'; exit 1; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo 'Missing YOUTUBE_REFRESH_TOKEN'; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt

      - name: Analyze recent business-documentary performance on YouTube
        run: python production/scout_youtube.py

      - name: Upload scout report
        uses: actions/upload-artifact@v4
        with:
          name: the-business-flow-weekly-topic-scout-${{ github.run_id }}
          path: production/scout-output/
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo '### The Business Flow Weekly Topic Scout ✅' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reference channels analyzed via YouTube Data API' >> "$GITHUB_STEP_SUMMARY"
          echo '- Recent titles and views/day compared' >> "$GITHUB_STEP_SUMMARY"
          echo '- 20 original candidate topics generated by Anthropic' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing 50-topic queue excluded from candidate generation' >> "$GITHUB_STEP_SUMMARY"
