name: The Business Flow Weekly Topic Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: read
  actions: write

concurrency:
  group: the-business-flow-topic-scout
  cancel-in-progress: false

jobs:
  scout:
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_SCOUT_MODEL: ${{ vars.ANTHROPIC_SCOUT_MODEL || 'claude-haiku-4-5-20251001' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY"
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"

      - name: Restore this week's Haiku scout cache
        id: scout-cache
        uses: actions/cache/restore@v4
        with:
          path: production/scout-cache
          key: tbf-topic-scout-v2-${{ github.run_id }}
          restore-keys: |
            tbf-topic-scout-v2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt

      - name: Free syntax validation
        run: python -m py_compile production/anthropic_budget.py production/scout_youtube.py

      - name: Analyze YouTube data with Haiku 4.5
        run: python production/scout_youtube.py

      - name: Save Haiku scout response immediately
        if: always()
        uses: actions/cache/save@v4
        with:
          path: production/scout-cache
          key: tbf-topic-scout-v2-${{ github.run_id }}

      - name: Upload scout report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: the-business-flow-weekly-topic-scout-${{ github.run_id }}
          path: production/scout-output/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve scout state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: the-business-flow-scout-recovery-${{ github.run_id }}
          path: |
            production/scout-cache/
            production/scout-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo '### The Business Flow Weekly Topic Scout ✅' >> "$GITHUB_STEP_SUMMARY"
          echo '- YouTube Data API supplies the performance data' >> "$GITHUB_STEP_SUMMARY"
          echo '- Haiku 4.5 analyzes it; Sonnet is not used' >> "$GITHUB_STEP_SUMMARY"
          echo '- Same-week retry reuses the saved Haiku result' >> "$GITHUB_STEP_SUMMARY"
