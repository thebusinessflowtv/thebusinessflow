name: MediaForge — Diagnose Twitch Only

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-diagnose-twitch-only.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: cloudflare/mediaforge-worker
        run: npm install
      - name: Resolve D1
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const row=(Array.isArray(list)?list:(list.result||[])).find(x=>x.name==='mediaforge-control');
          process.stdout.write(row?.uuid||row?.id||'');
          NODE
          )"
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:'mediaforge-control',database_id:process.env.DB_ID}];
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - name: Diagnose Twitch
        working-directory: cloudflare/mediaforge-worker
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ID="diagnose-twitch-only-$(date -u +%Y%m%d%H%M%S)"
          PAYLOAD="{\"id\":\"$ID\",\"action\":\"diagnose_service\",\"target\":\"twitch\",\"requested_at\":\"$NOW\",\"requested_by\":\"github-ops\",\"source\":\"twitch-diagnose-only\"}"
          npx wrangler d1 execute mediaforge-control --remote --yes --command "INSERT OR REPLACE INTO ovh_deploy_commands(id,action,target,payload_json,status,created_at) VALUES('$ID','diagnose_service','twitch','$PAYLOAD','pending','$NOW');"
          for i in $(seq 1 25); do
            npx wrangler d1 execute mediaforge-control --remote --json --command "SELECT id,status,error,result_json FROM ovh_deploy_commands WHERE id='$ID';" > /tmp/diag.json
            if grep -q '"status": "completed"' /tmp/diag.json; then break; fi
            if grep -q '"status": "failed"' /tmp/diag.json; then cat /tmp/diag.json; exit 1; fi
            sleep 3
          done
          cat /tmp/diag.json
      - name: Public health
        run: curl -fsS --retry 5 --retry-all-errors https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/public-health
