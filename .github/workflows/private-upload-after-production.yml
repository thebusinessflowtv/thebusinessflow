name: The Business Flow Private YouTube Upload

on:
  workflow_run:
    workflows:
      - 'The Business Flow Daily Production'
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed Daily Production run id to upload.'
        required: true
        type: string
  push:
    paths:
      - 'production/private-upload-now.json'

permissions:
  actions: read
  contents: write

concurrency:
  group: the-business-flow-private-youtube-upload
  cancel-in-progress: false

jobs:
  upload-private:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve requested production run
        id: source
        env:
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(python - <<'PY'
          import json, os
          from pathlib import Path

          event_name = os.environ.get('GITHUB_EVENT_NAME') or ''
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))

          if event_name == 'workflow_run':
              wr = event.get('workflow_run') or {}
              if str(wr.get('conclusion') or '') != 'success':
                  raise SystemExit('Production workflow did not finish successfully')
              print(int(wr['id']))
          elif event_name == 'workflow_dispatch':
              raw = (os.environ.get('INPUT_SOURCE_RUN_ID') or '').strip()
              if not raw:
                  raise SystemExit('Missing source_run_id input')
              print(int(raw))
          else:
              trigger = Path('production/private-upload-now.json')
              if not trigger.exists():
                  raise SystemExit('Missing production/private-upload-now.json')
              d = json.loads(trigger.read_text(encoding='utf-8'))
              print(int(d['source_run_id']))
          PY
          )"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download completed production artifact
        uses: actions/download-artifact@v4
        with:
          pattern: tbf-production-*
          path: restored
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Resolve package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test -s restored/rendered/final.mp4
          test -s restored/rendered/thumbnail.png
          test -s restored/rendered/metadata.json
          PACKAGE="$(find restored/output -type f -name episode-package.json | head -n 1)"
          test -s "$PACKAGE"
          TOPIC_ID="$(python - "$PACKAGE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print(d['topic_id'])
          PY
          )"
          echo "topic_id=$TOPIC_ID" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uploader and validate credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r youtube-worker/requirements.txt
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          test -n "$YOUTUBE_CHANNEL_ID"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 restored/rendered/final.mp4 | head -1)"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 restored/rendered/final.mp4 | head -1)"
          test "$WIDTH" = "3840"
          test "$HEIGHT" = "2160"
      - name: Force private-only metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          src='restored/rendered/metadata.json'
          dst='restored/rendered/private-metadata.json'
          d=json.load(open(src,encoding='utf-8'))
          d.pop('publish_at',None)
          d['privacy_status']='private'
          json.dump(d,open(dst,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Restore durable checkpoint
        shell: bash
        run: |
          TOPIC='${{ steps.package.outputs.topic_id }}'
          mkdir -p production/youtube-checkpoints
          if [ -s "production/youtube-checkpoints/${TOPIC}.json" ]; then
            cp "production/youtube-checkpoints/${TOPIC}.json" restored/rendered/youtube-upload-private.json
          fi
      - name: Upload to YouTube as PRIVATE
        shell: bash
        run: |
          set -euo pipefail
          python youtube-worker/youtube_private_uploader.py \
            --video restored/rendered/final.mp4 \
            --thumbnail restored/rendered/thumbnail.png \
            --metadata restored/rendered/private-metadata.json \
            --checkpoint restored/rendered/youtube-upload-private.json
      - name: Verify and persist checkpoint
        shell: bash
        run: |
          set -euo pipefail
          TOPIC='${{ steps.package.outputs.topic_id }}'
          python - <<'PY'
          import json
          p='restored/rendered/youtube-upload-private.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('youtube_video_id'), d
          assert d.get('privacy_status') == 'private', d
          assert not d.get('scheduled'), d
          print('PRIVATE upload verified:', d['youtube_video_id'])
          PY
          mkdir -p production/youtube-checkpoints
          cp restored/rendered/youtube-upload-private.json "production/youtube-checkpoints/${TOPIC}.json"
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          topic='${{ steps.package.outputs.topic_id }}'
          cp=json.load(open(f'production/youtube-checkpoints/{topic}.json',encoding='utf-8'))
          path='production/topics.json'
          d=json.load(open(path,encoding='utf-8'))
          for row in d.get('topics',[]):
              if str(row.get('id')) == topic:
                  row['status']='uploaded_private'
                  row['youtube_video_id']=cp['youtube_video_id']
                  row['youtube_privacy_status']='private'
                  row['youtube_uploaded_at']=datetime.now(timezone.utc).isoformat()
                  break
          json.dump(d,open(path,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          git config user.name 'MediaForge Control Center'
          git config user.email 'thebusinessflowtv@gmail.com'
          git add production/topics.json "production/youtube-checkpoints/${TOPIC}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint private YouTube upload ${TOPIC}"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: Preserve upload checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-youtube-private-${{ steps.package.outputs.topic_id }}-${{ github.run_id }}
          path: restored/rendered/youtube-upload-private.json
          if-no-files-found: warn
          retention-days: 14
