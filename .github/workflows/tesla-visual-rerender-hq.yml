name: Tesla HQ Visual Re-render

on:
  push:
    paths:
      - 'production/tesla-rerender.request'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tbf-tesla-hq-rerender
  cancel-in-progress: true

jobs:
  rerender:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      ANTHROPIC_API_KEY: ''
      VISUAL_IMAGE_TARGET: '50'
      VISUAL_IMAGE_MIN: '40'
      VISUAL_MAX_PER_QUERY: '7'
      VISUAL_MIN_SOURCE_WIDTH: '1920'
      VISUAL_MIN_SOURCE_HEIGHT: '1080'
      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r production/requirements.txt
          git lfs pull
          python -m py_compile production/collect_visual_assets_hq.py production/render_episode_hq.py production/collect_visual_assets.py production/render_episode.py youtube-worker/youtube_private_uploader.py
          test -z "${ANTHROPIC_API_KEY}"
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          test -n "$YOUTUBE_CHANNEL_ID"

      - name: Download previous Tesla production artifact
        uses: actions/download-artifact@v4
        with:
          name: tbf-production-famous-002-35769823800
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35769823800

      - name: Recover exact old audio and package
        shell: bash
        run: |
          set -euo pipefail
          test -s previous/rendered/final.mp4
          test -s previous/output/famous-002/episode-package.json
          test -s production/research-library/famous-002.json
          mkdir -p production/tesla-rerender production/research-cache/famous-002
          cp production/research-library/famous-002.json production/research-cache/famous-002/research.json
          ffmpeg -hide_banner -loglevel error -y -i previous/rendered/final.mp4 -map 0:a:0 -vn -c:a copy production/tesla-rerender/original-audio.m4a
          test -s production/tesla-rerender/original-audio.m4a
          echo 'Original Tesla audio recovered. No TTS and no Anthropic call will run.'

      - name: Restore HQ visual cache
        id: visual-cache
        uses: actions/cache/restore@v4
        with:
          path: production/visual-cache/famous-002
          key: tbf-visual-hq-v2-famous-002-${{ github.run_id }}
          restore-keys: |
            tbf-visual-hq-v2-famous-002-

      - name: Collect 50 strict Tesla visuals at 1080p minimum, 4K preferred
        id: visuals
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python production/collect_visual_assets.py \
            --topic-id famous-002 \
            --research production/research-cache/famous-002/research.json \
            --target 50

      - name: Save HQ visual cache immediately
        if: always() && steps.visual-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: production/visual-cache/famous-002
          key: ${{ steps.visual-cache.outputs.cache-primary-key }}

      - name: Validate image quality and relevance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          m=Path('production/visual-cache/famous-002/visual-assets.json')
          d=json.loads(m.read_text(encoding='utf-8'))
          assets=d.get('assets') or []
          if len(assets) != 50:
              raise SystemExit(f'Expected exactly 50 Tesla images, got {len(assets)}')
          if not d.get('logos_excluded') or not d.get('off_topic_blocking'):
              raise SystemExit('Strict relevance/logo gate not active')
          bad=[]
          for a in assets:
              sw=int(a.get('source_width') or 0); sh=int(a.get('source_height') or 0)
              if sw < 1920 or sh < 1080:
                  bad.append(f"{a.get('title')} source={sw}x{sh}")
              p=Path(a['local_path'])
              with Image.open(p) as im:
                  if im.size != (3840,2160):
                      bad.append(f"{a.get('title')} normalized={im.size}")
              title=(a.get('title') or '').lower()
              forbidden=(' dog',' puppy',' cat',' kitten',' animal','nikola tesla','tesla coil','tesla museum','tesla statue')
              if any(x in title for x in forbidden):
                  bad.append(f"off-topic={a.get('title')}")
          if bad:
              raise SystemExit('HQ visual gate failed:\n'+'\n'.join(bad[:20]))
          print('Tesla HQ visual gate passed:', len(assets), 'images; native 4K:', d.get('native_4k_count'))
          print('All source images >=1080p and all normalized images are 3840x2160.')
          PY

      - name: Re-render using exact previous audio — no TTS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production/rerendered
          python production/render_episode.py \
            --package previous/output/famous-002/episode-package.json \
            --output-dir production/rerendered \
            --narration production/tesla-rerender/original-audio.m4a

      - name: Remux exact original audio without truncation
        shell: bash
        run: |
          set -euo pipefail
          test -s production/rerendered/picture-track-4k.mp4
          test -s production/tesla-rerender/original-audio.m4a
          ffmpeg -hide_banner -loglevel error -y \
            -i production/rerendered/picture-track-4k.mp4 \
            -i production/tesla-rerender/original-audio.m4a \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a copy -movflags +faststart \
            production/rerendered/final-exact-audio.mp4
          mv production/rerendered/final-exact-audio.mp4 production/rerendered/final.mp4
          echo 'Final MP4 remuxed with the original AAC stream, with no -shortest truncation.'

      - name: Validate 4K, stable zoom, zero loops and exact audio reuse
        shell: bash
        run: |
          set -euo pipefail
          test -s production/rerendered/final.mp4
          RES="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 production/rerendered/final.mp4)"
          test "$RES" = "3840x2160" || { echo "Unexpected resolution: $RES"; exit 1; }
          OLD_HASH="$(ffmpeg -v error -i production/tesla-rerender/original-audio.m4a -map 0:a:0 -c copy -f hash -hash sha256 - | tail -1)"
          NEW_HASH="$(ffmpeg -v error -i production/rerendered/final.mp4 -map 0:a:0 -c copy -f hash -hash sha256 - | tail -1)"
          test "$OLD_HASH" = "$NEW_HASH" || { echo 'Audio stream still changed after exact remux'; exit 1; }
          python - <<'PY'
          import json
          plan=json.load(open('production/rerendered/selected-assets.json',encoding='utf-8'))
          ids=[x['asset_id'] for x in plan]
          if len(ids) != len(set(ids)):
              raise SystemExit('Repeated asset detected')
          if any(x.get('looped') for x in plan):
              raise SystemExit('Loop detected')
          bad_motion=[x for x in plan if x.get('asset_type')=='image' and x.get('motion') not in {'zoom_in','zoom_out'}]
          if bad_motion:
              raise SystemExit('Unexpected image motion detected')
          videos=[x for x in plan if x.get('asset_type')=='video']
          for x in videos:
              hay=(x.get('title') or '').lower()+' '+(x.get('query') or '').lower()
              if not any(t in hay for t in ('tesla','cybertruck','model 3','model y','model s','model x','supercharger','gigafactory')):
                  raise SystemExit(f"Off-topic support video: {x.get('title')}")
          print('4K validation passed | assets:',len(plan),'| support videos:',len(videos),'| loops: 0 | motion: zoom only | exact audio: yes')
          PY

      - name: Upload corrected Tesla review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbf-tesla-hq-rerender-${{ github.run_id }}
          path: |
            production/rerendered/final.mp4
            production/rerendered/thumbnail.png
            production/rerendered/metadata.json
            production/rerendered/selected-assets.json
            production/rerendered/scene-plan.json
            production/visual-cache/famous-002/visual-assets.json
            production/tesla-rerender/original-audio.m4a
          retention-days: 7
          if-no-files-found: error

      - name: Prepare private YouTube metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          src='production/rerendered/metadata.json'
          dst='production/rerendered/private-metadata.json'
          d=json.load(open(src, encoding='utf-8'))
          d.pop('publish_at', None)
          json.dump(d, open(dst, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('Private metadata prepared; publish_at removed.')
          PY

      - name: Restore corrected Tesla YouTube checkpoint if present
        shell: bash
        run: |
          set -euo pipefail
          DURABLE='production/youtube-checkpoints/famous-002-hq.json'
          RUNTIME='production/rerendered/youtube-upload-private.json'
          if [ -s "$DURABLE" ]; then
            cp "$DURABLE" "$RUNTIME"
            echo 'Existing corrected Tesla checkpoint restored; duplicate upload protection active.'
          else
            rm -f "$RUNTIME"
            echo 'No corrected Tesla checkpoint yet; a new private upload will be created.'
          fi

      - name: Upload corrected Tesla to YouTube as PRIVATE
        shell: bash
        run: |
          set -euo pipefail
          python youtube-worker/youtube_private_uploader.py \
            --video production/rerendered/final.mp4 \
            --thumbnail production/rerendered/thumbnail.png \
            --metadata production/rerendered/private-metadata.json \
            --checkpoint production/rerendered/youtube-upload-private.json

      - name: Verify corrected private YouTube upload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='production/rerendered/youtube-upload-private.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d.get('youtube_video_id'), d
          assert d.get('privacy_status') == 'private', d
          assert not d.get('scheduled'), d
          assert not d.get('publish_at'), d
          print('Corrected Tesla PRIVATE upload verified:', d['youtube_video_id'])
          print('Permalink:', d['youtube_permalink'])
          PY

      - name: Persist corrected Tesla YouTube checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/youtube-checkpoints
          cp production/rerendered/youtube-upload-private.json production/youtube-checkpoints/famous-002-hq.json
          cp production/rerendered/youtube-upload-private.json production/youtube-checkpoints/famous-002.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          checkpoint=json.load(open('production/youtube-checkpoints/famous-002-hq.json', encoding='utf-8'))
          p='production/topics.json'
          d=json.load(open(p, encoding='utf-8'))
          for t in d.get('topics', []):
              if str(t.get('id')) == 'famous-002':
                  t['status']='uploaded_private'
                  t['youtube_video_id']=checkpoint['youtube_video_id']
                  t['youtube_privacy_status']='private'
                  t['youtube_uploaded_at']=datetime.now(timezone.utc).isoformat()
                  t['visual_quality']='hq_4k_corrected'
                  break
          else:
              raise SystemExit('famous-002 not found in production/topics.json')
          json.dump(d, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          git config user.name 'The Business Flow Factory'
          git config user.email 'thebusinessflowtv@gmail.com'
          git add production/topics.json production/youtube-checkpoints/famous-002.json production/youtube-checkpoints/famous-002-hq.json
          if git diff --cached --quiet; then
            echo 'Corrected checkpoint already persisted.'
          else
            git commit -m 'Checkpoint corrected Tesla 4K private upload'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Preserve corrected YouTube checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbf-tesla-hq-youtube-${{ github.run_id }}
          path: production/rerendered/youtube-upload-private.json
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Tesla HQ Visual Re-render'
            echo '- Anthropic spend for this rerender: $0.0000'
            echo '- TTS spend/call: none; exact previous audio reused'
            echo '- Minimum source image resolution: 1920x1080'
            echo '- Preferred source quality: native 4K'
            echo '- Final video: 3840x2160'
            echo '- Image movement: centered zoom-in / zoom-out only'
            echo '- Generic video fallback: disabled'
            if [ -s production/rerendered/youtube-upload-private.json ]; then
              python - <<'PY'
          import json
          d=json.load(open('production/rerendered/youtube-upload-private.json', encoding='utf-8'))
          print(f"- YouTube corrected video ID: {d.get('youtube_video_id')}")
          print(f"- YouTube privacy: {d.get('privacy_status')}")
          print(f"- YouTube permalink: {d.get('youtube_permalink')}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
