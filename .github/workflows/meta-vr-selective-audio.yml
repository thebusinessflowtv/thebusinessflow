name: Meta VR Selective Audio Extract

on:
  push:
    paths:
      - 'production/meta-vr-selective-audio-request.json'

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Selectively extract audio assets from original artifact ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p exported
          python - <<'PY'
          import json, os, struct, zlib, urllib.request, urllib.error, pathlib
          req=json.load(open('production/meta-vr-selective-audio-request.json'))
          artifact_id=int(req['artifact_id'])
          api=f"https://api.github.com/repos/thebusinessflowtv/thebusinessflow/actions/artifacts/{artifact_id}/zip"
          r=urllib.request.Request(api, headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}", 'Accept':'application/vnd.github+json', 'User-Agent':'tbf-recut'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          try:
              urllib.request.build_opener(NoRedirect).open(r, timeout=30)
              raise RuntimeError('Expected artifact redirect')
          except urllib.error.HTTPError as e:
              if e.code not in (301,302,303,307,308): raise
              url=e.headers['Location']
          print('Signed archive URL acquired')
          def get_range(a,b):
              q=urllib.request.Request(url, headers={'Range':f'bytes={a}-{b}','User-Agent':'tbf-recut'})
              with urllib.request.urlopen(q, timeout=60) as rr: return rr.read(), rr.headers
          data,h=get_range(0,0)
          cr=h.get('Content-Range')
          if cr: size=int(cr.split('/')[-1])
          else: size=int(h.get('Content-Length'))
          tail_start=max(0,size-131072)
          tail,_=get_range(tail_start,size-1)
          sig=b'PK\x05\x06'; pos=tail.rfind(sig)
          if pos<0: raise RuntimeError('EOCD not found')
          eocd=tail[pos:pos+22]
          _,disk,cd_disk,n_disk,n_total,cd_size,cd_off,comment_len=struct.unpack('<4s4H2IH',eocd)
          cd,_=get_range(cd_off,cd_off+cd_size-1)
          entries=[]; p=0
          while p+46<=len(cd) and cd[p:p+4]==b'PK\x01\x02':
              vals=struct.unpack('<4s6H3I5H2I',cd[p:p+46])
              method=vals[4]; csize=vals[8]; usize=vals[9]; fnl=vals[10]; exl=vals[11]; col=vals[12]; loff=vals[16]
              name=cd[p+46:p+46+fnl].decode('utf-8','replace')
              entries.append((name,method,csize,usize,loff))
              p += 46+fnl+exl+col
          print('ZIP entries',len(entries))
          for e in entries: print(e[0], e[2], e[3])
          audio_ext=('.mp3','.m4a','.aac','.wav','.flac','.ogg')
          candidates=[e for e in entries if e[0].lower().endswith(audio_ext) and e[3] < 150_000_000]
          if not candidates: raise RuntimeError('No audio candidates found in artifact')
          print('Audio candidates:', [e[0] for e in candidates])
          for name,method,csize,usize,loff in candidates:
              hdr,_=get_range(loff,loff+29)
              hv=struct.unpack('<4s5H3I2H',hdr)
              fnl,exl=hv[-2],hv[-1]
              start=loff+30+fnl+exl
              comp,_=get_range(start,start+csize-1)
              if method==0: raw=comp
              elif method==8: raw=zlib.decompress(comp,-15)
              else:
                  print('skip unsupported method',method,name); continue
              out=pathlib.Path('exported')/pathlib.Path(name).name
              out.write_bytes(raw)
              print('WROTE',out,len(raw))
          pathlib.Path('exported/entry-list.txt').write_text('\n'.join(e[0] for e in entries))
          PY
      - name: Upload selected audio files
        uses: actions/upload-artifact@v4
        with:
          name: meta-vr-selective-audio-${{ github.run_id }}
          path: exported/
          if-no-files-found: error
          retention-days: 7
