name: MFCC Patch Production Controls

on:
  push:
    paths:
      - '.github/workflows/mfcc-patch-delete-production.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update production detail controls
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('docs/control-center/app.html')
          text = p.read_text(encoding='utf-8')

          # Keep the delete action available while a production is active.
          needle = '<button class="btn" id="refreshStatus">↻ Atualizar agora</button>'
          if 'id="deleteProduction"' not in text:
              pos = text.find(needle)
              if pos < 0:
                  raise SystemExit('refresh button not found')
              pos += len(needle)
              insert = "'+(!terminal.includes(p.status)?'<button class=\"btn danger\" id=\"deleteProduction\">✕ Excluir execução</button>':'')+'"
              text = text[:pos] + insert + text[pos:]

          marker = "document.querySelectorAll('.downloadBtn').forEach"
          if "mfcc-delete-production" not in text:
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit('download marker not found')
              wiring = "const deleteBtn=document.getElementById('deleteProduction');if(deleteBtn)deleteBtn.onclick=()=>modal('Excluir execução?','A produção <b>'+esc(topic(p))+'</b> será removida do painel. Se houver uma execução ativa no GitHub, o sistema tentará cancelá-la antes.<br><br><b>Esta ação não pode ser desfeita.</b>','Excluir execução',async()=>{clearPoll();const r=await invoke('mfcc-delete-production',{production_id:id});toast('Execução excluída',r&&r.cancelled?'A execução do GitHub também foi cancelada.':'A produção foi removida do painel.','success');go('/productions')});"
              text = text[:pos] + wiring + text[pos:]

          # Suggest mode needs to poll the suggestions endpoint, not only generic status.
          old_poll = "state.pollTimer=setInterval(async()=>{try{await invoke('mfcc-status',{production_id:id});if(location.hash.startsWith('#/production/'+id))await productionDetail(path,id)}catch(e){console.warn(e)}},5000)"
          new_poll = "state.pollTimer=setInterval(async()=>{try{if(p.generation_mode==='suggest'&&!p.selected_topic){const sr=await invoke('mfcc-suggestions',{production_id:id});if(sr&&sr.ready){clearPoll();renderSuggestions(id,(sr.suggestions||[]).slice(0,5));return}}else{await invoke('mfcc-status',{production_id:id})}if(location.hash.startsWith('#/production/'+id))await productionDetail(path,id)}catch(e){console.warn(e)}},5000)"
          if old_poll in text:
              text = text.replace(old_poll, new_poll, 1)

          # Manual refresh follows the same logic so suggestion-mode productions never look stuck.
          old_manual = "try{await invoke('mfcc-status',{production_id:id});toast('Status atualizado','','success')}catch(e){toast('Falha ao atualizar',e.setup?('Configuração necessária: '+e.setup):errMsg(e),'error')}route()"
          new_manual = "try{if(p.generation_mode==='suggest'&&!p.selected_topic){const sr=await invoke('mfcc-suggestions',{production_id:id});if(sr&&sr.ready){clearPoll();renderSuggestions(id,(sr.suggestions||[]).slice(0,5));return}}else{await invoke('mfcc-status',{production_id:id})}toast('Status atualizado','','success')}catch(e){toast('Falha ao atualizar',e.setup?('Configuração necessária: '+e.setup):errMsg(e),'error')}route()"
          if old_manual in text:
              text = text.replace(old_manual, new_manual, 1)

          # Keep automatic refresh at 5 seconds.
          old_poll_12 = "state.pollTimer=setInterval(async()=>{try{await invoke('mfcc-status',{production_id:id});if(location.hash.startsWith('#/production/'+id))await productionDetail(path,id)}catch(e){console.warn(e)}},12000)"
          if old_poll_12 in text:
              text = text.replace(old_poll_12, new_poll, 1)

          # Show the user that this screen is live while the production is active.
          auto_anchor = "statusPill(p.status)+'<button class=\"btn\" id=\"refreshStatus\">↻ Atualizar agora</button>'"
          auto_repl = "statusPill(p.status)+(!terminal.includes(p.status)?'<span class=\"pill p-success\" id=\"autoRefreshIndicator\">● Auto · 5s</span>':'')+'<button class=\"btn\" id=\"refreshStatus\">↻ Atualizar agora</button>'"
          if 'id="autoRefreshIndicator"' not in text and auto_anchor in text:
              text = text.replace(auto_anchor, auto_repl, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "MediaForge Bot"
          git config user.email "thebusinessflowtv@gmail.com"
          git add docs/control-center/app.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix live suggestion refresh in Control Center"
          git push
