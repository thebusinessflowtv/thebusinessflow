name: Patch Office Music Queue Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-office-music-queue-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch queue routing
        run: python scripts/patch-office-music-queue-routing.py
      - name: Validate patch
        run: |
          set -euo pipefail
          grep -q 'office-music-queue-control' control-center/office-music.js
          grep -q 'office-music-queue-control' docs/control-center/office-music.js
          grep -q 'office-music.js?v=20260929-6' control-center/office-music.html
          grep -q 'office-music.js?v=20260929-6' docs/control-center/office-music.html
      - name: Commit UI update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control-center/office-music.js docs/control-center/office-music.js control-center/office-music.html docs/control-center/office-music.html
          git commit -m "office-music: route creation through resilient queue" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
