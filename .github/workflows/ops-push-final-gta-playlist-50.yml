name: MediaForge — Push Final GTA VI Playlist 50

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-push-final-gta-playlist-50.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
      OVH_AGENT_TOKEN: ${{ secrets.OVH_AGENT_TOKEN }}
    steps:
      - name: Validate final GitHub GTA catalog
        shell: bash
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/thebusinessflowtv/theofficemusic/main/control/music-library.json?ts=$(date +%s)"
          curl -fLsS --retry 8 --retry-all-errors "$RAW" -o /tmp/library.json
          COUNT="$(jq -r '.playlists[] | select(.key=="gta-vi-vice-city") | .track_count' /tmp/library.json)"
          EXTRA="$(jq -r '[.playlists[] | select(.key=="gta-vi-vice-city") | .tracks[] | select(.source=="gta-vi-extra-15")] | length' /tmp/library.json)"
          echo "github_track_count=$COUNT extra_count=$EXTRA"
          test "$COUNT" = "50"
          test "$EXTRA" = "15"

      - name: Login and capture publisher state
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          LOGIN="$(curl -kfsS -X POST "$BASE/api/auth/login" -H 'content-type: application/json'             --data "$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          TOKEN="$(printf '%s' "$LOGIN" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" >/tmp/token
          curl -kfsS "$BASE/api/ovh/status" -H "authorization: Bearer $TOKEN" >/tmp/before.json
          jq '.agent.services["youtube-gta-vi"] | {status,playlist_key,playlist_track_count,restarts,encoder_pid,audio_pid,now_playing}' /tmp/before.json

      - name: Push final music library to OVH local config
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          test -n "$OVH_AGENT_TOKEN"
          echo "::add-mask::$OVH_AGENT_TOKEN"
          BODY="$(jq -c '{path:"control/music-library.json",payload:.}' /tmp/library.json)"
          OUT="$(curl -kfsS -X POST "$BASE/api/ovh/agent/runtime-config"             -H "x-ovh-agent-token: $OVH_AGENT_TOKEN"             -H 'content-type: application/json'             --data "$BODY")"
          echo "$OUT" | jq .
          echo "$OUT" | jq -e '.ok==true' >/dev/null

          CHECK="$(curl -kfsS "$BASE/api/ovh/agent/runtime-config?path=control/music-library.json&raw=1"             -H "x-ovh-agent-token: $OVH_AGENT_TOKEN")"
          printf '%s' "$CHECK" >/tmp/local-library.json
          jq -e '.playlists[] | select(.key=="gta-vi-vice-city") | .track_count==50' /tmp/local-library.json >/dev/null
          jq -e '[.playlists[] | select(.key=="gta-vi-vice-city") | .tracks[] | select(.source=="gta-vi-extra-15")] | length==15' /tmp/local-library.json >/dev/null

      - name: Hot-set final playlist on GTA YouTube slot
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN="$(cat /tmp/token)"
          OUT="$(curl -kfsS -X POST "$BASE/api/ovh/playlist"             -H "authorization: Bearer $TOKEN"             -H 'content-type: application/json'             --data '{"runtime_slot":"youtube-gta-vi","playlist_key":"gta-vi-vice-city","shuffle":true}')"
          echo "$OUT" | jq '{ok,playlist,command}'
          jq -e '.ok==true and .playlist.track_count==50' <<<"$OUT" >/dev/null
          CMD_ID="$(jq -r '.command.id // empty' <<<"$OUT")"
          test -n "$CMD_ID"
          printf '%s' "$CMD_ID" >/tmp/cmd-id

          STATUS=""
          for I in $(seq 1 80); do
            C="$(curl -kfsS "$BASE/api/ovh/control/$CMD_ID" -H "authorization: Bearer $TOKEN")"
            STATUS="$(jq -r '.command.status // empty' <<<"$C")"
            echo "command[$I]=$STATUS"
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] && { echo "$C"; exit 4; }
            sleep 2
          done
          test "$STATUS" = "completed"

      - name: Verify 50 tracks live without RTMP restart
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://146.59.156.224:8443"
          TOKEN="$(cat /tmp/token)"
          BEFORE_ENCODER="$(jq -r '.agent.services["youtube-gta-vi"].encoder_pid' /tmp/before.json)"
          BEFORE_RESTARTS="$(jq -r '.agent.services["youtube-gta-vi"].restarts // 0' /tmp/before.json)"
          OK=0
          for I in $(seq 1 60); do
            curl -kfsS "$BASE/api/ovh/status" -H "authorization: Bearer $TOKEN" >/tmp/after.json
            COUNT="$(jq -r '.agent.services["youtube-gta-vi"].playlist_track_count // 0' /tmp/after.json)"
            STATUS="$(jq -r '.agent.services["youtube-gta-vi"].status // ""' /tmp/after.json)"
            ENC="$(jq -r '.agent.services["youtube-gta-vi"].encoder_pid // empty' /tmp/after.json)"
            RESTARTS="$(jq -r '.agent.services["youtube-gta-vi"].restarts // 0' /tmp/after.json)"
            echo "health[$I] status=$STATUS count=$COUNT encoder=$ENC restarts=$RESTARTS"
            test "$ENC" = "$BEFORE_ENCODER"
            test "$RESTARTS" = "$BEFORE_RESTARTS"
            if [ "$STATUS" = "live" ] && [ "$COUNT" = "50" ]; then OK=1; break; fi
            sleep 2
          done
          test "$OK" = "1"
          jq '.agent.services["youtube-gta-vi"] | {status,playlist_key,playlist_track_count,restarts,encoder_pid,audio_pid,now_playing}' /tmp/after.json
