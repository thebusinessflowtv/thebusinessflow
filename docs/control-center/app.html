<script>
(function(){
  const SB_URL='https://fykwalznmcrjgnyveagy.supabase.co';

  const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const app=document.getElementById('app'),toastRoot=document.getElementById('toasts');
  const terminal=['completed','uploaded_private','failed'];
  const labels={draft:'Preparando',queued:'Na fila',researching:'Pesquisando',scripting:'Criando roteiro',collecting_media:'Coletando mídias',narrating:'Gerando narração',rendering:'Renderizando',validating:'Validando',completed:'Concluído',upload_pending:'Enviando ao YouTube',uploaded_private:'No YouTube (privado)',failed:'Falhou'};
  const tones={draft:'',queued:'',researching:'p-info',scripting:'p-info',collecting_media:'p-info',narrating:'p-info',rendering:'p-violet',validating:'p-violet',completed:'p-success',upload_pending:'p-warning',uploaded_private:'p-success',failed:'p-danger'};
  const modeLabels={manual:'Tema manual',suggest:'IA sugere 5 ideias',auto:'Automático'};
  const objLabels={viral_ctr:'Viral / alto CTR',current:'Assunto atual',evergreen:'Evergreen',documentary:'História / documentário',curiosity:'Curiosidade'};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const fmt=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
  const topic=p=>p.selected_topic||p.requested_topic||(p.generation_mode==='manual'?'Tema manual':'Tema a definir pela IA');
  const statusPill=s=>'<span class="pill '+(tones[s]||'')+'">'+esc(labels[s]||s)+'</span>';

  let state={session:null,admin:false,channels:[],pollTimer:null,routeToken:0};
  function toast(title,desc,type){const el=document.createElement('div');el.className='toast '+(type||'');el.innerHTML='<b>'+esc(title)+'</b>'+(desc?'<div class="muted">'+esc(desc)+'</div>':'');toastRoot.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-4px)';el.style.transition='.2s';setTimeout(()=>el.remove(),220)},4200)}
  function errMsg(e){return(e&&e.message)||String(e||'Erro inesperado')}
  async function invoke(name,body){const r=await sb.functions.invoke(name,{body:body});if(r.error){let payload=null;try{if(r.error.context&&r.error.context.clone)payload=await r.error.context.clone().json()}catch(_){}const e=new Error((payload&&payload.message)||(payload&&payload.error)||r.error.message||'Falha no servidor');e.code=payload&&payload.error;e.setup=payload&&payload.setup_required;throw e}if(r.data&&r.data.error){const e=new Error(r.data.message||r.data.error);e.code=r.data.error;e.setup=r.data.setup_required;throw e}return r.data}
  function clearPoll(){if(state.pollTimer){clearInterval(state.pollTimer);clearTimeout(state.pollTimer);state.pollTimer=null}}
  function hashInfo(){let h=location.hash.slice(1)||'/';let q='';const qi=h.indexOf('?');if(qi>=0){q=h.slice(qi+1);h=h.slice(0,qi)}return{path:h||'/',params:new URLSearchParams(q)}}
  function go(path){location.hash=path}
  function titleFor(path){if(path==='/')return'Dashboard';if(path==='/create')return'Criar vídeo';if(path==='/productions')return'Produções';if(path.startsWith('/production/'))return'Detalhe da produção';if(path==='/channels')return'Canais';if(path==='/settings')return'Configurações';return'MediaForge'}
  function shell(content,path){const email=state.session&&state.session.user&&state.session.user.email||'';const nav=[['/','◫','Dashboard'],['/create','＋','Criar vídeo'],['/productions','▤','Produções'],['/channels','◉','Canais'],['/settings','⚙','Configurações']];return'<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">M</div><div><strong>MediaForge</strong><small>Control Center</small></div></div><nav class="nav">'+nav.map(n=>'<a href="#'+n[0]+'" class="'+((path===n[0]||(n[0]==='/productions'&&path.startsWith('/production/')))?'active':'')+'"><span class="ico">'+n[1]+'</span>'+n[2]+'</a>').join('')+'</nav><div class="side-bottom"><div class="userbox"><div class="avatar">'+esc(email.slice(0,1))+'</div><div class="usertext"><b>'+esc(email)+'</b><small>Administrador</small></div><button class="btn" id="logout" style="padding:6px 9px;min-height:30px" title="Sair">↪</button></div></div></aside><main class="main"><header class="topbar"><button class="btn mobile-top" id="mobileMenu" style="padding:5px 9px;min-height:30px">☰</button><span class="crumb">MediaForge / <b>'+esc(titleFor(path))+'</b></span><span class="spacer"></span>'+(path!=='/create'?'<a class="btn primary" href="#/create">＋ Criar vídeo</a>':'')+'</header><div class="page">'+content+'</div></main></div>'}
  function pageHead(t,s,action){return'<div class="pagehead"><div><h1>'+esc(t)+'</h1>'+(s?'<p>'+esc(s)+'</p>':'')+'</div>'+(action||'')+'</div>'}
  function empty(title,text,action){return'<div class="card empty"><div class="bigico">◇</div><h3>'+esc(title)+'</h3>'+(text?'<p>'+esc(text)+'</p>':'')+(action||'')+'</div>'}
  function progress(v){v=Math.max(0,Math.min(100,Number(v)||0));return'<div class="statusbar"><span style="width:'+v+'%"></span></div>'}
  function modal(title,desc,confirmLabel,onConfirm){const back=document.createElement('div');back.className='modalback';back.innerHTML='<div class="card modal"><h3>'+esc(title)+'</h3><p>'+desc+'</p><div class="modalfoot"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>'+esc(confirmLabel||'Confirmar')+'</button></div></div>';document.body.appendChild(back);back.querySelector('[data-x]').onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};back.querySelector('[data-ok]').onclick=async()=>{const b=back.querySelector('[data-ok]');b.disabled=true;b.textContent='Processando…';try{await onConfirm();back.remove()}catch(e){toast('Erro',errMsg(e),'error');b.disabled=false;b.textContent=confirmLabel||'Confirmar'}}}
  async function authInit(){const g=await sb.auth.getSession();state.session=g.data.session;sb.auth.onAuthStateChange((_e,s)=>{state.session=s;if(!s){state.admin=false;renderLogin()}});if(!state.session){renderLogin();return}await checkAdmin();route()}
  async function checkAdmin(){const uid=state.session.user.id;const q=await sb.from('user_roles').select('role').eq('user_id',uid).eq('role','admin').maybeSingle();if(!q.error&&q.data){state.admin=true;return}const f=await sb.from('mfcc_channels').select('id').limit(1);state.admin=!f.error&&f.data&&f.data.length>=0;if(!state.admin)renderDenied()}
  function renderLogin(){clearPoll();app.innerHTML='<div class="loginwrap"><div class="card login"><div class="brand"><div class="brandmark">M</div><div><strong>MediaForge</strong><small>Control Center</small></div></div><h1>Entrar</h1><p>Acesso restrito a administradores.</p><form id="loginForm"><div class="field"><label>E-mail</label><input class="input" id="lemail" type="email" required autocomplete="email"></div><div class="field" id="pwField"><label>Senha</label><input class="input" id="lpass" type="password" required autocomplete="current-password"></div><button class="btn primary block" id="loginBtn">Entrar</button></form><div class="divider"></div><button class="linkbtn" id="magic">Entrar com link mágico</button></div></div>';let magic=false;const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn');document.getElementById('magic').onclick=()=>{magic=!magic;document.getElementById('pwField').classList.toggle('hidden',magic);document.getElementById('lpass').required=!magic;btn.textContent=magic?'Enviar link mágico':'Entrar';document.getElementById('magic').textContent=magic?'Entrar com senha':'Entrar com link mágico'};form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Aguarde…';const email=document.getElementById('lemail').value.trim();try{if(magic){const r=await sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href.split('#')[0],shouldCreateUser:false}});if(r.error)throw r.error;toast('Link enviado','Verifique seu e-mail.','success');btn.textContent='Link enviado'}else{const r=await sb.auth.signInWithPassword({email:email,password:document.getElementById('lpass').value});if(r.error)throw r.error;state.session=r.data.session;await checkAdmin();if(state.admin)route()}}catch(err){toast('Não foi possível entrar',errMsg(err),'error');btn.disabled=false;btn.textContent=magic?'Enviar link mágico':'Entrar'}}}
  function renderDenied(){app.innerHTML='<div class="loginwrap"><div class="card login" style="text-align:center"><div style="font-size:34px;margin-bottom:12px">⚠</div><h1>Acesso administrativo necessário</h1><p>Esta conta não possui permissão para o MediaForge Control Center.</p><button class="btn" id="denyLogout">Sair</button></div></div>';document.getElementById('denyLogout').onclick=async()=>{await sb.auth.signOut();state.session=null;renderLogin()}}

  async function dashboard(path){const[channels,prods]=await Promise.all([loadChannels(),loadProductions(500)]);const active=prods.filter(p=>!terminal.includes(p.status)).length,completed=prods.filter(p=>p.status==='completed').length,failed=prods.filter(p=>p.status==='failed').length,uploaded=prods.filter(p=>p.status==='uploaded_private').length;let html=pageHead('Dashboard','Status em tempo real das suas fábricas de vídeo.')+'<div class="grid grid4" style="margin-bottom:24px">'+[['Em produção',active,'p-info'],['Concluídos',completed,'p-success'],['Falharam',failed,'p-danger'],['No YouTube (privado)',uploaded,'p-violet']].map(k=>'<div class="card kpi"><div class="label">'+k[0]+'</div><div class="num '+k[2]+'">'+k[1]+'</div></div>').join('')+'</div><div class="small muted" style="margin:0 0 10px">CANAIS</div><div class="grid grid2">';channels.forEach(c=>{const cp=prods.filter(p=>p.channel_id===c.id),act=cp.filter(p=>!terminal.includes(p.status)).length,latest=cp[0];html+='<div class="card channel-card"><div class="row between" style="align-items:flex-start"><div><h3>'+esc(c.name)+'</h3><div class="niche">'+esc(c.niche)+'</div></div><span class="pill '+(ytConnected(c)?'p-success':'')+'">'+(ytConnected(c)?'YouTube conectado':'YouTube não conectado')+'</span></div><div class="grid grid2" style="margin-top:14px"><div class="metricbox"><small>Em produção</small><b>'+act+'</b></div><div class="metricbox"><small>Modo</small><b class="small">'+(canUpload(c)?'Criar + envio privado':'Somente criar')+'</b></div></div><div class="tiny mono muted" style="margin-top:11px">⌘ '+esc(c.repo_full_name)+'</div><div class="latest"><small>ÚLTIMA PRODUÇÃO</small>'+(latest?'<a href="#/production/'+latest.id+'" class="row between"><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(topic(latest))+'</span>'+statusPill(latest.status)+'</a><div class="tiny muted" style="margin-top:4px">'+fmt(latest.created_at)+'</div>':'<span class="small muted">Nenhuma ainda</span>')+'</div><div class="channel-actions"><a class="btn primary" style="flex:1" href="#/create?channel='+c.id+'">＋ Criar vídeo</a><a class="btn" href="#/productions?channel='+c.id+'">Ver produções</a></div></div>'});html+='</div>';if(!prods.length)html+='<div style="margin-top:20px">'+empty('Nenhuma produção ainda','Inicie a primeira produção para acompanhar o progresso aqui.','<a class="btn primary" href="#/create">Criar primeiro vídeo</a>')+'</div>';app.innerHTML=shell(html,path);wireShell()}
  async function createPage(path,params){const channels=await loadChannels();let selected=params.get('channel')||channels[0]?.id||'';let mode='manual',objective='viral_ctr',upload=false,formDraft={topic:'',notes:''};function render(){const c=channels.find(x=>x.id===selected),up=canUpload(c);let html=pageHead('Criar vídeo','Configure e envie uma nova produção para a fábrica.')+'<div class="create-layout"><div class="grid"><div class="card step"><div class="steptitle"><span class="stepnum">1</span>Canal</div><div class="grid grid2" id="channelChoices">'+channels.map(x=>'<button class="choice '+(x.id===selected?'on':'')+'" data-channel="'+x.id+'"><strong>'+esc(x.name)+'</strong><small>'+esc(x.niche)+'</small></button>').join('')+'</div></div><div class="card step"><div class="steptitle"><span class="stepnum">2</span>Modo de geração</div><div class="grid" style="grid-template-columns:repeat(3,1fr)" id="modeChoices">'+[['manual','✎','Tema manual','Você define o tema.'],['suggest','✦','IA sugere 5 ideias','Escolha entre 5 ideias.'],['auto','◇','Automático','IA escolhe e produz.']].map(m=>'<button class="choice '+(mode===m[0]?'on':'')+'" data-mode="'+m[0]+'"><span style="color:#b7a6ff">'+m[1]+'</span><strong>'+m[2]+'</strong><small>'+m[3]+'</small></button>').join('')+'</div><div class="field '+(mode==='manual'?'':'hidden')+'" id="topicWrap" style="margin-top:14px"><label>Tema *</label><input class="input" id="topicInput" value="'+esc(formDraft.topic)+'" placeholder="Ex.: What Really Happened to Derrick Rose?"></div></div><div class="card step"><div class="steptitle"><span class="stepnum">3</span>Objetivo</div><div class="objectives" id="objectives">'+Object.entries(objLabels).map(o=>'<button class="objective '+(objective===o[0]?'on':'')+'" data-objective="'+o[0]+'">'+o[1]+'</button>').join('')+'</div></div><div class="card step"><div class="steptitle"><span class="stepnum">4</span>Observações (opcional)</div><textarea class="textarea" id="notes" placeholder="Tom, recorte, referências ou observações adicionais…">'+esc(formDraft.notes)+'</textarea></div><div class="card step"><div class="steptitle"><span class="stepnum">5</span>YouTube</div><div class="row between '+(!up?'muted':'')+'"><div><b class="small">Enviar ao YouTube quando terminar</b><div class="tiny muted">'+(up?'Sempre como PRIVADO':'YouTube ainda não conectado')+'</div></div><button class="toggle '+(upload&&up?'on':'')+'" id="uploadToggle" '+(!up?'disabled':'')+'></button></div></div></div><div class="card pad summary sticky"><h3 class="small">Resumo</h3><dl style="margin-top:12px"><div class="sum"><dt>Canal</dt><dd>'+esc(c?.name||'—')+'</dd></div><div class="sum"><dt>Modo</dt><dd>'+esc(modeLabels[mode])+'</dd></div><div class="sum"><dt>Objetivo</dt><dd>'+esc(objLabels[objective])+'</dd></div><div class="sum"><dt>YouTube</dt><dd>'+(upload&&up?'Enviar (privado)':'Não enviar')+'</dd></div></dl><button class="btn primary block" id="launch" style="margin-top:16px">▶ Iniciar produção</button></div></div>';app.innerHTML=shell(html,path);wireShell();const saveDraft=()=>{formDraft.topic=document.getElementById('topicInput')?.value||formDraft.topic;formDraft.notes=document.getElementById('notes')?.value||formDraft.notes};document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{saveDraft();selected=b.dataset.channel;upload=false;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{saveDraft();mode=b.dataset.mode;render()});document.querySelectorAll('[data-objective]').forEach(b=>b.onclick=()=>{saveDraft();objective=b.dataset.objective;render()});const ut=document.getElementById('uploadToggle');if(ut&&!ut.disabled)ut.onclick=()=>{saveDraft();upload=!upload;render()};document.getElementById('launch').onclick=()=>{const topicVal=(document.getElementById('topicInput')?.value||'').trim(),notesVal=(document.getElementById('notes')?.value||'').trim();if(mode==='manual'&&topicVal.length<3){toast('Informe um tema','O modo manual precisa de um tema.','error');return}const desc='<b>'+esc(c.name)+'</b><br>'+esc(modeLabels[mode])+' · '+esc(objLabels[objective])+(topicVal?'<br><br>Tema: '+esc(topicVal):'')+(upload&&up?'<br><br>O vídeo será enviado ao YouTube como <b>PRIVADO</b>.':'');modal('Iniciar produção?',desc,'Confirmar',async()=>launchProduction(c,mode,objective,topicVal,notesVal,upload&&up))}}render()}
  async function launchProduction(c,mode,objective,topicVal,notesVal,upload){const ins=await sb.from('mfcc_productions').insert({channel_id:c.id,requested_topic:mode==='manual'?topicVal:null,generation_mode:mode,objective:objective,notes:notesVal||null,upload_requested:!!upload,status:'draft',progress:0}).select('id').single();if(ins.error)throw ins.error;const id=ins.data.id;try{await invoke('mfcc-dispatch',{production_id:id})}catch(e){toast('Produção criada, mas a fábrica precisa de configuração',e.setup?('Configuração necessária: '+e.setup):errMsg(e),'error');go('/production/'+id);return}toast('Produção iniciada',c.name,'success');if(mode==='suggest'){await suggestionsView(id)}else go('/production/'+id)}
  async function suggestionsView(id){clearPoll();app.innerHTML=shell(pageHead('IA buscando ideias…','A Anthropic está preparando 5 temas para você escolher.')+'<div class="card empty"><div class="loader" style="margin:0 auto 14px"></div><h3>Buscando oportunidades</h3><p>Isso pode levar alguns minutos. A página atualiza automaticamente.</p></div>','/create');wireShell();let stopped=false;const attempt=async()=>{if(stopped)return;try{const r=await invoke('mfcc-suggestions',{production_id:id});if(r&&r.ready){const q=await sb.from('mfcc_topic_suggestions').select('*').eq('production_id',id).order('score',{ascending:false});if(q.error)throw q.error;renderSuggestions(id,(q.data||[]).slice(0,5));stopped=true;return}}catch(e){toast('Não foi possível buscar as sugestões',e.setup?('Configuração necessária: '+e.setup):errMsg(e),'error');stopped=true;return}if(!stopped)state.pollTimer=setTimeout(attempt,10000)};attempt()}
  function renderSuggestions(id,items){const cards=items.map((s,i)=>'<div class="card suggestion"><div class="row between" style="align-items:flex-start"><h3>'+esc(s.title_idea||s.topic)+'</h3>'+(s.score!=null?'<span class="pill p-violet">'+esc(s.score)+'</span>':'')+'</div><p><b style="color:#d5d8e0">Tema:</b> '+esc(s.topic)+'</p>'+(s.hook?'<p><b style="color:#d5d8e0">Gancho:</b> '+esc(s.hook)+'</p>':'')+(s.reason?'<p>'+esc(s.reason)+'</p>':'')+'<button class="btn primary chooseIdea" data-id="'+esc(s.id)+'" data-topic="'+esc(s.topic)+'">Escolher esta ideia</button></div>').join('');app.innerHTML=shell(pageHead('Escolha uma ideia','A IA trouxe 5 opções. Selecione uma para começar a produção.')+'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+cards+'</div>','/create');wireShell();document.querySelectorAll('.chooseIdea').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.chooseIdea').forEach(x=>x.disabled=true);b.textContent='Iniciando…';try{await sb.from('mfcc_topic_suggestions').update({selected:false}).eq('production_id',id);const s1=await sb.from('mfcc_topic_suggestions').update({selected:true}).eq('id',b.dataset.id);if(s1.error)throw s1.error;const p1=await sb.from('mfcc_productions').update({selected_topic:b.dataset.topic,generation_mode:'manual',status:'draft',progress:0}).eq('id',id);if(p1.error)throw p1.error;await invoke('mfcc-dispatch',{production_id:id});toast('Ideia escolhida','A produção foi iniciada.','success');go('/production/'+id)}catch(e){toast('Não foi possível iniciar',e.setup?('Configuração necessária: '+e.setup):errMsg(e),'error');document.querySelectorAll('.chooseIdea').forEach(x=>x.disabled=false);b.textContent='Escolher esta ideia'}})}
  async function productions(path,params){await loadChannels();let q=sb.from('mfcc_productions').select('*, mfcc_channels(*)').order('created_at',{ascending:false}).limit(300);if(params.get('channel'))q=q.eq('channel_id',params.get('channel'));if(params.get('status'))q=q.eq('status',params.get('status'));const r=await q;if(r.error)throw r.error;const rows=r.data||[];let html=pageHead('Produções','Acompanhe cada vídeo do pedido ao upload.')+'<div class="filters"><input class="input" id="searchProd" placeholder="Buscar por tema…"><select class="select" id="channelFilter"><option value="">Todos os canais</option>'+state.channels.map(c=>'<option value="'+c.id+'" '+(params.get('channel')===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><select class="select" id="statusFilter"><option value="">Todos os status</option>'+Object.keys(labels).map(s=>'<option value="'+s+'" '+(params.get('status')===s?'selected':'')+'>'+labels[s]+'</option>').join('')+'</select></div>';html+=rows.length?'<div class="card tablewrap"><table class="table"><thead><tr><th>Canal</th><th>Tema</th><th>Modo</th><th>Objetivo</th><th>Status</th><th>Progresso</th><th>Criado</th></tr></thead><tbody id="prodBody">'+rows.map(p=>prodRow(p)).join('')+'</tbody></table></div>':empty('Nenhuma produção ainda','Comece criando seu primeiro vídeo.','<a class="btn primary" href="#/create">Criar primeiro vídeo</a>');app.innerHTML=shell(html,path);wireShell();const apply=()=>{let h='/productions',qs=[];const c=document.getElementById('channelFilter').value,s=document.getElementById('statusFilter').value;if(c)qs.push('channel='+encodeURIComponent(c));if(s)qs.push('status='+encodeURIComponent(s));go(h+(qs.length?'?'+qs.join('&'):''))};document.getElementById('channelFilter').onchange=apply;document.getElementById('statusFilter').onchange=apply;document.getElementById('searchProd').oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('#prodBody tr').forEach(tr=>tr.classList.toggle(   function prodRow(p){return'<tr data-topic="'+esc(topic(p).toLowerCase())+'" onclick="location.hash=\'/production/'+p.id+'\'" style="cursor:pointer"><td class="muted">'+esc(p.mfcc_channels?.name||'—')+'</td><td><b>'+esc(topic(p))+'</b></td><td class="muted">'+esc(modeLabels[p.generation_mode]||p.generation_mode)+'</td><td class="muted">'+esc(objLabels[p.objective]||p.objective)+'</td><td>'+statusPill(p.status)+'</td><td><div class="row">'+progress(p.progress)+'<span class="tiny muted" style="width:35px;text-align:right">'+(p.progress||0)+'%</span></div></td><td class="tiny muted">'+fmt(p.created_at)+'</td></tr>'}
  async function productionDetail(path,id){const[pR,eR]=await Promise.all([sb.from('mfcc_productions').select('*, mfcc_channels(*)').eq('id',id).single(),sb.from('mfcc_production_events').select('*').eq('production_id',id).order('created_at',{ascending:true})]);if(pR.error)throw pR.error;if(eR.error)throw eR.error;const p=pR.data,events=eR.data||[];const allPhases=[['Pedido',['draft','queued']],['Pesquisa',['researching']],['Roteiro',['scripting']],['Mídias',['collecting_media']],['Narração',['narrating']],['Render',['rendering']],['Validação',['validating']]];if(p.upload_requested||['upload_pending','uploaded_private'].includes(p.status))allPhases.push(['YouTube',['upload_pending','uploaded_private']]);let idx=allPhases.findIndex(x=>x[1].includes(p.status));if(['completed','uploaded_private'].includes(p.status))idx=allPhases.length;const stepper=allPhases.map((ph,i)=>'<div class="phase '+(i<idx?'done':i===idx?(p.status==='failed'?'fail':'cur'):'')+'"><div class="dot">'+(i<idx?'✓':i+1)+'</div>'+ph[0]+'</div>').join('');const done=['completed','uploaded_private'].includes(p.status);let right='';if(done)right='<div class="card pad"><h3 class="small">Arquivos gerados</h3><div class="tiny muted" style="margin:5px 0 12px">Downloads entregues em .zip</div><div class="grid">'+[['video','Baixar vídeo'],['thumbnail','Baixar thumbnail'],['script','Baixar roteiro'],['package','Baixar pacote completo']].map(k=>'<button class="btn '+(k[0]==='package'?'primary':'')+' downloadBtn" data-kind="'+k[0]+'">↓ '+k[1]+'</button>').join('')+'</div></div>';if(p.youtube_url)right+='<div class="card pad"><div class="row between"><h3 class="small">YouTube</h3><span class="pill p-warning">PRIVADO</span></div><a class="btn block" style="margin-top:12px" target="_blank" rel="noopener" href="'+esc(p.youtube_url)+'">▶ Abrir no YouTube</a></div>';if(p.notes)right+='<div class="card pad"><h3 class="small">Observações</h3><p class="small muted">'+esc(p.notes)+'</p></div>';let html='<a class="small muted" href="#/productions">← Produções</a><div class="card detail-head" style="margin-top:12px"><div class="row between wrap"><div><div class="tiny muted">'+esc(p.mfcc_channels?.name||'')+' · '+esc(modeLabels[p.generation_mode]||p.generation_mode)+' · '+esc(objLabels[p.objective]||p.objective)+'</div><h1>'+esc(topic(p))+'</h1><div class="tiny muted">'+fmt(p.created_at)+'</div></div><div class="row">'+statusPill(p.status)+(!terminal.includes(p.status)?'<span class="pill p-success" id="autoRefreshIndicator">● Auto · 5s</span>':'')+'<button class="btn" id="refreshStatus">↻ Atualizar agora</button>'+(!terminal.includes(p.status)?'<button class="btn danger" id="deleteProduction">✕ Excluir execução</button>':'')+'</div></div><div class="bigprogress">'+progress(p.progress)+'<div class="percent">'+(p.progress||0)+'%</div></div><div class="stepper">'+stepper+'</div>'+(p.status==='failed'?'<div class="alert danger" style="margin-top:16px"><b>A produção falhou</b><div style="margin-top:4px">'+esc(p.error_message||'Sem detalhes do erro.')+'</div></div>':'')+(p.github_run_url?'<a class="tiny muted" target="_blank" rel="noopener" style="display:inline-block;margin-top:12px" href="'+esc(p.github_run_url)+'">⌘ Abrir execução no GitHub ↗</a>':'')+'</div><div class="detailgrid"><div class="card pad"><h3 class="small" style="margin-bottom:16px">Linha do tempo</h3>'+(events.length?'<div class="timeline">'+events.map(e=>'<div class="event"><p>'+esc(e.message||e.stage||'Evento')+'</p><small>'+esc(e.stage)+' · '+fmt(e.created_at)+'</small></div>').join('')+'</div>':'<div class="small muted">Nenhum evento registrado ainda.</div>')+'</div><div class="grid">'+right+'</div></div>';app.innerHTML=shell(html,path);wireShell();document.getElementById('refreshStatus').onclick=async()=>{const b=document.getElementById('refreshStatus');b.disabled=true;b.textContent='Atualizando…';try{await invoke('mfcc-status',{production_id:id});toast('Status atualizado','','success')}catch(e){toast('Falha ao atualizar',e.setup?('Configuração necessária: '+e.setup):errMsg(e),'error')}route()};const deleteBtn=document.getElementById('deleteProduction');if(deleteBtn)deleteBtn.onclick=()=>modal('Excluir execução?','A produção <b>'+esc(topic(p))+'</b> será removida do painel. Se houver uma execução ativa no GitHub, o sistema tentará cancelá-la antes.<br><br><b>Esta ação não pode ser desfeita.</b>','Excluir execução',async()=>{clearPoll();const r=await invoke('mfcc-delete-production',{production_id:id});toast('Execução excluída',r&&r.cancelled?'A execução do GitHub também foi cancelada.':'A produção foi removida do painel.','success');go('/productions')});document.querySelectorAll('.downloadBtn').forEach(b=>b.onclick=async()=>{b.disabled=true;const old=b.textContent;b.textContent='Preparando…';try{const r=await invoke('mfcc-artifact-link',{production_id:id,kind:b.dataset.kind});if(r.fallback_package)toast('Arquivo individual ainda sendo preparado','Baixando o pacote completo.');window.open(r.download_url,'_blank','noopener')}catch(e){toast('Download indisponível',errMsg(e),'error')}finally{b.disabled=false;b.textContent=old}});clearPoll();if(!terminal.includes(p.status))state.pollTimer=setInterval(async()=>{try{await invoke('mfcc-status',{production_id:id});if(location.hash.startsWith('#/production/'+id))await productionDetail(path,id)}catch(e){console.warn(e)}},5000)}
  async function channelsPage(path){const channels=await loadChannels();let html=pageHead('Canais','Configuração dos canais lida diretamente do banco.')+'<div class="grid grid2">'+channels.map(c=>'<div class="card pad"><div class="row between"><div><h3>'+esc(c.name)+'</h3><div class="small muted" style="margin-top:4px">'+esc(c.niche)+'</div></div><span class="pill '+(c.active?'p-success':'')+'">'+(c.active?'Ativo':'Inativo')+'</span></div><div class="grid" style="margin-top:18px;gap:10px"><div class="row between small"><span class="muted">Repositório</span><code class="tiny">'+esc(c.repo_full_name)+'</code></div><div class="row between small"><span class="muted">Idioma / locale</span><span>'+esc(c.locale)+'</span></div><div class="row between small"><span class="muted">YouTube</span><span class="pill '+(ytConnected(c)?'p-success':'')+'">'+(ytConnected(c)?'Conectado':'Não conectado')+'</span></div></div><div style="margin-top:16px"><div class="tiny muted" style="margin-bottom:7px">CAPACIDADES</div><div class="row wrap"><span class="pill p-violet">Criar vídeo</span><span class="pill">Downloads</span>'+(canUpload(c)?'<span class="pill p-success">Upload privado</span>':'<span class="pill">Upload desativado</span>')+'</div></div></div>').join('')+'</div>';app.innerHTML=shell(html,path);wireShell()}
  async function settingsPage(path){const[channels,iR]=await Promise.all([loadChannels(),sb.from('mfcc_channel_integrations').select('*').order('integration_type')]);if(iR.error)throw iR.error;const ints=iR.data||[];const providers=[['github','GitHub'],['anthropic','Anthropic'],['mediaforge','MediaForge'],['youtube','YouTube']];let html=pageHead('Configurações','Saúde das integrações por canal. Nenhum segredo é exibido no navegador.')+'<div class="grid">';channels.forEach(c=>{html+='<div><div class="small muted" style="margin:0 0 8px">'+esc(c.name)+'</div><div class="grid grid4">'+providers.map(pr=>{const r=ints.find(x=>x.channel_id===c.id&&x.integration_type===pr[0])||{status:'unknown'},st=r.status||'unknown',tone=st==='connected'?'p-success':st==='not_configured'?'p-warning':st==='degraded'?'p-danger':'';let extra='';if(pr[0]==='github'&&st!=='connected')extra='<div class="alert" style="margin-top:11px"><b>GITHUB_FACTORY_TOKEN</b> precisa ser configurado nos Secrets das Edge Functions do Supabase. Nunca coloque esse token no navegador.</div>';if(pr[0]==='youtube'&&!c.youtube_connected)extra='<div class="tiny muted" style="margin-top:11px;line-height:1.55">Configuração pendente:<br><code>YOUTUBE_CLIENT_ID</code><br><code>YOUTUBE_CLIENT_SECRET</code><br><code>YOUTUBE_REFRESH_TOKEN</code><br><code>YOUTUBE_CHANNEL_ID</code></div>';return'<div class="card pad"><div class="row between"><b class="small">'+pr[1]+'</b><span class="pill '+tone+'">'+(st==='connected'?'Conectado':st==='not_configured'?'Não configurado':st==='degraded'?'Degradado':'Desconhecido')+'</span></div>'+(r.last_checked_at?'<div class="tiny muted" style="margin-top:8px">Verificado em '+fmt(r.last_checked_at)+'</div>':'')+extra+'</div>'}).join('')+'</div></div>'});html+='</div>';app.innerHTML=shell(html,path);wireShell()}
  async function route(){clearPoll();if(!state.session){renderLogin();return}if(!state.admin){await checkAdmin();if(!state.admin)return}const token=++state.routeToken,{path,params}=hashInfo();app.innerHTML='<div class="loginwrap"><div class="loader"></div></div>';try{if(path==='/')await dashboard(path);else if(path==='/create')await createPage(path,params);else if(path==='/productions')await productions(path,params);else if(path.startsWith('/production/'))await productionDetail(path,path.split('/')[2]);else if(path==='/channels')await channelsPage(path);else if(path==='/settings')await settingsPage(path);else go('/')}catch(e){if(token!==state.routeToken)return;app.innerHTML=shell(pageHead('Erro','Não foi possível carregar esta tela.')+'<div class="card pad"><div class="alert danger"><b>Falha ao carregar</b><div style="margin-top:5px">'+esc(errMsg(e))+'</div></div><button class="btn" style="margin-top:12px" onclick="location.reload()">Tentar novamente</button></div>',path);wireShell();console.error(e)}}
  window.addEventListener('hashchange',route);authInit();
})();
</script>
