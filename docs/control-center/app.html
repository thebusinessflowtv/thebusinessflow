  }

  async function responseBlobWithProgress(res,onProgress){
    const total=Number(res.headers.get('content-length')||0);
    if(!res.body||!res.body.getReader){const b=await res.blob();onProgress&&onProgress(100);return b}
    const reader=res.body.getReader(),chunks=[];let received=0;
    while(true){const x=await reader.read();if(x.done)break;chunks.push(x.value);received+=x.value.length;if(total&&onProgress)onProgress(Math.min(99,Math.round(received/total*100)))}
    onProgress&&onProgress(100);return new Blob(chunks,{type:'application/zip'})
  }

  async function productionDetail(path,id){const[pR,eR]=await Promise.all([sb.from('mfcc_productions').select('*, mfcc_channels(*)').eq('id',id).single(),sb.from('mfcc_production_events').select('*').eq('production_id',id).order('created_at',{ascending:true})]);if(pR.error)throw pR.error;if(eR.error)throw eR.error;const p=pR.data,events=eR.data||[];const ideaSourceId=p.metadata&&p.metadata.idea_source_production_id||null;const allPhases=[['Pedido',['draft','queued']],['Pesquisa',['researching']],['Roteiro',['scripting']],['Mídias',['collecting_media']],['Narração',['narrating']],['Render',['rendering']],['Validação',['validating']]];if(p.upload_requested||['upload_pending','uploaded_private'].includes(p.status))allPhases.push(['YouTube',['upload_pending','uploaded_private']]);let idx=allPhases.findIndex(x=>x[1].includes(p.status));if(['completed','uploaded_private'].includes(p.status))idx=allPhases.length;const stepper=allPhases.map((ph,i)=>'<div class="phase '+(i<idx?'done':i===idx?(p.status==='failed'?'fail':'cur'):'')+'"><div class="dot">'+(i<idx?'✓':i+1)+'</div>'+ph[0]+'</div>').join('');const done=['completed','uploaded_private'].includes(p.status);let right='';if(done)right='<div class="card pad watch-card"><div class="row between"><div><div class="eyebrow">PREVIEW</div><h3 class="small">Assistir vídeo</h3></div><span class="glass-icon"><i data-lucide="play"></i></span></div><p class="small muted">Reproduza o vídeo final diretamente no Control Center antes de baixar ou publicar.</p><button class="btn primary block" id="watchVideo"><i data-lucide="play"></i> Reproduzir vídeo</button></div><div class="card pad"><h3 class="small">Arquivos gerados</h3><div class="tiny muted" style="margin:5px 0 12px">Downloads entregues em .zip</div><div class="grid">'+[['video','Baixar vídeo'],['thumbnail','Baixar thumbnail'],['script','Baixar roteiro'],['package','Baixar pacote completo']].map(k=>'<button class="btn '+(k[0]==='package'?'primary':'')+' downloadBtn" data-kind="'+k[0]+'">↓ '+k[1]+'</button>').join('')+'</div></div>';if(p.youtube_url)right+='<div class="card pad"><div class="row between"><h3 class="small">YouTube</h3><span class="pill p-warning">PRIVADO</span></div><a class="btn block" style="margin-top:12px" target="_blank" rel="noopener" href="'+esc(p.youtube_url)+'">▶ Abrir no YouTube</a></div>';if(p.notes)right+='<div class="card pad"><h3 class="small">Observações</h3><p class="small muted">'+esc(p.notes)+'</p></div>';let html='<a class="small muted" href="#/productions">← Produções</a><div class="card detail-head" style="margin-top:12px"><div class="row between wrap"><div><div class="tiny muted">'+esc(p.mfcc_channels?.name||'')+' · '+esc(modeLabels[p.generation_mode]||p.generation_mode)+' · '+esc(objLabels[p.objective]||p.objective)+'</div><h1>'+esc(topic(p))+'</h1><div class="tiny muted">'+fmt(p.created_at)+'</div></div><div class="row">'+(ideaSourceId?'<a class="btn" href="#/ideas/'+esc(ideaSourceId)+'">✦ Ideias</a>':'')+statusPill(p.status)+(!terminal.includes(p.status)?'<span class="pill p-success" id="autoRefreshIndicator">● Auto · 5s</span>':'')+'<button class="btn" id="refreshStatus">↻ Atualizar agora</button>'+(!terminal.includes(p.status)?'<button class="btn danger" id="deleteProduction">✕ Excluir execução</button>':'')+'</div></div><div class="bigprogress '+(!terminal.includes(p.status)?'live':'')+'">'+progress(p.progress)+'<div class="percent">'+(p.progress||0)+'%</div></div><div class="stepper">'+stepper+'</div>'+(p.status==='failed'?'<div class="alert danger" style="margin-top:16px"><b>A produção falhou</b><div style="margin-top:4px">'+esc(p.error_message||'Sem detalhes do erro.')+'</div></div>':'')+(p.github_run_url?'<a class="tiny muted" target="_blank" rel="noopener" style="display:inline-block;margin-top:12px" href="'+esc(p.github_run_url)+'">⌘ Abrir execução no GitHub ↗</a>':'')+'</div><div class="detailgrid"><div class="card pad"><h3 class="small" style="margin-bottom:16px">Linha do tempo</h3>'+(events.length?'<div class="timeline">'+events.map(e=>'<div class="event"><p>'+esc(e.message||e.stage||'Evento')+'</p><small>'+esc(e.stage)+' · '+fmt(e.created_at)+'</small></div>').join('')+'</div>':'<div class="small muted">Nenhum evento registrado ainda.</div>')+'</div><div class="grid">'+right+'</div></div>';app.innerHTML=shell(html,path);wireShell();const watchVideo=document.getElementById('watchVideo');if(watchVideo)watchVideo.onclick=()=>openVideoPlayer(id,topic(p));document.getElementById('refreshStatus').onclick=async()=>{const b=document.getElementById('refreshStatus');b.disabled=true;b.textContent='Atualizando…';try{if(p.generation_mode==='suggest'&&!p.selected_topic){const sr=await invoke('mfcc-suggestions',{production_id:id});if(sr&&sr.ready){clearPoll();go('/ideas/'+id);return}}else{await invoke('mfcc-status',{production_id:id})}toast('Status atualizado','','success')}catch(e){toast('Falha ao atualizar',e.setup?('Configuração necessária: '+e.setup):errMsg(e),'error')}route()};const deleteBtn=document.getElementById('deleteProduction');if(deleteBtn)deleteBtn.onclick=()=>modal('Excluir execução?','A produção <b>'+esc(topic(p))+'</b> será removida do painel. Se houver uma execução ativa no GitHub, o sistema tentará cancelá-la antes.<br><br><b>Esta ação não pode ser desfeita.</b>','Excluir execução',async()=>{clearPoll();const r=await invoke('mfcc-delete-production',{production_id:id});toast('Execução excluída',r&&r.cancelled?'A execução do GitHub também foi cancelada.':'A produção foi removida do painel.','success');go('/productions')});document.querySelectorAll('.downloadBtn').forEach(b=>b.onclick=async()=>{b.disabled=true;const old=b.textContent;b.textContent='Preparando…';try{const r=await invoke('mfcc-artifact-link',{production_id:id,kind:b.dataset.kind});if(r.fallback_package)toast('Arquivo individual ainda sendo preparado','Baixando o pacote completo.');window.open(r.download_url,'_blank','noopener')}catch(e){toast('Download indisponível',errMsg(e),'error')}finally{b.disabled=false;b.textContent=old}});clearPoll();if(!terminal.includes(p.status))state.pollTimer=setInterval(async()=>{try{if(p.generation_mode==='suggest'&&!p.selected_topic){const sr=await invoke('mfcc-suggestions',{production_id:id});if(sr&&sr.ready){clearPoll();go('/ideas/'+id);return}}else{await invoke('mfcc-status',{production_id:id})}if(location.hash.startsWith('#/production/'+id))await productionDetail(path,id)}catch(e){console.warn(e)}},5000)}
  async function channelsPage(path){const channels=await loadChannels();let html=pageHead('Canais','Configuração dos canais lida diretamente do banco.')+'<div class="grid grid2">'+channels.map(c=>'<div class="card pad"><div class="row between"><div><h3>'+esc(c.name)+'</h3><div class="small muted" style="margin-top:4px">'+esc(c.niche)+'</div></div><span class="pill '+(c.active?'p-success':'')+'">'+(c.active?'Ativo':'Inativo')+'</span></div><div class="grid" style="margin-top:18px;gap:10px"><div class="row between small"><span class="muted">Repositório</span><code class="tiny">'+esc(c.repo_full_name)+'</code></div><div class="row between small"><span class="muted">Idioma / locale</span><span>'+esc(c.locale)+'</span></div><div class="row between small"><span class="muted">YouTube</span><span class="pill '+(ytConnected(c)?'p-success':'')+'">'+(ytConnected(c)?'Conectado':'Não conectado')+'</span></div></div><div style="margin-top:16px"><div class="tiny muted" style="margin-bottom:7px">CAPACIDADES</div><div class="row wrap"><span class="pill p-violet">Criar vídeo</span><span class="pill">Downloads</span>'+(canUpload(c)?'<span class="pill p-success">Upload privado</span>':'<span class="pill">Upload desativado</span>')+'</div></div></div>').join('')+'</div>';app.innerHTML=shell(html,path);wireShell()}
  async function settingsPage(path){const[channels,iR]=await Promise.all([loadChannels(),sb.from('mfcc_channel_integrations').select('*').order('integration_type')]);if(iR.error)throw iR.error;const ints=iR.data||[];const providers=[['github','GitHub'],['anthropic','Anthropic'],['mediaforge','MediaForge'],['youtube','YouTube']];let html=pageHead('Configurações','Saúde das integrações por canal. Nenhum segredo é exibido no navegador.')+'<div class="grid">';channels.forEach(c=>{html+='<div><div class="small muted" style="margin:0 0 8px">'+esc(c.name)+'</div><div class="grid grid4">'+providers.map(pr=>{const r=ints.find(x=>x.channel_id===c.id&&x.integration_type===pr[0])||{status:'unknown'},st=r.status||'unknown',tone=st==='connected'?'p-success':st==='not_configured'?'p-warning':st==='degraded'?'p-danger':'';let extra='';if(pr[0]==='github'&&st!=='connected')extra='<div class="alert" style="margin-top:11px"><b>GITHUB_FACTORY_TOKEN</b> precisa ser configurado nos Secrets das Edge Functions do Supabase. Nunca coloque esse token no navegador.</div>';if(pr[0]==='youtube'&&!c.youtube_connected)extra='<div class="tiny muted" style="margin-top:11px;line-height:1.55">Configuração pendente:<br><code>YOUTUBE_CLIENT_ID</code><br><code>YOUTUBE_CLIENT_SECRET</code><br><code>YOUTUBE_REFRESH_TOKEN</code><br><code>YOUTUBE_CHANNEL_ID</code></div>';return'<div class="card pad"><div class="row between"><b class="small">'+pr[1]+'</b><span class="pill '+tone+'">'+(st==='connected'?'Conectado':st==='not_configured'?'Não configurado':st==='degraded'?'Degradado':'Desconhecido')+'</span></div>'+(r.last_checked_at?'<div class="tiny muted" style="margin-top:8px">Verificado em '+fmt(r.last_checked_at)+'</div>':'')+extra+'</div>'}).join('')+'</div></div>'});html+='</div>';app.innerHTML=shell(html,path);wireShell()}
  async function route(){clearPoll();if(!state.session){renderLogin();return}if(!state.admin){await checkAdmin();if(!state.admin)return}const token=++state.routeToken,{path,params}=hashInfo();app.innerHTML='<div class="loginwrap"><div class="loader"></div></div>';try{if(path==='/')await dashboard(path);else if(path==='/create')await createPage(path,params);else if(path==='/ideas')await ideasPage(path,null);else if(path.startsWith('/ideas/'))await ideasPage(path,path.split('/')[2]);else if(path==='/productions')await productions(path,params);else if(path.startsWith('/production/'))await productionDetail(path,path.split('/')[2]);else if(path==='/channels')await channelsPage(path);else if(path==='/settings')await settingsPage(path);else go('/')}catch(e){if(token!==state.routeToken)return;app.innerHTML=shell(pageHead('Erro','Não foi possível carregar esta tela.')+'<div class="card pad"><div class="alert danger"><b>Falha ao carregar</b><div style="margin-top:5px">'+esc(errMsg(e))+'</div></div><button class="btn" style="margin-top:12px" onclick="location.reload()">Tentar novamente</button></div>',path);wireShell();console.error(e)}}
  window.addEventListener('hashchange',route);authInit();
})();
</script>
