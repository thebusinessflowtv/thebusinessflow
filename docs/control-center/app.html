<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MediaForge Control Center</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center}.spin{width:28px;height:28px;border:2px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot"><div class="spin" aria-label="Carregando"></div></div>
  <script>
  (async()=>{
    try{
      const r=await fetch('./app-core.html?v=20260926-retry2',{cache:'no-store'});
      if(!r.ok)throw new Error('Falha ao carregar o Control Center.');
      let html=await r.text();
      const helper='<script src="./retry-failed-production.js?v=20260926-retry2"></'+'script>';
      html=html.replace('</body>',helper+'\n</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(e){
      document.body.innerHTML='<div style="padding:32px;color:#fff;background:#000;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><h2>Não foi possível carregar o Control Center</h2><p style="color:#aaa">'+String(e&&e.message||e)+'</p></div>';
    }
  })();
  </script>
</body>
</html>
